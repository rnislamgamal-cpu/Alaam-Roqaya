<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مين المختلف؟</title>
<style>
:root{--bg:#eef1f6;--ink:#101828;--blue:#2f6fed;--orange:#f08c00;--ok:#2b9348;--bad:#d62828;--card:#fff;--line:#d5dbe6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;user-select:none;overflow:hidden}
main{height:100%;display:flex;flex-direction:column;padding:10px 9px 12px;max-width:560px;margin:auto}
h1{margin:0 0 4px;text-align:center;font-size:1.35rem}
.bar{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:900;margin-bottom:6px}
.player{min-width:0;display:flex;align-items:center;gap:5px;padding:5px 7px;background:#fff;border-radius:11px;border:2px solid transparent}
.player.on{border-color:var(--ink)}
.player b{max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.74rem}
.player span{font-size:.86rem}
.me{color:var(--blue)}.opp{color:var(--orange)}
#rnd{font-size:.75rem;white-space:nowrap}
.timer{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:5px}
.timer i{display:block;height:100%;background:var(--ink);width:100%;transition:width .08s linear}
.status{text-align:center;min-height:1.6em;font-weight:800;font-size:.82rem;margin-bottom:3px}
.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.grid{display:grid;gap:5px;width:min(100%,64vh);aspect-ratio:1}
.grid.hide{visibility:hidden}.grid.lock{opacity:.42;pointer-events:none}
.cell{background:var(--card);border:2px solid var(--line);border-radius:11px;padding:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.cell img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.cell.bad{border-color:var(--bad);background:#ffe3e3;animation:shake .25s linear}
.cell.good{border-color:var(--ok);background:#d3f9d8;box-shadow:0 0 0 3px rgba(43,147,72,.18)}
.count{position:absolute;font-size:4.5rem;font-weight:900}
.controls{display:flex;gap:6px;justify-content:center;margin-top:6px}
.btn{font:inherit;font-weight:800;border:0;border-radius:11px;padding:8px 12px;background:var(--ink);color:#fff;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
#again{display:none}#again.show{display:inline-block}
.match{display:none;margin-top:5px;padding:7px 9px;border-radius:11px;background:#fff8cf;text-align:center;font-size:.78rem;font-weight:850}
.match.show{display:block}
.foot{font-size:.58rem;opacity:.45;text-align:center;margin-top:4px}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}
@media(max-width:420px){main{padding:7px 5px 9px}h1{font-size:1.15rem}.bar{gap:4px}.player{padding:4px 5px}.player b{font-size:.64rem;max-width:95px}.player span,#rnd{font-size:.66rem}.status{font-size:.72rem}.grid{gap:4px;width:min(100%,63vh)}.cell{padding:4px;border-radius:9px}.count{font-size:3.6rem}.btn{padding:7px 10px;font-size:.7rem}}
@media(prefers-reduced-motion:reduce){.cell.bad{animation:none}}
</style>
</head>
<body>
<main>
  <h1>🔎 مين المختلف؟</h1>
  <div class="bar">
    <div id="meBox" class="player me"><b id="sMe">بابا</b><span id="meScore">٠</span></div>
    <span id="rnd">جولة ١</span>
    <div id="oppBox" class="player opp"><b id="sOpp">رقية</b><span id="oppScore">٠</span></div>
  </div>
  <div class="timer"><i id="tbar"></i></div>
  <div class="status" id="status">جاري تجهيز الجولة…</div>
  <div class="stage">
    <div class="grid hide" id="grid"></div>
    <div class="count" id="count"></div>
  </div>
  <div id="match" class="match"></div>
  <div class="controls">
    <button id="again" class="btn">🔄 العب تاني</button>
    <button id="city" class="btn alt">🎡 المدينة</button>
  </div>
  <div class="foot">Graphics: Twemoji © Twitter, CC-BY 4.0</div>
</main>

<script>
const $=id=>document.getElementById(id);
const IMG=c=>`https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/${c}.svg`;
const G={
  animals:["1f436","1f431","1f42d","1f439","1f430","1f98a","1f43b","1f43c","1f428","1f42f","1f981","1f42e","1f437","1f438","1f435","1f434","1f411","1f418"],
  birds:["1f414","1f427","1f426","1f986","1f989","1f985","1f99c","1f9a2","1f9a9","1f54a"],
  balls:["26bd","1f3c0","1f3c8","26be","1f3be","1f3d0"],
  fruits:["1f34e","1f34a","1f34b","1f34c","1f349","1f347","1f353","1f352","1f351","1f95d","1f34d"],
  vehicles:["1f697","1f695","1f68c","1f693","1f691","1f692","1f69c"],
  sea:["1f41f","1f420","1f421","1f42c","1f433","1f988","1f419"],
  insects:["1f41d","1f41e","1f98b","1f41c","1f41b"]
};
const LINKS=[["animals","balls"],["birds","animals"],["fruits","balls"],["sea","birds"],["insects","fruits"],["vehicles","animals"],["animals","fruits"]];
const H={
  desert:["1f335","1f42a","1f3dc","1f982","1f98e"],
  forest:["1f332","1f333","1f344","1f98c","1f989"],
  arctic:["2744","26c4","1f9ca","1f427","2603"],
  ocean:["1f41f","1f420","1f419","1f980","1f42c"],
  tropic:["1f334","1f965","1f99c","1f34d","1f412"]
};
const COLORFUL=[...G.fruits,...G.balls,...G.vehicles,"1f420","1f98b"];
const ASYM=[...G.vehicles,...G.sea,"1f41f","1f986","1f426"];
const MODES=["category","habitat","color","mirror"];
const E='٠١٢٣٤٥٦٧٨٩',ar=v=>String(v).replace(/[0-9]/g,d=>E[d.charCodeAt(0)-48]);
const sizeFor=n=>Math.min(4+Math.floor((n-1)/2),6);
const timeFor=n=>Math.max(8000,16000-n*600);
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function build(seed,n){
  const R=rng(seed),pick=a=>a[Math.floor(R()*a.length)];
  const size=sizeFor(n),total=size*size,mode=pick(MODES),delta=Math.max(14,70-n*6)*(R()<.5?-1:1);
  let main=()=>"",odd="",base=null;
  if(mode==="category"){const l=pick(LINKS);main=()=>pick(G[l[0]]);odd=pick(G[l[1]])}
  else if(mode==="habitat"){const k=Object.keys(H),a=pick(k),b=pick(k.filter(x=>x!==a));main=()=>pick(H[a]);odd=pick(H[b])}
  else{base=pick(mode==="color"?COLORFUL:ASYM);main=()=>base;odd=base}
  const cells=[];
  for(let i=0;i<total;i++){
    const c={c:main(),rot:(R()-.5)*16,sc:.86+R()*.2,f:"",flip:false};
    if(mode==="color")c.f=`hue-rotate(${((R()-.5)*Math.abs(delta)*.5).toFixed(1)}deg)`;
    cells.push(c);
  }
  const o=Math.floor(R()*total);cells[o].c=odd;
  if(mode==="color")cells[o].f=`hue-rotate(${delta}deg)`;
  if(mode==="mirror")cells[o].flip=true;
  return{size,cells,odd:o,mode};
}

let cfg={role:'guest',childName:'رقية',round:null,scores:{host:0,guest:0},champion:null,winScore:7,serverOffset:0};
let cur=null,curN=-1,lockUntil=0,lastWinnerKey='',lastStatus='',lastBad=null;
const now=()=>Date.now()+(Number(cfg.serverOffset)||0);
const mineName=()=>cfg.role==='host'?'بابا':(cfg.childName||'رقية');
const oppRole=()=>cfg.role==='host'?'guest':'host';
const nameOf=r=>r==='host'?'بابا':(cfg.childName||'رقية');

function newGrid(){
  const r=cfg.round;if(!r)return;
  curN=r.n;cur=build(r.seed,r.n);lockUntil=0;lastBad=null;
  const g=$("grid");g.className="grid hide";g.style.gridTemplateColumns=`repeat(${cur.size},1fr)`;
  g.innerHTML=cur.cells.map((c,i)=>`<button class="cell" data-i="${i}" aria-label="شكل ${i+1}"><img src="${IMG(c.c)}" alt="" loading="eager" decoding="async"
    style="transform:rotate(${c.rot}deg) scale(${c.sc}) ${c.flip?"scaleX(-1)":""};filter:${c.f||"none"}"></button>`).join("");
}
function renderStatic(){
  $("sMe").textContent=mineName();$("sOpp").textContent=nameOf(oppRole());
  $("meScore").textContent=ar(cfg.scores?.[cfg.role]||0);$("oppScore").textContent=ar(cfg.scores?.[oppRole()]||0);
  $("rnd").textContent=cfg.round?`جولة ${ar(cfg.round.n)} • أول واحد لـ ${ar(cfg.winScore||7)}`:'';
  $("again").classList.toggle("show",Boolean(cfg.champion)&&cfg.role==='host');
  $("city").disabled=cfg.role!=='host';
  $("match").classList.toggle("show",Boolean(cfg.champion));
  if(cfg.champion)$("match").textContent=cfg.champion===cfg.role?'🏆 كسبت المباراة!':`🏆 ${nameOf(cfg.champion)} كسب المباراة!`;
  if(cfg.round&&curN!==cfg.round.n)newGrid();
}
$("grid").addEventListener("pointerdown",e=>{
  const b=e.target.closest(".cell");if(!b||!cfg.round||cfg.champion)return;
  const r=cfg.round,t=now(),end=r.startAt+timeFor(r.n);
  if(t<r.startAt||t>end||r.winner||t<lockUntil)return;
  const i=Number(b.dataset.i);
  if(i===cur?.odd){
    b.classList.add("good");
    parent.postMessage({type:'roqaya-odd-claim',index:i,roundNo:r.n,roundId:cfg.roundId},location.origin);
  }else{
    if(lastBad&&lastBad!==b)lastBad.classList.remove('bad');
    b.classList.add("bad");lastBad=b;lockUntil=t+1500;
  }
});
$("again").onclick=()=>{if(cfg.role==='host')parent.postMessage({type:'roqaya-odd-rematch',roundId:cfg.roundId},location.origin)};
$("city").onclick=()=>{if(cfg.role==='host')parent.postMessage({type:'roqaya-odd-city'},location.origin)};

addEventListener('message',e=>{
  if(e.origin!==location.origin||e.data?.type!=='roqaya-odd-config')return;
  cfg={...cfg,...e.data.config};renderStatic();
});

(function loop(){
  if(cfg.round&&!cfg.champion){
    const r=cfg.round,t=now(),end=r.startAt+timeFor(r.n),g=$("grid"),started=t>=r.startAt;
    g.classList.toggle("hide",!started);
    g.classList.toggle("lock",started&&(t<lockUntil||!!r.winner));
    $("count").textContent=started?"":String(Math.max(1,Math.ceil((r.startAt-t)/1000)));
    $("tbar").style.width=started?Math.max(0,(1-(t-r.startAt)/(end-r.startAt))*100)+"%":"100%";
    let status='';
    if(r.winner)status=r.winner===cfg.role?"نقطة ليك ✅":`${nameOf(r.winner)} سبقك ⚡`;
    else if(started&&t>end)status="الوقت خلص";
    else if(t<lockUntil)status="غلط! استنى شوية";
    else if(started)status="اكتشف الشكل المختلف بسرعة 👀";
    else status="استعد…";
    if(status!==lastStatus){$("status").textContent=status;lastStatus=status}
  }else if(cfg.champion){
    $("grid").classList.add("lock");$("count").textContent="";$("tbar").style.width="0%";
    $("status").textContent=cfg.champion===cfg.role?"🎉 إنت بطل المباراة!":`${nameOf(cfg.champion)} كسب المباراة 👏`;
  }
  requestAnimationFrame(loop);
})();
renderStatic();parent.postMessage({type:'roqaya-odd-ready'},location.origin);
</script>
</body>
</html>

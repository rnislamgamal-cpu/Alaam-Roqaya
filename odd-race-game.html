<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مين المختلف؟</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
:root{
  --bg1:#f3f0ff;--bg2:#ffeef7;
  --ink:#2b2350;--ink2:#5b5182;
  --brand:#7c5cff;--brand2:#a78bfa;--pink:#ff7ab6;--sky:#4cc4ff;
  --ok:#22b573;--bad:#ff6b6b;--gold:#ffb020;
  --card:#ffffff;--line:#e4dcff;
  --shadow:0 10px 26px rgba(92,71,166,.14);
  --shadowS:0 4px 12px rgba(92,71,166,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(1100px 520px at 88% -12%,var(--bg2) 0%,transparent 58%),
    radial-gradient(900px 520px at 6% 108%,#e6f6ff 0%,transparent 55%),
    linear-gradient(180deg,#faf8ff 0%,var(--bg1) 100%);
  color:var(--ink);
  font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;overflow:hidden;
}
main{height:100%;display:flex;flex-direction:column;padding:8px 8px 10px;max-width:600px;margin:auto;gap:6px}

/* ---------- score bar ---------- */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.player{
  min-width:0;display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:16px;
  background:var(--card);box-shadow:var(--shadowS);border:2.5px solid transparent;transition:border-color .2s,transform .2s
}
.player.on{border-color:var(--brand);transform:translateY(-1px)}
.player .who{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.player b{max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem;font-weight:900}
.player small{font-size:.58rem;opacity:.6;font-weight:700}
.player .sc{
  margin-inline-start:auto;min-width:34px;text-align:center;font-size:1.05rem;font-weight:900;
  color:#fff;border-radius:11px;padding:2px 7px;background:linear-gradient(180deg,var(--brand2),var(--brand))
}
.player.opp .sc{background:linear-gradient(180deg,#ffa7cd,var(--pink))}
.player.me .pill{background:linear-gradient(180deg,var(--brand2),var(--brand))}
.mid{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px}
.mid .round{font-size:.66rem;font-weight:900;color:var(--ink2);white-space:nowrap}
.mid .goal{font-size:.55rem;font-weight:800;color:var(--gold);white-space:nowrap}

/* ---------- targets row ---------- */
.targets{display:flex;justify-content:center;gap:5px}
.dot{
  width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:.6rem;box-shadow:var(--shadowS)
}
.dot.win{background:linear-gradient(180deg,#ffd88a,var(--gold));border-color:#f0a800;color:#fff}
.dot.me{border-color:var(--brand)}
.dot.opp{border-color:var(--pink)}

/* ---------- timer ---------- */
.timer{height:11px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(92,71,166,.14);position:relative}
.timer i{display:block;height:100%;width:100%;border-radius:8px;background:linear-gradient(90deg,var(--ok),#7ee2a8);transition:width .08s linear,background .3s}
.timer.low i{background:linear-gradient(90deg,#ff8a8a,var(--bad))}
.timer b{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:.6rem;font-weight:900;color:#3b3066;letter-spacing:.5px
}

/* ---------- prompt ---------- */
.status{
  text-align:center;font-size:.74rem;font-weight:900;min-height:1.25em;
  color:var(--brand);display:flex;align-items:center;justify-content:center
}
.prompt{
  text-align:center;font-size:.86rem;font-weight:900;color:var(--ink2);
  min-height:1.4em;display:flex;align-items:center;justify-content:center;gap:6px
}
.prompt .tag{
  font-size:.56rem;font-weight:900;padding:3px 9px;border-radius:999px;color:#fff;
  background:linear-gradient(180deg,var(--brand2),var(--brand))
}
.prompt .tag.hab{background:linear-gradient(180deg,#7ee2a8,var(--ok))}
.prompt .tag.shape{background:linear-gradient(180deg,#8ad8ff,var(--sky))}

/* ---------- stage ---------- */
.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.grid{display:grid;gap:7px;width:min(100%,62vh);aspect-ratio:1;transition:opacity .2s}
.grid.hide{opacity:0;pointer-events:none}
.grid.lock{opacity:.5;pointer-events:none}
.cell{
  position:relative;background:var(--card);border:2.5px solid var(--line);border-radius:16px;
  padding:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;
  box-shadow:var(--shadowS);transition:transform .12s,border-color .15s,background .15s
}
.cell:active{transform:scale(.94)}
.cell img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(43,35,80,.13))}
.cell.bad{border-color:var(--bad);background:#ffeded;animation:shake .3s}
.cell.good{
  border-color:var(--ok);background:#e6fbf0;
  box-shadow:0 0 0 4px rgba(34,181,115,.22),var(--shadow)
}
.cell.good::after{
  content:"⭐";position:absolute;inset-block-start:4px;inset-inline-end:5px;font-size:1.05rem;
  animation:pop .45s ease-out
}
.cell.reveal{border-color:var(--gold);background:#fff8e6;box-shadow:0 0 0 4px rgba(255,176,32,.25)}

/* ---------- centered overlays ---------- */
.center{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center
}
.center.show{display:flex}
.count{
  font-size:5.4rem;font-weight:900;color:var(--brand);
  text-shadow:0 8px 22px rgba(124,92,255,.28);animation:pop .5s ease-out
}
.ready-emo{font-size:3.4rem;animation:bob 1.4s ease-in-out infinite}
.ready-t{font-size:1.02rem;font-weight:900;color:var(--ink2)}
.big-res{font-size:1.5rem;font-weight:900;line-height:1.5}
.big-res .emo{font-size:2.6rem;display:block;animation:pop .6s ease-out}

/* ---------- result panel ---------- */
.result{
  display:none;flex-direction:column;gap:6px;align-items:center;
  padding:10px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);text-align:center
}
.result.show{display:flex;animation:pop .4s ease-out}
.result .ttl{font-size:1rem;font-weight:900}
.result .sub{font-size:.68rem;color:var(--ink2);font-weight:700}

/* ---------- controls ---------- */
.controls{display:flex;gap:8px;justify-content:center}
.btn{
  font:inherit;font-weight:900;border:0;border-radius:15px;padding:12px 18px;cursor:pointer;
  background:linear-gradient(180deg,var(--brand2),var(--brand));color:#fff;box-shadow:var(--shadowS);
  transition:transform .12s,filter .15s;min-height:46px
}
.btn:active{transform:scale(.95)}
.btn.alt{background:#fff;color:var(--ink);border:2.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default;filter:grayscale(.4)}
.btn[hidden]{display:none}

/* ---------- confetti ---------- */
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.cf{position:absolute;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(540deg)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.foot{font-size:.52rem;opacity:.4;text-align:center}
.mute{position:absolute;top:6px;inset-inline-start:8px;border:0;background:#fff;box-shadow:var(--shadowS);
  border-radius:12px;width:38px;height:38px;font-size:1rem;cursor:pointer;z-index:20}

@media(max-width:430px){
  main{padding:6px 6px 8px;gap:5px}
  .grid{gap:6px;width:min(100%,60vh)}
  .cell{padding:5px;border-radius:13px}
  .player{padding:6px 7px;border-radius:14px}
  .player b{font-size:.72rem;max-width:86px}
  .count{font-size:4.4rem}
  .timer{height:10px}
  .btn{padding:11px 15px;min-height:44px;font-size:.8rem}
}
@media(prefers-reduced-motion:reduce){
  .cell.bad,.count,.big-res .emo,.ready-emo,.cell.good::after{animation:none}
  .cf{animation:none;display:none}
}
</style>

</head>
<body>
<main>
  <button id="mute" class="mute" aria-label="الصوت">🔊</button>

  <div class="bar">
    <div id="meBox" class="player me">
      <span aria-hidden="true" id="meEmoji">👨</span>
      <span class="who"><b id="sMe">بابا</b><small>أنا</small></span>
      <span class="sc" id="meScore">٠</span>
    </div>
    <div class="mid">
      <span class="round" id="rnd">جولة ١</span>
      <span class="goal" id="goal">أول واحد لـ ٧</span>
    </div>
    <div id="oppBox" class="player opp">
      <span class="who"><b id="sOpp">رقية</b><small>الخصم</small></span>
      <span class="sc" id="oppScore">٠</span>
      <span aria-hidden="true" id="oppEmoji">👧</span>
    </div>
  </div>

  <div class="targets" id="targets" aria-hidden="true"></div>
  <div class="timer" id="timerBox"><i id="tbar"></i><b id="tlabel"></b></div>
  <div class="prompt" id="prompt"><span class="tag" id="ptag"></span><span id="ptext"></span></div>
  <div class="status" id="status"></div>

  <div class="stage">
    <div class="grid hide" id="grid"></div>
    <div class="center" id="countdown"><div class="count" id="count"></div></div>
    <div class="center" id="ready"><span class="ready-emo" id="readyEmo">🔍</span><span class="ready-t" id="readyT">استعد…</span></div>
    <div class="center" id="finish"><div class="big-res" id="bigRes"></div></div>
  </div>

  <div class="result" id="match"></div>

  <div class="controls">
    <button id="again" class="btn" hidden>🔄 العب تاني</button>
    <button id="city" class="btn alt">🎡 المدينة</button>
  </div>
  <div class="foot">Graphics: Twemoji © Twitter, CC-BY 4.0</div>
</main>
<div id="confetti" aria-hidden="true"></div>

<script>
const $=id=>document.getElementById(id);
const IMG=c=>`https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/${c}.svg`;
const E='٠١٢٣٤٥٦٧٨٩',ar=v=>String(v).replace(/[0-9]/g,d=>E[d.charCodeAt(0)-48]);

/* ---------- picture pools ---------- */
const G={
  animals:["1f436","1f431","1f42d","1f439","1f430","1f98a","1f43b","1f43c","1f428","1f42f","1f981","1f42e","1f437","1f438","1f435","1f434","1f411","1f418"],
  birds:["1f414","1f427","1f426","1f986","1f989","1f985","1f99c","1f9a2","1f9a9","1f54a"],
  balls:["26bd","1f3c0","1f3c8","26be","1f3be","1f3d0"],
  fruits:["1f34e","1f34a","1f34b","1f34c","1f349","1f347","1f353","1f352","1f351","1f95d","1f34d"],
  vehicles:["1f697","1f695","1f68c","1f693","1f691","1f692","1f69c"],
  sea:["1f41f","1f420","1f421","1f42c","1f433","1f988","1f419"],
  insects:["1f41d","1f41e","1f98b","1f41c","1f41b"]
};
/* category pairs: items of group A are "the same kind", one item of group B is the odd one */
const LINKS=[["animals","balls"],["birds","animals"],["fruits","balls"],["sea","birds"],["insects","fruits"],["vehicles","animals"],["animals","fruits"]];
const CAT_LABEL={
  animals:["🐾","حيوانات"],birds:["🐦","طيور"],balls:["⚽","كور"],
  fruits:["🍎","فواكه"],vehicles:["🚗","عربيات"],sea:["🐟","بحر"],insects:["🐝","حشرات"]
};
/* habitat: one landscape has a stranger from another environment */
const H={
  desert:["1f335","1f42a","1f3dc","1f982","1f98e"],
  forest:["1f332","1f333","1f344","1f98c","1f989"],
  arctic:["2744","26c4","1f9ca","1f427","2603"],
  ocean:["1f41f","1f420","1f419","1f980","1f42c"],
  tropic:["1f334","1f965","1f99c","1f34d","1f412"]
};
const H_LABEL={desert:["🏜️","صحرا"],forest:["🌲","غابة"],arctic:["❄️","تلج"],ocean:["🌊","بحر"],tropic:["🌴","جزيرة"]};
/* shape: same object family, one differs by a clearly visible attribute */
const COLORS={red:["1f7e5","أحمر"],blue:["1f7e6","أزرق"],green:["1f7e9","أخضر"],yellow:["1f7e8","أصفر"],purple:["1f7ea","بنفسجي"],orange:["1f7e7","برتقالي"]};
/* mirror-safe + visually asymmetric objects for the "flipped" mode */
const ASYM=["1f697","1f695","1f68c","1f693","1f691","1f692","1f69c","1f41f","1f420","1f421","1f42c","1f433","1f988","1f986","1f426","1f985"];

/* modes ordered easy → hard; a 6-year-old meets (1) category (2) habitat first, shape last */
const MODE_INFO={
  category:{tag:"نفس النوع",cls:"",q:"واحدة مش من نفس النوع… مين المختلفة؟"},
  habitat:{tag:"نفس المكان",cls:"hab",q:"واحدة مش من نفس المكان… مين المختلفة؟"},
  shape:{tag:"مختلفة فعلاً",cls:"shape",q:"بصّي كويس… مين الشكل المختلف؟"}
};
const sizeFor=n=>Math.min(4+Math.floor((n-1)/2),6);
const timeFor=n=>Math.max(9000,15000-n*500);

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* seeded shuffle — consumes the same R() stream as the module so both devices build identical boards (§2) */
function shuf(R,a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

/* ---------- board builder (seeded → identical on both devices) ---------- */
function build(seed,n){
  const R=rng(seed),pick=a=>a[Math.floor(R()*a.length)];
  const size=sizeFor(n),total=size*size;
  /* difficulty ramp: category first, then habitat; shape only from round 4 onwards */
  const pool=n<3?["category","habitat"]:n<5?["category","habitat","habitat"]:["category","habitat","shape","shape"];
  const mode=pick(pool);
  let main=()=>"",odd="",label;
  if(mode==="category"){
    /* same category, but only 2–3 distinct pictures so the "kind" is learnable */
    const l=pick(LINKS),from=G[l[0]],others=G[l[1]];
    const kinds=shuf(R,from).slice(0,Math.min(3,from.length));
    const oddImg=pick(others.filter(x=>!kinds.includes(x)));
    main=()=>pick(kinds); odd=oddImg;
    label=CAT_LABEL[l[1]];
  }else if(mode==="habitat"){
    const k=Object.keys(H),a=pick(k),b=pick(k.filter(x=>x!==a));
    const kinds=shuf(R,H[a]).slice(0,Math.min(3,H[a].length));
    const oddImg=pick(H[b].filter(x=>!kinds.includes(x)));
    main=()=>pick(kinds); odd=oddImg;
    label=H_LABEL[b];
  }else{
    /* shape: every cell is the SAME picture; the odd one is mirrored (clearly asymmetric art) */
    const base=pick(ASYM);
    main=()=>base; odd=base;
    label=["🔄","مقلوبة"];
  }
  const cells=[];
  for(let i=0;i<total;i++){
    const c={c:main(),rot:(R()-.5)*10,sc:.9+R()*.12,flip:false};
    cells.push(c);
  }
  const o=Math.floor(R()*total);
  cells[o].c=odd;
  if(mode==="shape")cells[o].flip=true;
  /* keep the odd image upright and slightly larger so it is findable but fair */
  cells[o].rot=(R()-.5)*6;cells[o].sc=.94+R()*.1;
  return{size,cells,odd:o,mode,label};
}

/* ---------- state ---------- */
let cfg={role:'guest',childName:'رقية',childAge:6,round:null,scores:{host:0,guest:0},champion:null,winScore:7,serverOffset:0};
let cur=null,curN=-1,lockUntil=0,lastWinnerKey='',lastStatus='',lastBad=null,lastPromptKey='',soundOn=true;
const now=()=>Date.now()+(Number(cfg.serverOffset)||0);
const oppRole=()=>cfg.role==='host'?'guest':'host';
const nameOf=r=>r==='host'?'بابا':(cfg.childName||'رقية');
const mineName=()=>cfg.role==='host'?'بابا':(cfg.childName||'رقية');
const age=()=>Math.max(4,Math.min(10,Number(cfg.childAge)||6));

/* ---------- audio (Web Audio, no assets) ---------- */
let AC=null;
function ac(){if(!soundOn)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch{return null}}
function tone(freq,dur=.14,when=0,type='sine',vol=.16){
  const c=ac();if(!c)return;
  const t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);
}
function sfxGood(){tone(660,.12,0);tone(880,.12,.09);tone(1180,.18,.18,'triangle',.14)}
function sfxBad(){tone(230,.18,0,'sawtooth',.11);tone(180,.2,.1,'sawtooth',.09)}
function sfxWin(){[523,659,784,1046].forEach((f,i)=>tone(f,.2,i*.12,'triangle',.15))}
function sfxTick(){tone(880,.06,0,'square',.06)}
let speakOk=true;
const TTS_ON=false; /* القاعدة: النطق ممنوع في الألعاب القائمة على الملاحظة؟ لا — مسموح هنا؛ لكن نتركه معطلاً افتراضياً لتوفير البطارية */
function say(text){
  if(TTS_ON||!soundOn||!speakOk||!text)return;
  try{
    const u=new SpeechSynthesisUtterance(text);u.lang='ar-EG';u.rate=.95;u.pitch=1.1;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch{}
}

/* ---------- confetti ---------- */
function confetti(n=34){
  const box=$('confetti');const cols=['#7c5cff','#ff7ab6','#4cc4ff','#ffb020','#22b573'];
  for(let i=0;i<n;i++){
    const d=document.createElement('i');d.className='cf';
    d.style.insetInlineStart=Math.random()*100+'%';
    d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.1+Math.random()*1.1)+'s';
    d.style.animationDelay=(Math.random()*.3)+'s';
    box.appendChild(d);setTimeout(()=>d.remove(),2600);
  }
}

/* ---------- render ---------- */
function targetsRow(){
  const box=$('targets'),w=Number(cfg.winScore)||7;
  if(!box)return;
  const me=Number(cfg.scores?.[cfg.role]||0),opp=Number(cfg.scores?.[oppRole()]||0);
  let h='';
  for(let i=0;i<w;i++){
    const won=i<Math.max(me,opp);
    const mine=i<me;
    h+=`<span class="dot ${won?'win':''} ${mine?'me':''}">${won?'★':''}</span>`;
  }
  box.innerHTML=h;
}
function newGrid(){
  const r=cfg.round;if(!r)return;
  curN=r.n;cur=build(r.seed,r.n);lockUntil=0;lastBad=null;
  const g=$('grid');g.className='grid hide';
  g.style.gridTemplateColumns=`repeat(${cur.size},1fr)`;
  g.innerHTML=cur.cells.map((c,i)=>`<button class="cell" data-i="${i}" aria-label="شكل ${i+1}"><img src="${IMG(c.c)}" alt="" loading="eager" decoding="async"
    style="transform:rotate(${c.rot.toFixed(1)}deg) scale(${c.sc.toFixed(2)}) ${c.flip?"scaleX(-1)":""}"></button>`).join("");
  lastPromptKey='';
}
function renderStatic(){
  $('sMe').textContent=mineName();$('sOpp').textContent=nameOf(oppRole());
  $('meEmoji').textContent=cfg.role==='host'?'👨':'👧';
  $('oppEmoji').textContent=cfg.role==='host'?'👧':'👨';
  $('meScore').textContent=ar(cfg.scores?.[cfg.role]||0);
  $('oppScore').textContent=ar(cfg.scores?.[oppRole()]||0);
  $('rnd').textContent=cfg.round?`جولة ${ar(cfg.round.n)}`:'';
  $('goal').textContent=`أول واحد لـ ${ar(cfg.winScore||7)}`;
  targetsRow();
  $('again').hidden=!(cfg.champion&&cfg.role==='host');
  $('city').disabled=cfg.role!=='host';
  $('match').classList.toggle('show',Boolean(cfg.champion));
  $('finish').classList.toggle('show',Boolean(cfg.champion));
  if(cfg.champion){
    const won=cfg.champion===cfg.role;
    $('bigRes').innerHTML=won
      ? '<span class="emo">🏆</span>إنت بطل المباراة!'
      : `<span class="emo">🎉</span>${nameOf(cfg.champion)} كسب المباراة`;
    $('match').innerHTML=`<div class="ttl">${won?'🎊 مبروك يا بطل!':'👏 كانت مباراة حلوة!'}</div>
      <div class="sub">${ar(cfg.scores?.[cfg.role]||0)} — ${ar(cfg.scores?.[oppRole()]||0)}</div>`;
  }
  if(cfg.round&&curN!==cfg.round.n)newGrid();
}

/* ---------- input ---------- */
$('grid').addEventListener('pointerdown',e=>{
  const b=e.target.closest('.cell');if(!b||!cfg.round||cfg.champion)return;
  const r=cfg.round,t=now(),end=r.startAt+timeFor(r.n);
  if(t<r.startAt||t>end||r.winner||t<lockUntil)return;
  const i=Number(b.dataset.i);
  if(i===cur?.odd){
    b.classList.add('good');sfxGood();
    parent.postMessage({type:'roqaya-odd-claim',index:i,roundNo:r.n,roundId:cfg.roundId},location.origin);
  }else{
    if(lastBad&&lastBad!==b)lastBad.classList.remove('bad');
    b.classList.add('bad');lastBad=b;lockUntil=t+1400;sfxBad();
  }
});
$('again').onclick=()=>{if(cfg.role==='host'){ac();parent.postMessage({type:'roqaya-odd-rematch',roundId:cfg.roundId},location.origin)}};
$('city').onclick=()=>{if(cfg.role==='host')parent.postMessage({type:'roqaya-odd-city'},location.origin)};
$('mute').onclick=()=>{soundOn=!soundOn;$('mute').textContent=soundOn?'🔊':'🔇';if(!soundOn)try{speechSynthesis.cancel()}catch{}};
addEventListener('pointerdown',()=>ac(),{once:true});

addEventListener('message',e=>{
  if(e.origin!==location.origin||e.data?.type!=='roqaya-odd-config')return;
  const before=cfg.round?.n, champBefore=cfg.champion;
  cfg={...cfg,...e.data.config};
  renderStatic();
  if(cfg.champion&&!champBefore){sfxWin();confetti();}
  if(cfg.round&&before!==cfg.round.n)lastWinnerKey='';
});

/* ---------- loop ---------- */
let lastCount=-1;
function tick(){
  if(cfg.champion){
    $('grid').className='grid lock';
    $('countdown').classList.remove('show');$('ready').classList.remove('show');
    $('tbar').style.width='0%';$('tlabel').textContent='';
    $('prompt').style.visibility='hidden';$('status').textContent='';
  }else if(cfg.round){
    const r=cfg.round,t=now(),end=r.startAt+timeFor(r.n),g=$('grid');
    const started=t>=r.startAt, remain=Math.max(0,end-t);
    g.classList.toggle('hide',!started);
    g.classList.toggle('lock',started&&(t<lockUntil||!!r.winner));
    /* countdown */
    const cd=Math.ceil((r.startAt-t)/1000);
    $('countdown').classList.toggle('show',!started&&cd>0);
    if(!started&&cd!==lastCount){$('count').textContent=ar(Math.max(1,cd));lastCount=cd;if(cd<=3)sfxTick()}
    if(started)lastCount=-1;
    $('ready').classList.remove('show');
    /* timer */
    const frac=started?Math.max(0,remain/(end-r.startAt)):1;
    $('tbar').style.width=(frac*100)+'%';
    $('timerBox').classList.toggle('low',started&&frac<.3);
    $('tlabel').textContent=started?ar(Math.ceil(remain/1000))+' ث':'';
    /* prompt + tag */
    if(started&&cur){
      const info=MODE_INFO[cur.mode]||MODE_INFO.category;
      $('ptag').textContent=info.tag;$('ptag').className='tag '+info.cls;
      const key=cur.mode+':'+cur.label[1];
      if(key!==lastPromptKey){$('ptext').textContent=info.q;lastPromptKey=key}
      $('prompt').style.visibility='visible';
    }else{
      $('prompt').style.visibility='hidden';
    }
    /* status line */
    let status='';
    if(r.winner)status=r.winner===cfg.role?'نقطة ليك ✅':`${nameOf(r.winner)} سبقك ⚡`;
    else if(started&&remain<=0)status='الوقت خلص';
    else if(t<lockUntil)status='قربتي… جرّبي تاني';
    else if(started)status='';
    else status='استعد…';
    if(status!==lastStatus){$('status').textContent=status;lastStatus=status}
  }else{
    $('countdown').classList.remove('show');$('ready').classList.remove('show');
    $('prompt').style.visibility='hidden';$('status').textContent='';
  }
}
/* rAF for smoothness + a setTimeout safety net (background tabs / weak devices stop rAF) */
let lastRaf=0;
(function loop(ts){
  const t=typeof ts==='number'?ts:0;
  if(t-lastRaf>=60){lastRaf=t;try{tick()}catch(e){console.warn('odd loop',e)}}
  requestAnimationFrame(loop);
})(0);
setInterval(()=>{try{tick()}catch(e){console.warn('odd tick',e)}},250);

renderStatic();
parent.postMessage({type:'roqaya-odd-ready'},location.origin);
</script>
</body>

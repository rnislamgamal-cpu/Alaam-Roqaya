<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لعبة الذاكرة</title>
<style>
:root{--bg:#eef2ff;--ink:#1e1b4b;--card:#fff;--accent:#7c3aed;--p1:#d62839;--p2:#1d4ed8}
*{box-sizing:border-box}
html,body{margin:0;min-height:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 8px 24px;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
h1{margin:0;font-size:1.45rem}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.controls{width:min(96vw,760px);display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:stretch}
label{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card);padding:7px 9px;border-radius:12px;font-weight:800;min-width:0}
input[type=range]{width:min(34vw,190px);accent-color:var(--accent)}
button{font:inherit;border:0;border-radius:10px;padding:9px 12px;background:var(--accent);color:#fff;font-weight:850;cursor:pointer}
button:disabled,input:disabled{opacity:.48;cursor:default}
#city{background:#6046a4}
#hud{position:sticky;top:0;z-index:5;width:100%;padding:4px 0 5px;background:rgba(238,242,255,.96);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;gap:4px}
#score{width:min(96vw,620px);display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pc{padding:5px 10px;border:3px solid var(--c);border-radius:14px;background:#fff;text-align:center;font-size:1.1rem;font-weight:900;line-height:1.15;transition:transform .2s,background .2s,color .2s}
.pc small{display:block;font-size:.68rem;font-weight:800}
.pc.on{background:var(--c);color:#fff;transform:scale(1.035)}
#msg{margin:0;min-height:1.45em;font-weight:900;text-align:center;font-size:.8rem}
#board{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--g);direction:ltr;max-width:100%}
.card{width:var(--s);height:var(--s);padding:0;border:0;background:none;perspective:600px;cursor:pointer;touch-action:manipulation;user-select:none}
.in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .32s}
.card.up .in{transform:rotateY(180deg)}
.f{position:absolute;inset:0;display:grid;place-items:center;border-radius:14%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{background:var(--accent);color:#fff;font-size:calc(var(--s)*.5);font-weight:900;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.face{background:#fff;transform:rotateY(180deg);font-size:calc(var(--s)*.58);line-height:1;box-shadow:inset 0 0 0 3px #d4d4f5}
.card.done{cursor:default}
.card.done.owner-host .face{box-shadow:inset 0 0 0 4px var(--p1)}
.card.done.owner-guest .face{box-shadow:inset 0 0 0 4px var(--p2)}
.card:disabled{opacity:1}
.tip{margin:0;max-width:620px;color:#4c4a7a;font-size:.76rem;text-align:center;line-height:1.55}
.finish{width:min(96vw,620px);background:#fff8cc;border-radius:13px;padding:7px 10px;text-align:center;font-size:.78rem;font-weight:900}
@media(max-width:430px){
  body{gap:7px;padding-inline:5px}
  h1{font-size:1.22rem}
  .controls{grid-template-columns:minmax(0,1fr) auto auto;gap:4px}
  label{padding:6px 5px;font-size:.65rem}
  input[type=range]{width:min(30vw,130px)}
  button{padding:7px 8px;font-size:.65rem}
  .pc{font-size:.9rem;padding:4px 6px}.pc small{font-size:.59rem}
  #msg{font-size:.7rem}.tip{font-size:.66rem}
}
@media(prefers-reduced-motion:reduce){.in,.pc{transition:none}}
</style>
</head>
<body>
<h1>🃏 لعبة الذاكرة</h1>

<div class="controls">
  <label>الكروت: <b id="cnt">١٦</b>
    <input id="pairs" type="range" min="2" max="50" value="8" aria-label="عدد الأزواج">
  </label>
  <button id="new">لعبة جديدة</button>
  <button id="city">🎡 المدينة</button>
</div>

<div id="hud">
  <div id="score">
    <div id="hostPc" class="pc" style="--c:var(--p1)"><small>👨 بابا</small><span>٠</span></div>
    <div id="guestPc" class="pc" style="--c:var(--p2)"><small>👧 رقية</small><span>٠</span></div>
  </div>
  <p id="msg" aria-live="polite">جاري تجهيز اللعبة…</p>
</div>

<div id="board"></div>
<div id="finish" class="finish" hidden></div>
<p class="tip">كل لاعب في دوره بيقلب كارتين. لو شبه بعض بياخد نقطة ويلعب تاني، ولو مختلفين الكروت بترجع تتقلب والدور ينتقل للتاني. بابا يقدر يختار من ٤ لحد ١٠٠ كارت.</p>

<script>
const $=s=>document.querySelector(s),board=$('#board');
const EASTERN='٠١٢٣٤٥٦٧٨٩';
const ar=v=>String(v).replace(/[0-9]/g,d=>EASTERN[d.charCodeAt(0)-48]);
let cfg={
  role:'guest',childName:'رقية',roundId:0,pairs:8,deck:[],
  revealed:[],matchedBy:{},turn:'host',scores:{host:0,guest:0},
  waiting:false,finished:false,result:null
};
let lastDeckKey='',resizeTimer=0;

const nameOf=r=>r==='host'?'بابا':(cfg.childName||'رقية');
const mine=()=>cfg.turn===cfg.role&&!cfg.waiting&&!cfg.finished;
const matched=i=>Boolean(cfg.matchedBy?.[i]);
const open=i=>matched(i)||(cfg.revealed||[]).includes(i);

function layout(){
  const n=cfg.deck?.length||16,W=Math.min(innerWidth-16,760),g=n>=60?4:6,min=n>=60?34:40;
  const cols=Math.max(2,Math.min(Math.ceil(Math.sqrt(n)),Math.floor((W+g)/(min+g))));
  const s=Math.min(n<=12?96:n<=30?76:n<=60?56:44,Math.floor((W-(cols-1)*g)/cols));
  board.style.cssText=`--s:${s}px;--g:${g}px;width:${cols*s+(cols-1)*g}px`;
}
function cardHtml(e,i){
  const owner=cfg.matchedBy?.[i]||'';
  return `<button class="card ${open(i)?'up':''} ${owner?'done owner-'+owner:''}" data-i="${i}" aria-label="كارت" ${(!mine()||open(i))?'disabled':''}>
    <span class="in"><span class="f back">؟</span><span class="f face">${e}</span></span>
  </button>`;
}
function renderBoard(){
  const key=`${cfg.roundId}:${(cfg.deck||[]).join('')}`;
  if(key!==lastDeckKey){
    lastDeckKey=key;
    board.innerHTML=(cfg.deck||[]).map(cardHtml).join('');
    layout();
  }else{
    [...board.querySelectorAll('.card')].forEach((b,i)=>{
      const owner=cfg.matchedBy?.[i]||'';
      b.classList.toggle('up',open(i));
      b.classList.toggle('done',Boolean(owner));
      b.classList.toggle('owner-host',owner==='host');
      b.classList.toggle('owner-guest',owner==='guest');
      b.disabled=!mine()||open(i);
    });
  }
}
function renderHud(){
  const host=$('#hostPc'),guest=$('#guestPc');
  host.classList.toggle('on',cfg.turn==='host'&&!cfg.finished);
  guest.classList.toggle('on',cfg.turn==='guest'&&!cfg.finished);
  host.querySelector('span').textContent=ar(cfg.scores?.host||0);
  guest.querySelector('span').textContent=ar(cfg.scores?.guest||0);
  guest.querySelector('small').textContent=`👧 ${cfg.childName||'رقية'}`;

  const msg=$('#msg');
  if(cfg.finished){
    if(cfg.result==='draw')msg.textContent='🎉 تعادل جميل!';
    else msg.textContent=`🎉 ${nameOf(cfg.result)} كسب الجولة!`;
  }else if(cfg.waiting){
    msg.textContent='👀 بنبص على الكارتين…';
  }else if(mine()){
    msg.textContent=`✨ دورك يا ${nameOf(cfg.role)} — اقلب كارتين`;
  }else{
    msg.textContent=`دور ${nameOf(cfg.turn)} ⏳`;
  }

  $('#pairs').value=String(cfg.pairs||8);
  $('#cnt').textContent=`${ar((cfg.pairs||8)*2)} كارت`;
  $('#pairs').disabled=cfg.role!=='host';
  $('#new').disabled=cfg.role!=='host';
  $('#city').disabled=cfg.role!=='host';

  const finish=$('#finish');
  finish.hidden=!cfg.finished;
  if(cfg.finished){
    const hs=cfg.scores?.host||0,gs=cfg.scores?.guest||0;
    finish.textContent=cfg.result==='draw'
      ? `🤝 تعادل! بابا ${ar(hs)} • ${nameOf('guest')} ${ar(gs)}`
      : `🏆 ${nameOf(cfg.result)} كسب! بابا ${ar(hs)} • ${nameOf('guest')} ${ar(gs)}`;
  }
}
function render(){
  renderHud();renderBoard();
}
function sendPick(i){
  if(!mine()||open(i))return;
  parent.postMessage({type:'roqaya-memory-pick',index:i,roundId:cfg.roundId},location.origin);
}
board.addEventListener('click',e=>{
  const b=e.target.closest('.card');
  if(!b)return;
  sendPick(Number(b.dataset.i));
});
$('#pairs').oninput=()=>{
  const p=Number($('#pairs').value)||8;
  $('#cnt').textContent=`${ar(p*2)} كارت`;
};
$('#pairs').onchange=()=>{
  try{localStorage.setItem('roqaya-memory-pairs',$('#pairs').value)}catch{}
};
$('#new').onclick=()=>{
  if(cfg.role!=='host')return;
  const pairs=Math.max(2,Math.min(50,Number($('#pairs').value)||8));
  parent.postMessage({type:'roqaya-memory-new',pairs},location.origin);
};
$('#city').onclick=()=>{
  if(cfg.role==='host')parent.postMessage({type:'roqaya-memory-city'},location.origin);
};
addEventListener('resize',()=>{
  clearTimeout(resizeTimer);resizeTimer=setTimeout(layout,80);
});
addEventListener('message',e=>{
  if(e.origin!==location.origin||e.data?.type!=='roqaya-memory-config')return;
  cfg={...cfg,...e.data.config};
  render();
});
render();
parent.postMessage({type:'roqaya-memory-ready'},location.origin);
</script>
</body>
</html>

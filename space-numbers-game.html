<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مغامرة أرقام الفضاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   M4.28 — «مغامرة أرقام الفضاء»
   ألوان الفضاء + كروت مقلوبة بالتسلسل من ١ للأكبر.
   صفر Tailwind، صفر مكتبات — Web Audio فقط.
   ============================================================ */
:root{
  --bg1:#0d102b; --bg2:#1b1e4b; --bg3:#2a1b4e;
  --ink:#fff; --amber:#fbbf24; --cyan:#67e8f9; --emerald:#34d399; --rose:#fb7185;
  --panel:rgba(30,27,75,.72); --panel-border:rgba(129,140,248,.30);
  --line:rgba(129,140,248,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:'Cairo',system-ui,Tahoma,sans-serif;
  background:radial-gradient(circle at 20% 20%,#26296e 0%,#131638 45%,#090b1f 100%);
  color:var(--ink);user-select:none;overflow:hidden;
}
.stars-bg{
  background-image:
    radial-gradient(2px 2px at 40px 60px,#fff,rgba(0,0,0,0)),
    radial-gradient(2px 2px at 120px 150px,#ffe58f,rgba(0,0,0,0)),
    radial-gradient(1.5px 1.5px at 220px 80px,#a5f3fc,rgba(0,0,0,0)),
    radial-gradient(2px 2px at 300px 210px,#f9a8d4,rgba(0,0,0,0)),
    radial-gradient(1.5px 1.5px at 80px 260px,#fff,rgba(0,0,0,0));
  background-repeat:repeat;background-size:350px 300px;
}
.hide{display:none!important}

/* ===================== الهيدر: سطرين أيقوني (M16) ===================== */
#hdr{
  position:relative;z-index:5;flex:0 0 auto;
  margin:2px 4px 3px;padding:2px 5px;
  background:var(--panel);border:1px solid var(--panel-border);
  border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.35);
  display:flex;flex-direction:column;gap:2px;
}
.hdr-row{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.hdr-row::-webkit-scrollbar{display:none}
.hdr-main{justify-content:space-between}
.hdr-spacer{flex:1 1 auto;min-width:0}
.pill{
  flex:0 0 auto;display:flex;align-items:center;gap:3px;
  background:rgba(23,20,58,.85);border:1px solid var(--line);
  border-radius:9px;padding:1px 7px;font-weight:800;font-size:.66rem;
  line-height:1.5;white-space:nowrap;color:#c7d2fe;
}
.pill b{font-size:.72rem;font-weight:900}
.pill.time b{color:var(--cyan);font-variant-numeric:tabular-nums}
.pill.moves b{color:var(--amber)}
.pill.score-host{border-color:rgba(52,211,153,.45)} .pill.score-host b{color:var(--emerald)}
.pill.score-guest{border-color:rgba(251,113,133,.45)} .pill.score-guest b{color:var(--rose)}
/* شريط الدور: مين بيلعب دلوقتي */
.pill.turn{border-width:2px;transition:border-color .25s,background .25s}
.pill.turn.mine{border-color:var(--emerald);background:rgba(16,185,129,.18);color:#a7f3d0}
.pill.turn.wait{border-color:rgba(129,140,248,.35);color:#94a3b8}
.pill.turn.mine b{color:#6ee7b7}
/* نجم واقف: نقطة صغيرة جنب اسم اللاعب */
.dot{width:.5rem;height:.5rem;border-radius:50%;background:#64748b;flex:0 0 auto}
.dot.on{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.9);animation:pulseDot 1.1s infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.45}}
.hbtn{
  flex:0 0 auto;min-height:26px;min-width:26px;padding:1px 7px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(30,27,75,.85);border:1px solid var(--line);
  border-radius:9px;color:#e0e7ff;font:inherit;font-size:.72rem;font-weight:900;
  cursor:pointer;transition:transform .12s,background .15s;
}
.hbtn:active{transform:scale(.93)}
.hbtn.on{background:linear-gradient(180deg,#fbbf24,#f59e0b);color:#1e1b4b;border-color:#fcd34d}
.hbtn:disabled{opacity:.4;cursor:default}
#net-dot{width:.62rem;height:.62rem;border-radius:50%;background:#f43f5e;box-shadow:0 0 6px rgba(244,63,94,.8)}
#net-dot.ok{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.8)}
.muted-slash{position:relative}
.muted-slash::after{
  content:'';position:absolute;left:2px;right:2px;top:50%;height:2px;
  background:#f43f5e;transform:rotate(-20deg);border-radius:2px;
}

/* ===================== التخطيط العام ===================== */
#app-shell{
  height:100vh;height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;
  max-width:820px;margin:0 auto;padding:0 6px max(4px,env(safe-area-inset-bottom));
}
#view-play{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}

/* شريط التحكم المضغوط */
#controls{
  flex:0 0 auto;display:flex;align-items:center;gap:3px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--panel-border);
  border-radius:11px;padding:3px 5px;margin-bottom:3px;
}
.ctrl-label{font-size:.62rem;font-weight:800;color:#a5b4fc;white-space:nowrap}
.preset{
  min-width:26px;min-height:24px;padding:1px 6px;
  background:rgba(30,27,75,.7);border:1px solid var(--line);border-radius:7px;
  color:#c7d2fe;font:inherit;font-size:.68rem;font-weight:900;cursor:pointer;
}
.preset.sel{background:linear-gradient(180deg,#fbbf24,#f59e0b);color:#1e1b4b;border-color:#fcd34d}
#count-slider{flex:1 1 70px;min-width:60px;accent-color:#fbbf24;height:14px;cursor:pointer}
.seg{display:flex;background:rgba(15,19,51,.85);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{
  min-height:24px;padding:1px 8px;border:0;background:transparent;color:#c7d2fe;
  font:inherit;font-size:.68rem;font-weight:900;cursor:pointer;
}
.seg button.sel{background:linear-gradient(180deg,#34d399,#10b981);color:#052e1a}

/* ===================== لوحة الكروت ===================== */
#board-section{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center}
#cards-grid{
  --gap:.5rem;isolation:isolate;
  display:grid;gap:var(--gap);width:100%;margin:0 auto;
  align-content:center;justify-content:center;
  grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));
}
#cards-grid>[data-deck-index]{min-height:0;height:100%;display:flex;align-items:center;justify-content:center}

/* ===================== آلية القلب 3D ===================== */
.card-scene{
  perspective:1200px;position:relative;container-type:size;container-name:card;
  overflow:visible;aspect-ratio:3/4;min-height:0;z-index:1;
  width:var(--card-w,100%);height:var(--card-h,100%);margin:0 auto;cursor:pointer;
}
.card-scene.is-flipped,.card-scene.is-solved,.card-scene.is-wrong,.card-scene.just-solved{z-index:20}
.card-scene.is-flipping{z-index:30}
.card-inner{
  position:absolute;inset:0;width:100%;height:100%;
  transition:transform .55s cubic-bezier(.36,.06,.2,1);
  transform-style:preserve-3d;transform-origin:center center;
}
.card-scene.is-flipped .card-inner{transform:rotateY(180deg)}
.card-face{
  position:absolute;inset:0;width:100%;height:100%;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:1rem;overflow:hidden;
  --card-pad:6cqi;--card-badge:15cqi;--card-badge-font:9cqi;--card-emoji-font:14cqi;
  --card-circle:44cqi;--card-circle-font:26cqi;--card-title-font:7.5cqi;
}
.card-back{
  transform:rotateY(0deg);background:#17143a;
  box-shadow:0 10px 25px -5px rgba(0,0,0,.5),0 0 0 3px rgba(251,191,36,.65);
}
.card-back img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.card-front{
  transform:rotateY(180deg);
  box-shadow:0 10px 25px -5px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.85);
  display:flex;flex-direction:column;justify-content:space-between;
  position:absolute;padding:var(--card-pad);
}
.cf-deco{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.cf-deco svg{width:100%;height:100%;opacity:.25;pointer-events:none}
.cf-row{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;width:100%}
.cf-badge{
  border-radius:.5rem;background:rgba(255,255,255,.9);color:#0f172a;font-weight:900;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3);
  width:var(--card-badge);height:var(--card-badge);font-size:var(--card-badge-font);
}
.cf-emoji{filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));line-height:1;font-size:var(--card-emoji-font)}
.cf-center{position:relative;z-index:2;margin:auto 0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:2%}
.cf-circle{
  border-radius:50%;background:rgba(255,255,255,.95);color:#020617;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(0,0,0,.35);border:4px solid #fff;flex:0 0 auto;
  width:var(--card-circle);height:var(--card-circle);
}
.cf-circle span{font-weight:900;letter-spacing:-.03em;line-height:1;font-size:var(--card-circle-font)}
.cf-title{
  border-radius:999px;background:rgba(2,6,23,.55);color:#fff;font-weight:700;
  text-align:center;line-height:1.15;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:var(--card-title-font);padding:.15em .6em;
}
.card-scene.is-solved .card-front{box-shadow:0 0 20px rgba(52,211,153,.85),0 0 0 3.5px #34d399}
.card-scene.is-wrong .card-front{box-shadow:0 0 22px rgba(244,63,94,.9),0 0 0 3.5px #f43f5e}
@keyframes shakeError{
  0%,100%{transform:rotateY(180deg) translateX(0)}
  20%{transform:rotateY(180deg) translateX(-6px)}
  40%{transform:rotateY(180deg) translateX(6px)}
  60%{transform:rotateY(180deg) translateX(-4px)}
  80%{transform:rotateY(180deg) translateX(4px)}
}
.card-scene.is-wrong .card-inner{animation:shakeError .48s ease-in-out}
@keyframes popSuccess{
  0%{box-shadow:0 0 0 rgba(52,211,153,0)}
  50%{box-shadow:0 0 32px rgba(52,211,153,.95)}
  100%{box-shadow:0 0 18px rgba(52,211,153,.85)}
}
.card-scene.just-solved .card-front{animation:popSuccess .45s ease-out}
@media (hover:hover){.card-scene:not(.is-flipped):hover .card-front{filter:brightness(1.12)}}

/* ===================== مودال الفوز ===================== */
.modal{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(2,6,23,.82);backdrop-filter:blur(6px);padding:14px;
}
.modal.hide{display:none!important}
.modal-box{
  background:linear-gradient(180deg,#312e81,#1e1b4b 55%,#020617);
  border:2px solid #fbbf24;border-radius:22px;max-width:400px;width:100%;
  padding:20px 16px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6);
}
.modal-box .big{font-size:3.2rem;line-height:1;margin-bottom:6px;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.modal-box h2{margin:0 0 14px;font-size:1.4rem;color:#fcd34d;font-weight:900}
.modal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:rgba(15,19,51,.85);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:16px}
.modal-stats div span{display:block;font-size:1rem;font-weight:900;margin-top:2px}
.modal-btns{display:flex;gap:8px}
.modal-btns button{flex:1;min-height:46px;border-radius:13px;border:0;font:inherit;font-size:.85rem;font-weight:900;cursor:pointer}
.btn-primary{background:linear-gradient(180deg,#fbbf24,#f59e0b);color:#1e1b4b;box-shadow:0 4px 0 #b45309}
.btn-secondary{background:#3730a3;color:#fff;box-shadow:0 4px 0 #1e1b4b}

/* ===================== الشريط السفلي ===================== */
.footer-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:55;
  width:100%;max-width:820px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;
  padding:6px 6px max(8px,env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(13,16,43,0),rgba(9,11,31,.97) 36%);
}
.footer-bar button{
  min-height:40px;padding:7px 13px;border:1px solid var(--line);border-radius:11px;
  background:rgba(30,27,75,.9);color:#e0e7ff;font:inherit;font-size:.74rem;font-weight:900;
  cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35);
}
.footer-bar button.primary{background:linear-gradient(180deg,#fbbf24,#f59e0b);color:#1e1b4b;border-color:#fcd34d}
.footer-bar button:disabled{opacity:.4;cursor:default}
#app-shell{padding-bottom:56px}

/* ===================== شاشة الفوز/الدور ===================== */
#banner{
  flex:0 0 auto;text-align:center;font-size:.7rem;font-weight:900;
  min-height:1.1rem;line-height:1.1rem;margin-bottom:2px;color:#c7d2fe;
}
#banner.ok{color:var(--emerald)} #banner.err{color:var(--rose)} #banner.info{color:var(--cyan)}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#0f1333}
::-webkit-scrollbar-thumb{background:#4338ca;border-radius:9999px}

@media(max-width:520px){
  .pill{font-size:.6rem;padding:1px 5px}
  .hbtn{min-height:24px;min-width:24px;font-size:.68rem}
  .card-face{border-radius:.7rem}
}
</style>
</head>
<body class="stars-bg">

  <!-- صورة ظهر الكارت الموحّدة (ملف خارجي — M4.28) -->
  <img id="master-card-back-img" src="assets/space-back.jpg" alt="" style="display:none" />

  <div id="app-shell">

    <!-- ============ الهيدر: سطرين أيقوني ============ -->
    <header id="hdr">
      <div class="hdr-row hdr-main">
        <div class="pill"><span id="net-dot" title="الاتصال"></span></div>
        <button id="snd" class="hbtn" type="button" title="الصوت">🎤</button>
        <button id="home" class="hbtn" type="button" title="المدينة">🎡</button>
        <span class="hdr-spacer"></span>
        <div class="pill time">⏱️<b id="timer-text">00:00</b></div>
        <div class="pill moves">👆<b id="moves-count-text">٠</b></div>
      </div>
      <div class="hdr-row">
        <div class="pill turn wait" id="turn-pill"><span class="dot" id="turn-dot"></span><b id="turn-text">—</b></div>
        <span class="hdr-spacer"></span>
        <div class="pill score-host">🧑‍🚀<b id="score-host">٠</b></div>
        <div class="pill score-guest">👧<b id="score-guest">٠</b></div>
      </div>
      <div class="hdr-row">
        <div class="pill">🎯<b id="target-text">١</b></div>
        <span class="hdr-spacer"></span>
        <button id="peek" class="hbtn" type="button" title="نظرة سريعة">👁️</button>
        <button id="new" class="hbtn" type="button" title="توزيع جديد">🔄</button>
      </div>
    </header>

    <!-- ============ شريط التحكم ============ -->
    <div id="controls">
      <span class="ctrl-label">الكروت:</span>
      <button type="button" class="preset" data-count="5">٥</button>
      <button type="button" class="preset" data-count="8">٨</button>
      <button type="button" class="preset sel" data-count="10">١٠</button>
      <button type="button" class="preset" data-count="12">١٢</button>
      <button type="button" class="preset" data-count="15">١٥</button>
      <button type="button" class="preset" data-count="20">٢٠</button>
      <input id="count-slider" type="range" min="3" max="20" value="10" />
      <div class="seg" title="لو غلط">
        <button id="mode-keep" class="sel" type="button">🌟 مبسّط</button>
        <button id="mode-reset" type="button">🔥 تحدي</button>
      </div>
    </div>

    <div id="banner"></div>

    <!-- ============ لوحة اللعب ============ -->
    <main id="view-play">
      <section id="board-section">
        <div id="cards-grid"></div>
      </section>
    </main>
  </div>

  <!-- ============ الشريط السفلي ============ -->
  <div class="footer-bar">
    <button id="city" type="button">🎡 المدينة</button>
  </div>

  <!-- ============ مودال الفوز ============ -->
  <div id="win-modal" class="modal hide">
    <div class="modal-box">
      <div class="big">🏆</div>
      <h2 id="win-title">بطل الفضاء الخارق!</h2>
      <div class="modal-stats">
        <div>🃏<span id="win-cards" style="color:#6ee7b7">١٠</span></div>
        <div>👆<span id="win-moves" style="color:#fcd34d">٠</span></div>
        <div>⏱️<span id="win-time" style="color:#67e8f9">00:00</span></div>
      </div>
      <div class="modal-btns">
        <button id="win-again" class="btn-primary" type="button">🚀 تاني</button>
        <button id="win-more" class="btn-secondary" type="button">⬆️ كروت أكتر</button>
      </div>
    </div>
  </div>

<script>
/* ==================== 20 SPACE CARD DESIGNS (1 TO 20) ==================== */
/* M4.28: الـgradient بقى CSS حقيقي بدل Tailwind */
const SPACE_CARDS_DATA = [

  { num: 8, title: "الشمس الذهبية", emoji: "☀️", grad: ["#fb923c","#ef4444","#78350f"], accent: "#fb923c", badgeBg: "#ea580c" },
  { num: 9, title: "المجرة الحلزونية", emoji: "🌌", grad: ["#6366f1","#6d28d9","#020617"], accent: "#a78bfa", badgeBg: "#6d28d9" },
  { num: 10, title: "كوكب الأرض", emoji: "🌍", grad: ["#60a5fa","#059669","#1e1b4b"], accent: "#60a5fa", badgeBg: "#2563eb" },
  { num: 11, title: "القمر الصناعي", emoji: "🛰️", grad: ["#64748b","#4f46e5","#0f172a"], accent: "#93c5fd", badgeBg: "#3b82f6" },
  { num: 12, title: "تلسكوب النجوم", emoji: "🔭", grad: ["#8b5cf6","#7e22ce","#1e1b4b"], accent: "#c084fc", badgeBg: "#7c3aed" },
  { num: 13, title: "صديق فضائي", emoji: "👾", grad: ["#d946ef","#db2777","#1e1b4b"], accent: "#f472b6", badgeBg: "#db2777" },
  { num: 14, title: "النيزك المتوهج", emoji: "🌠", grad: ["#f59e0b","#e11d48","#1e1b4b"], accent: "#fcd34d", badgeBg: "#e11d48" },
  { num: 15, title: "محطة الفضاء", emoji: "🛸", grad: ["#22d3ee","#2563eb","#020617"], accent: "#67e8f9", badgeBg: "#0284c7" },
  { num: 16, title: "قوس المجرة", emoji: "🌈", grad: ["#ec4899","#9333ea","#1e3a8a"], accent: "#f9a8d4", badgeBg: "#9333ea" },

/* ==================== Web Audio — ممنوع speechSynthesis ==================== */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playSound(type) {
  if (!state.soundEnabled) return;
  try {
    const ctx = getAudioCtx(); if (!ctx) return;
    const now = ctx.currentTime;
    if (type === 'flip') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(320, now);
      o.frequency.exponentialRampToValueAtTime(520, now + 0.08);
      g.gain.setValueAtTime(0.12, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now + 0.09);
    } else if (type === 'correct') {
      [523.25, 659.25, 783.99].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(f, now + i * 0.07);
        g.gain.setValueAtTime(0.001, now + i * 0.07);
        g.gain.exponentialRampToValueAtTime(0.16, now + i * 0.07 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.18);
        o.connect(g); g.connect(ctx.destination);
        o.start(now + i * 0.07); o.stop(now + i * 0.07 + 0.2);
      });
    } else if (type === 'wrong') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 900;
      o.type = 'sine';
      o.frequency.setValueAtTime(300, now);
      o.frequency.exponentialRampToValueAtTime(180, now + 0.3);
      g.gain.setValueAtTime(0.14, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
      o.connect(lp); lp.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now + 0.34);
    } else if (type === 'peek') {
      const dur = 0.34, fc = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, fc, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < fc; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / fc);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1400;
      const g = ctx.createGain(); g.gain.value = 0.07;
      src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(now);
    } else if (type === 'win') {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(f, now + i * 0.13);
        g.gain.setValueAtTime(0.001, now + i * 0.13);
        g.gain.exponentialRampToValueAtTime(0.2, now + i * 0.13 + 0.03);
        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.13 + 0.45);
        o.connect(g); g.connect(ctx.destination);
        o.start(now + i * 0.13); o.stop(now + i * 0.13 + 0.5);
      });
    }
  } catch (e) { /* الصوت مش حرج */ }
}

/* ==================== منطق الجولة ==================== */
/* مولّد أرقام عشوائي ثابت (mulberry32) — نفس الـseed = نفس الترتيب على الجهازين */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
/* خلط ثابت: نفس الـseed ونفس عدد الكروت = نفس الترتيب بالظبط على كل الأجهزة */
function shuffleArray(arr, seed) {
  const c = [...arr];
  const R = mulberry32(Number(seed) || 1);
  for (let i = c.length - 1; i > 0; i--) {
    const j = Math.floor(R() * (i + 1));
    [c[i], c[j]] = [c[j], c[i]];
  }
  return c;
}
function stopTimer() { if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; } }
function startTimerIfNeeded() {

  stopTimer();
  state.timerInterval = setInterval(() => { state.timerSeconds++; updateTimerUI(); }, 1000);
}
function formatTime(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function updateTimerUI() {

  if (o.totalCards) state.totalCards = o.totalCards;
  if (o.mode) state.errorMode = o.mode;
  state.targetNumber = Number(o.target) || 1;
  state.moves = 0; state.mistakes = 0;
  state.timerSeconds = 0; state.gameStarted = false; state.isLocked = false; state.wonShown = false;

/* ==================== قياس اللوحة لتناسب الشاشة ==================== */
function chooseColumns(count, availW, availH) {
  let best = { cols: 1, score: -Infinity };
  const ar = 3 / 4, gap = 8;
  for (let cols = 1; cols <= count; cols++) {
    const rows = Math.ceil(count / cols);
    const cellW = (availW - gap * (cols - 1)) / cols;
    const cellH = (availH - gap * (rows - 1)) / rows;
    if (cellW <= 0 || cellH <= 0) continue;
    const cardW = Math.min(cellW, cellH * ar);
    const cardH = cardW / ar;
    const usedW = cardW * cols + gap * (cols - 1);
    const usedH = cardH * rows + gap * (rows - 1);
    const empty = (availW * availH) - (usedW * usedH);
    const score = cardW * cardH * 1000 - empty * 0.05 - Math.abs((availW / Math.max(availH, 1)) - (usedW / Math.max(usedH, 1))) * 400;
    if (score > best.score) best = { cols, score };
  }
  return best.cols;
}
function fitBoard() {
  const gridEl = document.getElementById('cards-grid');
  const boardEl = document.getElementById('board-section');
  if (!gridEl || !boardEl) return;
  const count = state.totalCards;
  const availW = gridEl.clientWidth || boardEl.clientWidth || 320;
  const availH = boardEl.clientHeight || 300;
  const gap = availW < 520 ? 6 : 8;
  const cols = chooseColumns(count, availW, availH);
  const rows = Math.ceil(count / cols);
  gridEl.style.setProperty('--cols', cols);
  gridEl.style.setProperty('--gap', gap + 'px');
  gridEl.style.gap = gap + 'px';
  const maxCardW = (availW - gap * (cols - 1)) / cols;
  const maxCardH = (availH - gap * (rows - 1)) / rows;
  const cardW = Math.max(18, Math.min(maxCardW, maxCardH * (3 / 4)));
  const cardH = cardW * (4 / 3);
  gridEl.style.setProperty('--card-w', cardW + 'px');
  gridEl.style.setProperty('--card-h', cardH + 'px');
  gridEl.style.gridTemplateColumns = `repeat(${cols}, ${cardW}px)`;
  gridEl.style.gridTemplateRows = `repeat(${rows}, ${cardH}px)`;
  gridEl.style.gridAutoRows = cardH + 'px';
}

function renderBoard() {
  const gridEl = document.getElementById('cards-grid');
  gridEl.className = '';
  gridEl.id = 'cards-grid';
  fitBoard();
  gridEl.innerHTML = state.deck.map((c, i) => {
    const extra = c.justSolved ? 'just-solved' : '';
    return `<div data-deck-index="${i}">${buildCardHTML(c, c.isFlipped, c.isSolved, c.isWrong, extra)}</div>`;
  }).join('');
  gridEl.querySelectorAll('[data-deck-index]').forEach(w => {
    w.addEventListener('click', () => handleCardClick(Number(w.getAttribute('data-deck-index'))));
  });
  requestAnimationFrame(fitBoard);
  setTimeout(fitBoard, 250);
}

function renderHUD() {
  const el = document.getElementById('moves-count-text');

/* ==================== أنيميشن القلب الموضعي ==================== */
function getCardSceneEl(i) { return document.querySelector(`#cards-grid [data-deck-index="${i}"] .card-scene`); }
let stackCounter = 20;
function bringCardToFront(scene) {
  if (!scene) return;
  if (scene.dataset.stack) { scene.style.zIndex = scene.dataset.stack; return; }
  stackCounter++; scene.dataset.stack = String(stackCounter); scene.style.zIndex = String(stackCounter);
}
function resetAllStacks() {
  stackCounter = 20;
  document.querySelectorAll('#cards-grid .card-scene').forEach(s => { s.style.zIndex = ''; delete s.dataset.stack; });
}
function animateCardFlip(index, toFlipped, done) {
  const scene = getCardSceneEl(index);
  if (!scene) { if (done) done(); return; }
  playSound('flip');
  if (toFlipped) { bringCardToFront(scene); scene.classList.add('is-flipped'); }
  else scene.classList.remove('is-flipped');
  setTimeout(() => { if (done) done(); }, 570);
}

/* ==================== حركة الخصم (كارت اتفتح عنده) ==================== */
/* رجّع كل الكروت لوضعها الأساسي (وضع «تحدي») */
function resetBoard() {
  state.deck.forEach(c => { c.isFlipped = false; c.isSolved = false; c.isWrong = false; c.justSolved = false; });
  document.querySelectorAll('#cards-grid .card-scene').forEach(s => s.classList.remove('is-flipped', 'is-solved', 'is-wrong', 'just-solved', 'is-flipping'));
  resetAllStacks();
  state.targetNumber = 1; updateTargetUI(); renderHUD();
}
/* الخصم فتح كارت → نعمل نفس الحركة عندنا */
function applyRemoteFlip(num, ok) {
  const i = state.deck.findIndex(c => c.num === num);
  if (i < 0) return;
  const card = state.deck[i];
  const el = getCardSceneEl(i);
  if (ok) {
    if (card.isSolved) return;
    card.isFlipped = true; card.isSolved = true; card.isWrong = false;
    if (el) {
      bringCardToFront(el);
      el.classList.add('is-flipped', 'is-solved', 'just-solved');
      setTimeout(() => el.classList.remove('just-solved'), 420);
    }
    playSound('correct');
    return;
  }
  if (card.isSolved || card.isWrong) return;
  card.isFlipped = true; card.isWrong = true;
  if (el) { bringCardToFront(el); el.classList.add('is-flipped', 'is-wrong'); }
  playSound('wrong');
  setTimeout(() => {
    if (state.errorMode === 'reset') { resetBoard(); return; }
    if (el) el.classList.remove('is-flipped', 'is-wrong');
    card.isFlipped = false; card.isWrong = false;
  }, state.errorMode === 'reset' ? 760 : 1150);
}
/* الفوز (مرة واحدة بس — حتى لو الـconfig اتكرر) */
function celebrateWin(text) {
  if (state.wonShown) return;
  state.wonShown = true;
  stopTimer();
  if (text) setBanner(text, 'ok');
  playSound('win');
  showWinModal();
}

/* ==================== الضغط على كارط ==================== */
function handleCardClick(index) {
  if (state.isLocked) return;
  /* في اللعب المشترك: الكارت ما ينفعش غير لصاحب الدور (§4) */
  if (!myTurn() || S.champion) { setBanner('مش دورك — استنى ' + theirName(), 'err'); return; }
  const card = state.deck[index];
  if (!card || card.isFlipped || card.isSolved) return;

  startTimerIfNeeded();
  state.moves++;
  renderHUD();
  state.isLocked = true;
  card.isFlipped = true;

  animateCardFlip(index, true, () => {
    if (card.num === state.targetNumber) {
      playSound('correct');
      card.isSolved = true;
      const el = getCardSceneEl(index);
      if (el) { el.classList.add('is-solved', 'just-solved'); setTimeout(() => el.classList.remove('just-solved'), 420); }
      state.targetNumber++;
      updateTargetUI();

      /* ✅ صح — العدد الصح اتفتح */
      pendingLocal = { num: card.num, ok: true };
      post('roqaya-space-hit', { num: card.num, target: state.targetNumber, moves: state.moves });

      if (state.targetNumber > state.totalCards) {
        /* 🎉 خلصت كل الأرقام → ده فائز الجولة */
        state.isLocked = false;
        setTimeout(() => { celebrateWin('🎉 خلصنا كل الأرقام!'); }, 420);
        return;
      }
      setBanner('✅ صح! دور على ' + formatNum(state.targetNumber), 'ok');
      renderHUD();
      state.isLocked = false;
    } else {
      playSound('wrong');
      state.mistakes++;
      card.isWrong = true;
      const el = getCardSceneEl(index);
      if (el) el.classList.add('is-wrong');
      renderHUD();
      setBanner('❌ ده ' + formatNum(card.num) + ' — دوّر على ' + formatNum(state.targetNumber), 'err');

      /* ❌ غلط — في اللعب المشترك: الدور يروح للخصم */
      pendingLocal = { num: card.num, ok: false };
      post('roqaya-space-miss', { num: card.num, target: state.targetNumber, mode: state.errorMode });

      if (state.errorMode === 'keep') {
        setTimeout(() => {
          if (el) el.classList.remove('is-wrong');
          animateCardFlip(index, false, () => { card.isFlipped = false; card.isWrong = false; state.isLocked = false; });
        }, 620);
      } else {
        setTimeout(() => {
          const open = [];
          state.deck.forEach((c, i) => { if (c.isFlipped || c.isSolved || c.isWrong) open.push(i); });
          open.forEach((i, order) => {
            const c = state.deck[i], sceneEl = getCardSceneEl(i);
            setTimeout(() => {
              animateCardFlip(i, false, () => {
                c.isFlipped = false; c.isSolved = false; c.isWrong = false; c.justSolved = false;
                if (sceneEl) sceneEl.classList.remove('is-solved', 'is-wrong', 'just-solved');
              });
            }, order * 70);
          });
          setTimeout(() => {
            resetBoard();
            state.isLocked = false;
          }, open.length * 70 + 760);
        }, 700);
      }
    }
  });
}

/* ==================== نظرة سريعة ==================== */
function triggerQuickPeek() {
  if (state.isLocked) return;
  state.isLocked = true;
  playSound('peek');
  setBanner('👁️ نظرة سريعة…', 'info');
  const up = [];
  state.deck.forEach((c, i) => { if (!c.isFlipped) up.push(i); });
  up.forEach((i, order) => setTimeout(() => {
    const el = getCardSceneEl(i);
    if (el) el.classList.add('is-flipped');
    state.deck[i].isFlipped = true;
  }, order * 60));
  setTimeout(() => {
    const down = [];
    state.deck.forEach((c, i) => { if (!c.isSolved) down.push(i); });
    playSound('flip');
    down.forEach((i, order) => setTimeout(() => {
      const el = getCardSceneEl(i);
      if (el) el.classList.remove('is-flipped');
      state.deck[i].isFlipped = false;
    }, order * 60));
    setTimeout(() => { state.isLocked = false; setBanner('', ''); }, down.length * 60 + 560);
  }, 2200 + up.length * 60);
}

    const c = Number(b.getAttribute('data-count'));
    b.classList.toggle('sel', c === state.totalCards);
    b.textContent = formatNum(c);
  });
  document.getElementById('mode-keep').classList.toggle('sel', state.errorMode === 'keep');
  document.getElementById('mode-reset').classList.toggle('sel', state.errorMode === 'reset');
  const snd = document.getElementById('snd');
  snd.textContent = '🎤';
  snd.classList.toggle('on', state.soundEnabled);
  snd.classList.toggle('muted-slash', !state.soundEnabled);
}

/* ==================== الأحداث ==================== */
document.addEventListener('DOMContentLoaded', () => {
  /* --- أزرار الكروت: بابا بس (§4) --- */
  document.querySelectorAll('.preset').forEach(b => b.addEventListener('click', () => {
    if (!isHost()) { setBanner('بابا بس اللي يغيّر عدد الكروت 🙂', 'err'); return; }
    post('roqaya-space-count', { count: Number(b.getAttribute('data-count')) });
  }));
  const slider = document.getElementById('count-slider');
  slider.addEventListener('input', e => {
    if (!isHost()) { e.target.value = state.totalCards; return; }
    post('roqaya-space-count', { count: Number(e.target.value) });
  });
  slider.addEventListener('change', e => {
    if (!isHost()) { e.target.value = state.totalCards; return; }
    post('roqaya-space-count', { count: Number(e.target.value) });
  });
  document.getElementById('mode-keep').addEventListener('click', () => {
    if (!isHost()) { setBanner('بابا بس اللي يغيّر الوضع 🙂', 'err'); return; }
    post('roqaya-space-mode', { mode: 'keep' });
  });
  document.getElementById('mode-reset').addEventListener('click', () => {
    if (!isHost()) { setBanner('بابا بس اللي يغيّر الوضع 🙂', 'err'); return; }
    post('roqaya-space-mode', { mode: 'reset' });
  });
  document.getElementById('peek').addEventListener('click', triggerQuickPeek);
  document.getElementById('new').addEventListener('click', () => {
    if (!isHost()) { setBanner('بابا بس اللي يبدأ جولة جديدة 🙂', 'err'); return; }
    playSound('flip'); post('roqaya-space-new', {});
  });
  document.getElementById('snd').addEventListener('click', () => {
    state.soundEnabled = !state.soundEnabled; updateControlsUI();
    if (state.soundEnabled) playSound('flip');
  });
  document.getElementById('win-again').addEventListener('click', () => {
    if (!isHost()) { setBanner('بابا بس اللي يبدأ جولة جديدة 🙂', 'err'); return; }
    post('roqaya-space-new', {});
  });
  document.getElementById('win-more').addEventListener('click', () => {
    if (!isHost()) { setBanner('بابا بس اللي يغيّر عدد الكروت 🙂', 'err'); return; }
    post('roqaya-space-count', { count: Math.min(20, state.totalCards + 2) });
  });
  document.getElementById('city').addEventListener('click', () => {
    if (!isHost()) { setBanner('بابا بس اللي يرجع للمدينة 🙂', 'err'); return; }
    post('roqaya-space-city', {});
  });
  document.getElementById('home').addEventListener('click', () => {
    if (!isHost()) { setBanner('بابا بس اللي يرجع للمدينة 🙂', 'err'); return; }
    post('roqaya-space-city', {});
  });

  let fitT = null;
  const scheduleFit = () => {
    if (fitT) clearTimeout(fitT);
    fitT = setTimeout(() => {
      document.querySelectorAll('#cards-grid > [data-deck-index]').forEach(w => w.style.height = '');
      fitBoard();
    }, 120);
  };
  window.addEventListener('resize', scheduleFit);
  window.addEventListener('orientationchange', scheduleFit);

  initGame();
  /* نعلن جاهزيتنا للموديول (هو يرد ب config) */
  if (!readySent) { readySent = true; post('roqaya-space-ready', {}); }
  setTimeout(() => { if (!readySent) { readySent = true; post('roqaya-space-ready', {}); } }, 600);
});

/* ==================== رسائل الوحدة الأم (الموديول) ==================== */
addEventListener('message', e => {
  if (e.origin !== location.origin) return;
  const d = e.data || {};
  if (d.type === 'roqaya-space-config') {
    const c = d.config || {};
    const prevKey = (S.roundId || 0) + ':' + (S.seed || 0) + ':' + (S.totalCards || 0) + ':' + (S.mode || '');
    const prevTarget = S.target, prevTurn = S.turn, prevChampion = S.champion;

    S = { ...S, ...c };
    S.scores = c.scores || S.scores || { host: 0, guest: 0 };

    const key = (S.roundId || 0) + ':' + (S.seed || 0) + ':' + (S.totalCards || 0) + ':' + (S.mode || '');
    const needRebuild = (key !== prevKey) || !state.deck.length;

    /* ---- حركة الخصم: كارت اتفتح عنده (flipSeq/flipNum/flipOk/flipBy) ---- */
    const seq = Number(c.flipSeq) || 0;
    const flipNum = Number(c.flipNum) || 0;
    const flipOk = !!c.flipOk;
    let doRemoteFlip = false;
    if (needRebuild) {
      S.appliedSeq = seq;                 /* جولة جديدة → عدّاد الحركات يبدأ من جديد */
      pendingLocal = null;
    } else if (seq > (Number(S.appliedSeq) || 0)) {
      S.appliedSeq = seq;
      const by = String(c.flipBy || '');
      const mine = by ? (by === me())
        : (!!pendingLocal && pendingLocal.num === flipNum && pendingLocal.ok === flipOk);
      pendingLocal = null;
      if (!mine && flipNum > 0) doRemoteFlip = true;
    }

    if (needRebuild) {
      /* جولة جديدة / تغيّر في الإعدادات → ابني اللوحة من جديد بنفس الترتيب */
      initGame({ totalCards: S.totalCards, mode: S.mode, target: S.target, keepBanner: true });
      setBanner(myTurn() ? 'دورك يا ' + myName() + '! 🎯' : 'دور ' + theirName() + ' — استنى…', myTurn() ? 'ok' : 'info');
    } else {
      /* نفس الجولة — حدّث الهدف والدور والنتيجة فقط */
      if (Number(S.target) !== Number(prevTarget)) {
        state.targetNumber = Number(S.target) || 1;
        updateTargetUI();
      }
      if (S.turn !== prevTurn) {
        setBanner(myTurn() ? 'دورك يا ' + myName() + '! 🎯' : 'دور ' + theirName() + ' — استنى…', myTurn() ? 'ok' : 'info');
      }
      if (doRemoteFlip) applyRemoteFlip(flipNum, flipOk);
    }
    /* الفوز بيظهر حتى لو الصفحة اتحمّلت من جديد والجولة خلصت */
    if (S.champion && !prevChampion) {
      celebrateWin(S.champion === me() ? '🏆 فزت يا ' + myName() + '!' : '🏁 ' + theirName() + ' كسب الجولة');
    }
    renderTurn();
    return;
  }
  /* الخصم فتح كارت → نتعامل معاه من الـconfig (flipSeq/flipNum/flipOk) */
});

</script>

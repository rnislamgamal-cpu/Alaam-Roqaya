<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اقلب بالترتيب</title>
<style>
:root{
  --bg1:#f3f0ff;--bg2:#e8fbff;--ink:#2b2350;--ink2:#5b5182;
  --brand:#7c5cff;--brand2:#a78bfa;--pink:#ff7ab6;--sky:#4cc4ff;--gold:#ffb020;
  --ok:#22b573;--bad:#ff6b6b;--card:#fff;--line:#e4dcff;
  --shadow:0 10px 26px rgba(92,71,166,.14);--shadowS:0 4px 12px rgba(92,71,166,.10)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(1000px 500px at 90% -10%,var(--bg2) 0%,transparent 58%),
    radial-gradient(900px 500px at 5% 110%,#ffeef7 0%,transparent 55%),
    linear-gradient(180deg,#faf9ff 0%,var(--bg1) 100%);
  color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;overflow:hidden
}
main{height:100%;display:flex;flex-direction:column;padding:8px 8px 10px;max-width:600px;margin:auto;gap:6px}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.player{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:16px;background:var(--card);
  box-shadow:var(--shadowS);border:2.5px solid transparent;transition:border-color .2s,transform .2s}
.player.on{border-color:var(--brand);transform:translateY(-1px)}
.player .who{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.player b{max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem;font-weight:900}
.player small{font-size:.58rem;opacity:.6;font-weight:700}
.mid{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:82px}
.mid .round{font-size:.66rem;font-weight:900;color:var(--ink2);white-space:nowrap}
.mid .goal{font-size:.55rem;font-weight:800;color:var(--gold);white-space:nowrap}
.status{text-align:center;font-size:.78rem;font-weight:900;min-height:1.3em;display:flex;align-items:center;justify-content:center;gap:6px}
.status .tag{font-size:.58rem;font-weight:900;padding:3px 10px;border-radius:999px;color:#fff;background:linear-gradient(180deg,var(--brand2),var(--brand))}
.status .tag.peek{background:linear-gradient(180deg,#8ad8ff,var(--sky))}
.status .tag.turn{background:linear-gradient(180deg,#ffd06b,var(--gold));color:#4a2f00}
.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.grid{display:grid;gap:7px;width:min(100%,60vh);aspect-ratio:1}
.grid.lock{pointer-events:none}
.cell{
  position:relative;background:linear-gradient(165deg,#8f74ff,#6b4de6);border:2.5px solid rgba(255,255,255,.5);
  border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;
  box-shadow:var(--shadowS);transition:transform .14s,background .2s;perspective:600px
}
.cell:active{transform:scale(.94)}
.cell .face{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.1rem,6vw,2rem);font-weight:900;backface-visibility:hidden;transition:transform .32s,opacity .32s;
  color:#fff;text-shadow:0 2px 5px rgba(40,25,90,.35)
}
.cell .back{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:1.35rem;opacity:0;transform:rotateY(180deg);transition:transform .32s,opacity .32s;
  background:var(--card);border-radius:13px
}
.cell.open{background:linear-gradient(165deg,#fff,#f1ecff);border-color:var(--brand)}
.cell.open .face{transform:rotateY(-180deg);opacity:0}
.cell.open .back{transform:rotateY(0);opacity:1}
.cell.done{background:linear-gradient(165deg,#d8fbe8,#b6f2d2);border-color:var(--ok)}
.cell.done .back{background:transparent;color:var(--ok)}
.cell.bad{border-color:var(--bad);animation:shake .32s}
.cell.hint{box-shadow:0 0 0 4px rgba(255,176,32,.45),var(--shadowS)}
.center{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.center.show{display:flex}
.center#finish{background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(243,240,255,.97));border-radius:18px;box-shadow:0 10px 30px rgba(92,71,166,.2);z-index:5}
.center#countdown{background:rgba(255,255,255,.82);border-radius:18px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:4}
.count{font-size:5.2rem;font-weight:900;color:var(--brand);text-shadow:0 8px 22px rgba(124,92,255,.28);animation:pop .5s}
.big-res{font-size:1.4rem;font-weight:900;line-height:1.5}
.big-res .emo{font-size:2.6rem;display:block;animation:pop .6s}
.result{display:none;flex-direction:column;gap:6px;align-items:center;padding:10px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);text-align:center}
.result.show{display:flex;animation:pop .4s}
.result .ttl{font-size:1rem;font-weight:900}
.result .sub{font-size:.68rem;color:var(--ink2);font-weight:700}
.controls{display:flex;gap:8px;justify-content:center}
.btn{font:inherit;font-weight:900;border:0;border-radius:15px;padding:12px 18px;cursor:pointer;
  background:linear-gradient(180deg,var(--brand2),var(--brand));color:#fff;box-shadow:var(--shadowS);min-height:46px;transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn.alt{background:#fff;color:var(--ink);border:2.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.btn[hidden]{display:none}
.foot{font-size:.52rem;opacity:.4;text-align:center}
.mute{position:absolute;top:6px;inset-inline-start:8px;border:0;background:#fff;box-shadow:var(--shadowS);border-radius:12px;width:38px;height:38px;font-size:1rem;cursor:pointer;z-index:20}
.legend{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;font-size:.62rem;font-weight:800;color:var(--ink2)}
.legend span{background:#fff;border-radius:999px;padding:3px 9px;box-shadow:var(--shadowS)}
.legend span.on{background:linear-gradient(180deg,#ffd06b,var(--gold));color:#4a2f00}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.cf{position:absolute;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(540deg)}}
@media(max-width:430px){
  main{padding:6px 6px 8px;gap:5px}
  .grid{gap:6px;width:min(100%,58vh)}
  .player b{font-size:.72rem;max-width:86px}
  .count{font-size:4.2rem}
  .btn{padding:11px 15px;min-height:44px;font-size:.8rem}
}
@media(prefers-reduced-motion:reduce){
  .cell.bad,.count,.big-res .emo{animation:none}
  .cf{display:none}
  .cell .face,.cell .back{transition:none}
}
</style>
</head>
<body>
<main>
  <button id="mute" class="mute" aria-label="الصوت">🔊</button>

  <div class="bar">
    <div id="meBox" class="player me"><span id="meEmoji">👨</span><span class="who"><b id="sMe">بابا</b><small>أنا</small></span></div>
    <div class="mid"><span class="round" id="rnd">جولة ١</span><span class="goal" id="goal">الترتيب ١ ← ٩</span></div>
    <div id="oppBox" class="player opp"><span class="who"><b id="sOpp">رقية</b><small>الخصم</small></span><span id="oppEmoji">👧</span></div>
  </div>

  <div class="status" id="status"><span class="tag" id="stag"></span><span id="stext"></span></div>
  <div class="legend" id="legend"></div>

  <div class="stage">
    <div class="grid" id="grid"></div>
    <div class="center" id="countdown"><div class="count" id="count"></div></div>
    <div class="center" id="finish"><div class="big-res" id="bigRes"></div></div>
  </div>

  <div class="result" id="match"></div>
  <div class="controls">
    <button id="again" class="btn" hidden>🔄 العب تاني</button>
    <button id="city" class="btn alt">🎡 المدينة</button>
  </div>
  <div class="foot">التوزيع متطابق على الجهازين (Seed مشترك) • أرقام عربية</div>
</main>
<div id="confetti" aria-hidden="true"></div>

<script>
const $=id=>document.getElementById(id);
const E='٠١٢٣٤٥٦٧٨٩',ar=v=>String(v).replace(/[0-9]/g,d=>E[d.charCodeAt(0)-48]);

/* ---------- constants ---------- */
const EMOJI=['🍎','⭐','🎈','🐱','🌸','🚗','🧸','🍓','🐟','🌈','🎁','🐝','🍋','⚽','🦋','🍇','🎵','🌻','🐢','🍩','🎨','🐬','🍀','🚀'];
/* difficulty ramp: 6,9,12,16,20,25 cards */
const COUNT_FOR=n=>[6,9,12,16,20,25][Math.min(n-1,5)]||25;
const PEEK_MS=n=>Math.max(1400,4200-n*350);   /* peek time shrinks with rounds */
const GRID_COLS=c=>c<=6?3:c<=9?3:c<=12?4:c<=16?4:5;

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(R,a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

/* ---------- build: identical on both devices from one seed ---------- */
function build(seed,n){
  const R=rng(seed);
  const count=COUNT_FOR(n);
  /* cards hold numbers 1..count, placed at seeded positions; each card also gets an emoji face */
  const nums=[...Array(count)].map((_,i)=>i+1);
  const faces=shuf(R,EMOJI).slice(0,count);
  const cells=nums.map((num,i)=>({num,face:faces[i]}));
  /* shuffle positions */
  const order=shuf(R,[...Array(count)].map((_,i)=>i));
  const placed=new Array(count);
  for(let i=0;i<count;i++)placed[order[i]]=cells[i];
  return{count,cols:GRID_COLS(count),cells:placed};
}

/* ---------- state ---------- */
let cfg={role:'guest',childName:'رقية',childAge:6,serverOffset:0,round:null,winTarget:3,
  scores:{host:0,guest:0},champion:null,board:null};
let cur=null,lastRoundKey='',soundOn=true,lastBad=null,lastStatus='',lastTagKey='';
const now=()=>Date.now()+(Number(cfg.serverOffset)||0);
const oppRole=()=>cfg.role==='host'?'guest':'host';
const nameOf=r=>r==='host'?'بابا':(cfg.childName||'رقية');
const mineName=()=>cfg.role==='host'?'بابا':(cfg.childName||'رقية');
const myTurn=()=>Boolean(cfg.round&&!cfg.round.winner&&!cfg.champion&&cfg.round.turn===cfg.role);

/* ---------- audio ---------- */
let AC=null;
function ac(){if(!soundOn)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch{return null}}
function tone(f,d=.14,w=0,type='sine',v=.15){const c=ac();if(!c)return;const t=c.currentTime+w,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03)}
function sGood(){tone(660,.1,0);tone(880,.12,.08);tone(1180,.16,.16,'triangle',.13)}
function sBad(){tone(240,.18,0,'sawtooth',.11);tone(185,.2,.1,'sawtooth',.09)}
function sWin(){[523,659,784,1046].forEach((f,i)=>tone(f,.2,i*.12,'triangle',.14))}
function sTick(){tone(880,.06,0,'square',.06)}
function confetti(n=34){const b=$('confetti'),c=['#7c5cff','#ff7ab6','#4cc4ff','#ffb020','#22b573'];for(let i=0;i<n;i++){const d=document.createElement('i');d.className='cf';d.style.insetInlineStart=Math.random()*100+'%';d.style.background=c[i%c.length];d.style.animationDuration=(1.1+Math.random()*1.1)+'s';d.style.animationDelay=(Math.random()*.3)+'s';b.appendChild(d);setTimeout(()=>d.remove(),2600)}}

/* ---------- render ---------- */
function newBoard(){
  const r=cfg.round;if(!r)return;
  cur=build(r.seed,r.n);lastBad=null;
  const g=$('grid');g.className='grid';g.style.gridTemplateColumns=`repeat(${cur.cols},1fr)`;
  g.innerHTML=cur.cells.map((c,i)=>`<button class="cell" data-i="${i}" aria-label="كارت ${i+1}">
    <span class="face">${c.face}</span><span class="back">${ar(c.num)}</span></button>`).join('');
  lastTagKey='';
}
/* `opened` stores card POSITIONS (indices) → resolve to card NUMBERS for display */
function openSet(){return new Set((cfg.round?.opened||[]).map(i=>cur?.cells?.[Number(i)]?.num).filter(n=>n!=null).map(Number))}
function openIdxSet(){return new Set((cfg.round?.opened||[]).map(Number))}
function renderStatic(){
  $('sMe').textContent=mineName();$('sOpp').textContent=nameOf(oppRole());
  $('meEmoji').textContent=cfg.role==='host'?'👨':'👧';
  $('oppEmoji').textContent=cfg.role==='host'?'👧':'👨';
  $('rnd').textContent=cfg.round?`جولة ${ar(cfg.round.n)}`:'';
  $('goal').textContent=cfg.round?`الترتيب ١ ← ${ar(Number(cfg.round.next)||1)}`:'';
  $('again').hidden=!(cfg.champion&&cfg.role==='host');
  $('city').disabled=cfg.role!=='host';
  $('match').classList.toggle('show',Boolean(cfg.champion));
  $('finish').classList.toggle('show',Boolean(cfg.champion));
  if(cfg.champion){
    const won=cfg.champion===cfg.role;
    $('bigRes').innerHTML=won?'<span class="emo">🏆</span>إنت بطل المباراة!':`<span class="emo">🎉</span>${nameOf(cfg.champion)} كسب المباراة`;
    $('match').innerHTML=`<div class="ttl">${won?'🎊 مبروك يا بطل!':'👏 كانت مباراة حلوة!'}</div>
      <div class="sub">${ar(cfg.scores?.[cfg.role]||0)} — ${ar(cfg.scores?.[oppRole()]||0)}</div>`;
  }
  renderLegend();
}
function renderLegend(){
  const box=$('legend');if(!box)return;
  const r=cfg.round;if(!r){box.innerHTML='';return}
  const opened=openSet(),next=Number(r.next)||1;
  let h='';
  for(let i=1;i<=Math.min(Number(cur?.count||r.count||0),25);i++){
    const cls=opened.has(i)?'on':'';
    h+=`<span class="${cls}">${ar(i)}</span>`;
  }
  box.innerHTML=h;
}

/* ---------- input ---------- */
$('grid').addEventListener('pointerdown',e=>{
  const b=e.target.closest('.cell');if(!b)return;
  const r=cfg.round;
  if(!r||r.winner||cfg.champion||r.phase!=='play'||!myTurn())return;
  const i=Number(b.dataset.i),cell=cur.cells[i];
  const opened=openSet(),next=Number(r.next)||1;
  if(opened.has(cell.num))return;                       /* already open */
  if(cell.num===next){
    b.classList.add('done');sGood();
    parent.postMessage({type:'roqaya-seq-open',index:i,roundId:cfg.roundId},location.origin);
  }else{
    if(lastBad&&lastBad!==b)lastBad.classList.remove('bad');
    b.classList.add('bad');lastBad=b;sBad();
    parent.postMessage({type:'roqaya-seq-wrong',index:i,roundId:cfg.roundId},location.origin);
  }
});
$('again').onclick=()=>{if(cfg.role==='host'){ac();parent.postMessage({type:'roqaya-seq-rematch',roundId:cfg.roundId},location.origin)}};
$('city').onclick=()=>{if(cfg.role==='host')parent.postMessage({type:'roqaya-seq-city'},location.origin)};
$('mute').onclick=()=>{soundOn=!soundOn;$('mute').textContent=soundOn?'🔊':'🔇'};
addEventListener('pointerdown',()=>ac(),{once:true});

addEventListener('message',e=>{
  if(e.origin!==location.origin||e.data?.type!=='roqaya-seq-config')return;
  const c=e.data.config||{};
  const beforeKey=cfg.round?`${cfg.round.n}:${cfg.roundId}`:'', champBefore=cfg.champion;
  cfg={...cfg,...c};
  renderStatic();
  const key=cfg.round?`${cfg.round.n}:${cfg.roundId}`:'';
  if(key!==beforeKey||!cur){lastRoundKey=key;newBoard()}
  if(cfg.champion&&!champBefore){sWin();confetti()}
});

/* ---------- loop: peek → play, and turn/status display ---------- */
let lastCount=-1;
function tick(){
  const r=cfg.round,g=$('grid');
  if(cfg.champion){
    g.className='grid lock';$('countdown').classList.remove('show');
    $('stext').textContent='';$('stag').textContent='';$('stag').className='tag';
    return;
  }
  if(!r){g.className='grid lock';$('countdown').classList.remove('show');return}
  const t=now(),peekEnd=Number(r.peekAt)||0,peeking=t<peekEnd;
  g.classList.toggle('lock',!myTurn());
  /* peek countdown */
  const cd=Math.ceil((peekEnd-t)/1000);
  $('countdown').classList.toggle('show',peeking&&cd>0);
  if(peeking&&cd!==lastCount){$('count').textContent=ar(Math.max(1,cd));lastCount=cd;if(cd<=3)sTick()}
  if(!peeking)lastCount=-1;
  /* visually open all cards during peek; keep opened POSITIONS open otherwise */
  const openIdx=openIdxSet();
  [...g.children].forEach((el,i)=>{
    const isOpen=peeking||openIdx.has(i);
    el.classList.toggle('open',isOpen&&!el.classList.contains('done'));
  });
  /* status */
  let tag='',cls='tag',text='';
  if(peeking){cls='tag peek';tag='بصّي كويس';text=`هتقلب بعد ${ar(Math.max(1,cd))}…`}
  else if(r.winner){cls='tag turn';tag='خلصت';text=r.winner===cfg.role?'سبقتيه! 🏃':`${nameOf(r.winner)} سبقك ⚡`}
  else if(myTurn()){cls='tag turn';tag='دورك';text=`افتحي ${ar(Number(r.next)||1)} 👆`}
  else{cls='tag';tag='دور الخصم';text=`${nameOf(oppRole())} بيلعب… 👀`}
  const tk=tag+text;
  if(tk!==lastStatus){$('stext').textContent=text;$('stag').textContent=tag;$('stag').className=cls;lastStatus=tk}
  renderLegend();
}
(function loop(ts){const t=typeof ts==='number'?ts:0;if(t-(loop._l||0)>=60){loop._l=t;try{tick()}catch(e){console.warn('seq loop',e)}}requestAnimationFrame(loop)})(0);
setInterval(()=>{try{tick()}catch(e){console.warn('seq tick',e)}},250);

renderStatic();
parent.postMessage({type:'roqaya-seq-ready'},location.origin);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لعبة تكوين الصور</title>
<style>
:root{
  --bg:#dfeae3;--ink:#17332a;--card:#fff;--muted:#53705f;
  --accent:#2a7f62;--gold:#f0b429;--warn:#7957aa
}
@media(prefers-color-scheme:dark){
  :root{--bg:#101c17;--ink:#e8f3ed;--card:#1b2d26;--muted:#9bb8ab}
}
*{box-sizing:border-box}
html,body{margin:0;min-height:0}
body{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:10px 8px 24px;overflow-x:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,"Segoe UI",Tahoma,sans-serif
}
h1{margin:0;font-size:clamp(1.25rem,5vw,1.7rem)}
#turnbar{
  width:min(96vw,620px);display:flex;align-items:center;gap:6px
}
#turn{
  flex:1;margin:0;padding:7px 10px;border-radius:12px;
  background:var(--card);text-align:center;font-weight:900;font-size:.86rem
}
#turn.mine{background:#dff7ea;color:#155e43}
#turn.watch{background:#f1eafb;color:#60428a}
#cheer{
  display:none;min-width:86px;min-height:38px;padding:6px 10px;
  border:0;border-radius:12px;background:linear-gradient(145deg,#ffde75,#ff9fc6);
  color:#57334c;font-weight:950;box-shadow:0 4px 0 #d87ea5;
  animation:cheerPulse 1.4s ease-in-out infinite
}
#cheer.show{display:inline-flex;align-items:center;justify-content:center}
#cheer:active{transform:translateY(2px);box-shadow:0 2px 0 #d87ea5}
@keyframes cheerPulse{50%{filter:brightness(1.06);transform:scale(1.025)}}
#cheerFx{
  display:none;width:min(96vw,620px);margin:0;padding:6px 10px;border-radius:11px;
  background:#fff7d7;color:#765217;text-align:center;font-weight:950;font-size:.78rem
}
#cheerFx.show{display:block;animation:cheerIn .28s ease-out}
@keyframes cheerIn{from{transform:translateY(-5px);opacity:0}to{transform:none;opacity:1}}
#meta{
  width:min(96vw,620px);display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
  color:var(--muted);font-size:.72rem;font-weight:800
}
#meta span{background:rgba(255,255,255,.58);padding:4px 8px;border-radius:9px}
.control-row{
  width:min(96vw,680px);display:grid;grid-template-columns:1fr 1.55fr 1.1fr .9fr;
  gap:6px;align-items:stretch
}
.best-card,button,select{
  min-width:0;border:0;border-radius:10px;font:inherit
}
.best-card{
  background:var(--card);padding:5px 6px;text-align:center;font-weight:900;
  display:flex;flex-direction:column;align-items:center;justify-content:center
}
.best-card small{color:var(--muted);font-weight:500;font-size:.61rem}
.best-card strong{font-size:.84rem}
button,select{padding:8px 7px;cursor:pointer;background:var(--card);color:var(--ink)}
#new{background:var(--accent);color:white;font-weight:900}
#hint{font-weight:850}
button:disabled,select:disabled{opacity:.48;cursor:not-allowed}
#wrap{
  max-width:100%;padding:10px;background:#d9bb8c;border-radius:15px;
  box-shadow:inset 0 0 0 3px #c4a06e
}
#area{position:relative;direction:ltr}
#frame{position:absolute;left:0;top:0;background:#c9a674;outline:3px solid #b08a58}
.ghost{display:block;opacity:.16;pointer-events:none;transition:opacity .35s}
#frame.peek .ghost{opacity:.62}
#frame.done{outline-color:var(--gold)}
#frame.done .ghost{opacity:1}
.pc{
  position:absolute;z-index:2;touch-action:none;cursor:grab;user-select:none;
  transition:left .24s ease,top .24s ease,opacity .2s,filter .2s
}
.pc.drag{cursor:grabbing;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45));transition:none}
.pc.set{pointer-events:none}
#area.spectating .pc:not(.set){pointer-events:none;cursor:default;filter:saturate(.72);opacity:.83}
#won{
  position:absolute;z-index:8;display:none;align-items:center;justify-content:center;
  padding:14px;direction:rtl;text-align:center;border-radius:14px;
  background:rgba(255,255,255,.82);color:#17332a;font-weight:900
}
#won.show{display:flex}
.tip{
  margin:0;color:var(--muted);font-size:.73rem;text-align:center;max-width:520px
}
@media(max-width:520px){
  body{padding:7px 4px 18px;gap:6px}
  .control-row{gap:4px;grid-template-columns:.95fr 1.6fr 1.05fr .78fr}
  .best-card{padding:4px 3px}.best-card small{font-size:.53rem}.best-card strong{font-size:.72rem}
  button,select{padding:7px 4px;font-size:.68rem}
  #turn{font-size:.75rem;padding:6px}
  #cheer{min-width:74px;min-height:34px;padding:5px 7px;font-size:.67rem}
  #cheerFx{font-size:.68rem;padding:5px 7px}
  #meta{font-size:.63rem}
  #wrap{padding:8px}
}
@media(prefers-reduced-motion:reduce){.ghost,.pc{transition:none}}
</style>
</head>
<body>
<h1>🧩 لعبة تكوين الصور</h1>
<div id="turnbar">
  <p id="turn">جاري تجهيز الدور…</p>
  <button id="cheer" type="button">👏 شجّع</button>
</div>
<div id="meta">
  <span id="lvl">الصورة ١/١٠</span>
  <span id="placed">المركب ٠/٩</span>
  <span id="time">الوقت ٠:٠٠</span>
</div>

<div class="control-row">
  <div class="best-card"><small>أفضل وقت</small><strong id="best">—</strong></div>
  <select id="size" aria-label="عدد القطع">
    <option value="3">٩ قطع • سهل</option>
    <option value="4">١٦ قطعة • متوسط</option>
    <option value="5">٢٥ قطعة • صعب</option>
    <option value="6">٣٦ قطعة • صعب جدًا</option>
  </select>
  <button id="new">لعبة جديدة</button>
  <button id="hint">تلميح</button>
</div>
<div id="cheerFx" aria-live="polite"></div>

<div id="wrap"><div id="area">
  <div id="frame"></div>
  <div id="won" aria-live="polite">🎉 برافو! خلّصتوا البازل سوا.</div>
</div></div>

<p class="tip">كل مرة لاعب واحد يحرك القطعة. لما يركّب قطعة صح، الدور يروح للتاني تلقائيًا.</p>

<script>
const $=s=>document.querySelector(s),area=$('#area'),frame=$('#frame'),won=$('#won');
const LEVELS=[
  'assets/puzzles/farm.webp',
  'assets/puzzles/dinosaurs.webp',
  'assets/puzzles/unicorn.webp',
  'assets/puzzles/ocean.webp',
  'assets/puzzles/candy.webp',
  'assets/puzzles/school-bus.webp',
  'assets/puzzles/teddy-picnic.webp',
  'assets/puzzles/princess.webp',
  'assets/puzzles/jungle.webp',
  'assets/puzzles/space.webp'
];
const EASTERN='٠١٢٣٤٥٦٧٨٩';
const ar=v=>String(v).replace(/[0-9]/g,d=>EASTERN[d.charCodeAt(0)-48]);
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const dpr=Math.min(devicePixelRatio||1,2);

let cfg={imageIndex:0,n:3,seed:1,placed:[],turn:'host',role:'guest',startedAt:Date.now(),finished:false,roundId:0,childName:'رقية',cheer:null};
let src=null,ps=0,m=0,fw=0,H=[],V=[],z=10,drag=null,waitingAck=false,lastBuildKey='';
let timer=0,lastCheerSeq=0,cheerReady=false,cheerHideTimer=0;
const CHEERS=[
  ['👏','برافو! كمّل يا بطل!'],
  ['🌟','ممتاز! إنت شاطر جدًا!'],
  ['💜','أنا بتفرج عليك وبشجّعك!'],
  ['🎉','يلااا! قربنا نكمّل الصورة!']
];

function nameOf(role){return role==='host'?'بابا':(cfg.childName||'رقية')}
function canPlay(){return !cfg.finished&&!waitingAck&&cfg.turn===cfg.role}
function bestKey(){return `jig-shared-${cfg.imageIndex}-${cfg.n}`}
function best(){
  try{return +localStorage.getItem(bestKey())||0}catch{return 0}
}
function saveBest(sec){
  const b=best();
  if(!b||sec<b){try{localStorage.setItem(bestKey(),String(sec))}catch{}}
}
function showBest(){
  const b=best();$('#best').textContent=b?ar(fmt(b)):'—'
}
function elapsed(){
  const end=cfg.finished?(cfg.completedAt||Date.now()):Date.now();
  return Math.max(0,Math.floor((end-(cfg.startedAt||end))/1000))
}
function cheerTone(type=0){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    const ac=window._jigsawCheerAudio||(window._jigsawCheerAudio=new AC());
    if(ac.state==='suspended')ac.resume?.();
    const seq=[
      [[523,.00],[659,.10],[784,.20]],
      [[659,.00],[784,.10],[988,.20]],
      [[440,.00],[554,.12],[659,.24]],
      [[587,.00],[740,.09],[880,.18],[1175,.29]]
    ][type%4];
    const start=ac.currentTime;
    seq.forEach(([f,d])=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,start+d);
      g.gain.exponentialRampToValueAtTime(.055,start+d+.015);
      g.gain.exponentialRampToValueAtTime(.0001,start+d+.16);
      o.connect(g).connect(ac.destination);o.start(start+d);o.stop(start+d+.19);
    });
  }catch(_){}
}
function showCheer(cheer){
  if(!cheer||cheer.from===cfg.role)return;
  const type=Number(cheer.type)||0,[emoji,text]=CHEERS[type%CHEERS.length];
  const fx=$('#cheerFx');
  clearTimeout(cheerHideTimer);
  fx.textContent=`${emoji} ${nameOf(cheer.from)} بيشجّعك: ${text}`;
  fx.classList.add('show');
  cheerTone(type);
  try{navigator.vibrate?.([35,30,35])}catch(_){}
  cheerHideTimer=setTimeout(()=>fx.classList.remove('show'),2200);
}
function checkCheer(){
  const cheer=cfg.cheer;
  const seq=Number(cheer?.seq)||0;
  if(!cheerReady){lastCheerSeq=seq;cheerReady=true;return}
  if(seq>lastCheerSeq){
    lastCheerSeq=seq;
    if(Date.now()-(Number(cheer?.at)||0)<10000)showCheer(cheer);
  }
}
function updateText(){
  const total=cfg.n*cfg.n,placed=cfg.placed?.length||0;
  $('#lvl').textContent=`الصورة ${ar(cfg.imageIndex+1)}/${ar(LEVELS.length)}`;
  $('#placed').textContent=`المركب ${ar(placed)}/${ar(total)}`;
  $('#time').textContent=`الوقت ${ar(fmt(elapsed()))}`;
  $('#size').value=String(cfg.n);
  $('#size').disabled=cfg.role!=='host';
  $('#new').disabled=cfg.role!=='host';
  const turn=$('#turn');
  if(cfg.finished){
    turn.className='mine';
    turn.textContent='🎉 خلّصتوا البازل سوا!';
  }else if(canPlay()){
    turn.className='mine';
    turn.textContent=`✨ دورك يا ${nameOf(cfg.role)} — ركّب قطعة`;
  }else{
    turn.className='watch';
    turn.textContent=`👀 دور ${nameOf(cfg.turn)} يلعب — ${nameOf(cfg.role)} يتفرج`;
  }
  area.classList.toggle('spectating',!canPlay());
  won.classList.toggle('show',Boolean(cfg.finished));
  const cheer=$('#cheer');
  cheer.classList.toggle('show',!cfg.finished&&cfg.turn!==cfg.role);
  cheer.disabled=cfg.finished||cfg.turn===cfg.role;
  if(cfg.finished){saveBest(elapsed());showBest()}
}
function rng(seed){
  let a=(seed>>>0)||1;
  return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
}
const K=[[.2,0,.5,-.1,.4,.1],[.3,.3,.7,.3,.6,.1],[.5,-.1,.8,0,1,0]];
function edge(p,x0,y0,x1,y1,s){
  if(!s)return p.lineTo(x1,y1);
  const dx=x1-x0,dy=y1-y0,nx=dy*s,ny=-dx*s;
  K.forEach(k=>p.bezierCurveTo(
    x0+dx*k[0]+nx*k[1],y0+dy*k[0]+ny*k[1],
    x0+dx*k[2]+nx*k[3],y0+dy*k[2]+ny*k[3],
    x0+dx*k[4]+nx*k[5],y0+dy*k[4]+ny*k[5]));
}
function shape(r,c){
  const p=new Path2D(),a=m,b=m+ps;
  p.moveTo(a,a);
  edge(p,a,a,b,a,r?-H[r-1][c]:0);
  edge(p,b,a,b,b,c<cfg.n-1?V[r][c]:0);
  edge(p,b,b,a,b,r<cfg.n-1?H[r][c]:0);
  edge(p,a,b,a,a,c?-V[r][c-1]:0);
  p.closePath();return p;
}
function makeEdges(){
  const r=rng(cfg.seed+cfg.n*1009);
  H=Array.from({length:cfg.n},()=>Array.from({length:cfg.n},()=>r()<.5?1:-1));
  V=Array.from({length:cfg.n},()=>Array.from({length:cfg.n},()=>r()<.5?1:-1));
}
function deterministicPos(index,maxX,maxY){
  const r=rng(cfg.seed+index*7919+cfg.n*97);
  return [Math.max(0,Math.floor(r()*Math.max(1,maxX))),Math.max(0,Math.floor(r()*Math.max(1,maxY)))];
}
async function loadImage(){
  const im=new Image();
  im.decoding='async';
  im.src=LEVELS[cfg.imageIndex%LEVELS.length];
  if(im.decode){try{await im.decode()}catch{}}
  if(!im.complete)await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject});
  src=im;
}
function build(){
  if(!src)return;
  z=10;drag=null;waitingAck=false;
  const n=cfg.n,total=n*n;
  const wide=innerWidth>=900;
  const avail=wide?Math.min(innerHeight-210,(innerWidth-100)/2,560):Math.min(innerWidth-38,480);
  ps=Math.max(n===6?34:38,Math.floor(avail/n));
  m=Math.round(ps*.3);fw=ps*n;
  const cw=ps+2*m,tx=wide?fw+22:0,ty=wide?0:fw+14,th=wide?fw:Math.round(fw*1.04);
  area.style.cssText=`width:${tx+fw}px;height:${ty+th}px`;
  frame.style.cssText=`width:${fw}px;height:${fw}px`;
  frame.className=cfg.finished?'done':'';
  won.style.cssText=`left:0;top:${Math.max(8,fw*.4)}px;width:${fw}px`;

  const full=document.createElement('canvas');
  full.width=full.height=Math.max(1,Math.round(fw*dpr));
  full.className='ghost';
  full.style.cssText=`width:${fw}px;height:${fw}px`;
  const iw=src.naturalWidth||src.width,ih=src.naturalHeight||src.height,sq=Math.min(iw,ih);
  full.getContext('2d').drawImage(src,(iw-sq)/2,(ih-sq)/2,sq,sq,0,0,full.width,full.height);
  frame.replaceChildren(full);

  makeEdges();
  area.querySelectorAll('.pc').forEach(p=>p.remove());
  const placedSet=new Set((cfg.placed||[]).map(Number));

  for(let rr=0;rr<n;rr++)for(let cc=0;cc<n;cc++){
    const index=rr*n+cc,cv=document.createElement('canvas'),x=cv.getContext('2d'),p=shape(rr,cc);
    cv.width=cv.height=Math.round(cw*dpr);
    cv.style.width=cv.style.height=cw+'px';
    x.scale(dpr,dpr);x.save();x.clip(p);
    x.drawImage(full,m-cc*ps,m-rr*ps,fw,fw);x.restore();
    x.lineWidth=1.5;x.strokeStyle='rgba(0,0,0,.48)';x.stroke(p);
    cv.className='pc';cv.dataset.index=index;
    cv._tx=cc*ps-m;cv._ty=rr*ps-m;
    if(placedSet.has(index)){
      cv.style.left=cv._tx+'px';cv.style.top=cv._ty+'px';cv.style.zIndex=1;cv.classList.add('set');
    }else{
      const [px,py]=deterministicPos(index,fw-cw,th-cw);
      cv.style.left=(tx+px)+'px';cv.style.top=(ty+py)+'px';
    }
    cv.onpointerdown=down;cv.onpointermove=move;cv.onpointerup=cv.onpointercancel=up;
    area.append(cv);
  }
  updateText();showBest();
}
function applyPlaced(){
  const placedSet=new Set((cfg.placed||[]).map(Number));
  area.querySelectorAll('.pc').forEach(cv=>{
    const idx=Number(cv.dataset.index);
    if(placedSet.has(idx)&&!cv.classList.contains('set')){
      cv.classList.remove('drag');
      cv.style.left=cv._tx+'px';cv.style.top=cv._ty+'px';cv.style.zIndex=1;
      cv.classList.add('set');
    }
  });
  frame.classList.toggle('done',Boolean(cfg.finished));
  waitingAck=false;updateText();
}
function down(e){
  if(!canPlay()||e.button>0||e.currentTarget.classList.contains('set'))return;
  e.preventDefault();
  const el=e.currentTarget;
  el.setPointerCapture?.(e.pointerId);
  drag={el,x:e.clientX,y:e.clientY,l:el.offsetLeft,t:el.offsetTop};
  el.style.zIndex=++z;el.classList.add('drag');
}
function move(e){
  if(!drag||drag.el!==e.currentTarget)return;
  e.preventDefault();
  const el=drag.el,w=el.offsetWidth;
  el.style.left=Math.max(-m,Math.min(area.offsetWidth-w+m,drag.l+e.clientX-drag.x))+'px';
  el.style.top=Math.max(-m,Math.min(area.offsetHeight-w+m,drag.t+e.clientY-drag.y))+'px';
}
function up(){
  if(!drag)return;
  const el=drag.el;drag=null;el.classList.remove('drag');
  if(Math.hypot(el.offsetLeft-el._tx,el.offsetTop-el._ty)<ps*.31){
    el.style.left=el._tx+'px';el.style.top=el._ty+'px';el.style.zIndex=1;el.classList.add('set');
    waitingAck=true;updateText();
    parent.postMessage({type:'roqaya-jigsaw-piece',piece:Number(el.dataset.index),roundId:cfg.roundId},location.origin);
  }
}
async function applyConfig(next){
  const oldKey=`${cfg.roundId}:${cfg.imageIndex}:${cfg.n}:${cfg.seed}`;
  cfg={...cfg,...next,n:[3,4,5,6].includes(Number(next.n))?Number(next.n):3};
  const newKey=`${cfg.roundId}:${cfg.imageIndex}:${cfg.n}:${cfg.seed}`;
  if(newKey!==oldKey||!src){
    await loadImage();build();lastBuildKey=newKey;
  }else{
    applyPlaced();
  }
  checkCheer();
}
$('#hint').onclick=()=>frame.classList.toggle('peek');
$('#cheer').onclick=()=>{
  if(cfg.finished||cfg.turn===cfg.role)return;
  const b=$('#cheer');
  b.disabled=true;
  b.textContent='💜 اتبعت!';
  parent.postMessage({type:'roqaya-jigsaw-cheer',roundId:cfg.roundId},location.origin);
  setTimeout(()=>{b.textContent='👏 شجّع';updateText()},850);
};
$('#new').onclick=()=>{
  if(cfg.role!=='host')return;
  parent.postMessage({type:'roqaya-jigsaw-new',n:+$('#size').value},location.origin);
};
$('#size').onchange=e=>{
  try{localStorage.setItem('roqaya-jigsaw-n',String(e.target.value))}catch{}
};
addEventListener('resize',()=>{if(src)build()});
addEventListener('message',e=>{
  if(e.origin!==location.origin||e.data?.type!=='roqaya-jigsaw-config')return;
  applyConfig(e.data.config).catch(console.error);
});
timer=setInterval(updateText,1000);
parent.postMessage({type:'roqaya-jigsaw-ready'},location.origin);
</script>
</body>
</html>

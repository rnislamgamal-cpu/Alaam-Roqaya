<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لعبة تكوين الصور</title>
<style>
:root{
  --bg:#dfeae3;--ink:#17332a;--card:#fff;--muted:#53705f;
  --accent:#2a7f62;--gold:#f0b429;--warn:#7957aa
}
@media(prefers-color-scheme:dark){
  :root{--bg:#101c17;--ink:#e8f3ed;--card:#1b2d26;--muted:#9bb8ab}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 6px 62px;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,"Segoe UI",Tahoma,sans-serif
}
h1{margin:0;font-size:1.05rem}
/* [M15] شريط واحد مدمج: الدور + التقدّم + التحكّم في سطر واحد */
#bar{
  width:100%;max-width:1000px;display:flex;align-items:center;gap:4px;
  flex-wrap:nowrap;min-width:0
}
#turn{
  flex:1 1 auto;min-width:0;margin:0;padding:4px 8px;border-radius:10px;
  background:var(--card);text-align:center;font-weight:900;font-size:.7rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
#turn.mine{background:#dff7ea;color:#155e43}
#turn.watch{background:#f1eafb;color:#60428a}
#meta{
  flex:0 0 auto;display:flex;align-items:center;gap:4px;
  color:var(--muted);font-size:.6rem;font-weight:900
}
#meta b,#meta i{
  font-style:normal;background:rgba(255,255,255,.6);padding:2px 5px;
  border-radius:7px;white-space:nowrap
}
#bar select,#bar button{flex:0 0 auto;padding:4px 7px;font-size:.68rem;border-radius:9px;min-height:26px}
#cheer{
  display:none;padding:3px 7px;border:0;border-radius:9px;
  background:linear-gradient(145deg,#ffde75,#ff9fc6);color:#57334c;
  font-weight:950;font-size:.66rem;box-shadow:0 3px 0 #d87ea5;
  animation:cheerPulse 1.4s ease-in-out infinite
}
#cheer.show{display:inline-flex;align-items:center;justify-content:center}
#cheer:active{transform:translateY(2px);box-shadow:0 1px 0 #d87ea5}
@keyframes cheerPulse{50%{filter:brightness(1.06);transform:scale(1.025)}}
#cheerFx{
  display:none;width:100%;max-width:1000px;margin:0;padding:4px 8px;border-radius:10px;
  background:#fff7d7;color:#765217;text-align:center;font-weight:950;font-size:.68rem
}
#cheerFx.show{display:block;animation:cheerIn .28s ease-out}
@keyframes cheerIn{from{transform:translateY(-5px);opacity:0}to{transform:none;opacity:1}}
button,select{min-width:0;border:0;font:inherit;cursor:pointer;background:var(--card);color:var(--ink)}
#new{background:var(--accent);color:white;font-weight:900}
#hint{font-weight:850}
button:disabled,select:disabled{opacity:.48;cursor:not-allowed}

/* ===== منطقة اللعب: الصورة + رفّ القطع ===== */
#stage{
  flex:1 1 auto;min-height:0;width:100%;max-width:1000px;
  display:flex;flex-direction:column;gap:6px
}
#board{
  flex:1 1 auto;min-height:0;display:flex;gap:6px;
  align-items:stretch;justify-content:center
}
#wrap{
  flex:0 0 auto;align-self:center;display:flex;align-items:center;justify-content:center;
  min-width:0;min-height:0;padding:7px;background:#d9bb8c;border-radius:14px;
  box-shadow:inset 0 0 0 3px #c4a06e
}
#area{position:relative;direction:ltr}
#frame{position:absolute;left:0;top:0;background:#c9a674;outline:3px solid #b08a58}
/* [M14] أثناء التركيب: أرضية بنية بدون أي صورة مساعدة (تحدٍّ حقيقي).
   الصورة تظهر فقط عند الضغط على «شوف الصورة» ولمدة قصيرة. */
.ghost{display:block;opacity:0;pointer-events:none;transition:opacity .35s}
#frame.peek .ghost{opacity:.97}
#frame.done{outline-color:var(--gold)}
#frame.done .ghost{opacity:1}
#frame.flash{box-shadow:0 0 0 5px rgba(255,222,117,.95),0 0 26px rgba(255,190,80,.85)}
/* [M14] احتفال الاكتمال: الصورة تنبض + الأشعة تدور + القطع تلمع */
#frame.done{animation:donePop .7s ease-out}
@keyframes donePop{0%{transform:scale(.93)}55%{transform:scale(1.035)}100%{transform:scale(1)}}
#frame.done::after{
  content:'';position:absolute;inset:-9%;border-radius:20px;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(255,221,120,.85),rgba(255,221,120,0) 22%,rgba(255,255,255,.7) 44%,rgba(255,221,120,0) 66%,rgba(255,221,120,.85));
  animation:rays 3.2s linear infinite;z-index:0;filter:blur(1px)
}
#frame.done .ghost{z-index:1;position:relative}
@keyframes rays{to{transform:rotate(360deg)}}
#frame.done .pc.set{animation:setShine 1.2s ease-out both}
@keyframes setShine{0%{filter:brightness(1.7) saturate(1.4)}100%{filter:none}}
/* [M14] نجوم الاحتفال */
.spark{
  position:absolute;z-index:9;pointer-events:none;font-size:1.1rem;
  transform:translate(-50%,-50%);animation:sparkUp 3.2s ease-out both
}
@keyframes sparkUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(0)}
  18%{opacity:1;transform:translate(-50%,-90%) scale(1.15) rotate(18deg)}
  100%{opacity:0;transform:translate(-50%,-260%) scale(.75) rotate(-24deg)}
}
@media(prefers-reduced-motion:reduce){#frame.done::after{animation:none}.spark{display:none}}

/* رفّ القطع — عمود على الجنب */
#tray{
  flex:0 0 auto;position:relative;overflow:hidden;touch-action:none;
  border-radius:14px;background:rgba(255,255,255,.5);
  box-shadow:inset 0 0 0 2px rgba(196,160,110,.5)
}
#tray::before{
  content:'🧩 القطع';position:absolute;top:2px;left:50%;transform:translateX(-50%);
  font-size:.54rem;font-weight:900;color:var(--muted);pointer-events:none;z-index:1
}
#tray.empty::after{
  content:'✅ خلصت القطع!';position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;text-align:center;padding:6px;
  font-size:.66rem;font-weight:900;color:var(--muted)
}

.pc{
  position:absolute;z-index:2;touch-action:none;cursor:grab;user-select:none;
  transition:left .24s ease,top .24s ease,opacity .2s,filter .2s;
  will-change:left,top
}
.pc.drag{cursor:grabbing;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45));transition:none;z-index:999!important}
.pc.set{pointer-events:none}
.pc.near{filter:drop-shadow(0 0 7px #f0b429) brightness(1.08)}
.pc.home{opacity:1;pointer-events:auto}
#area.spectating .pc:not(.set){pointer-events:none;cursor:default;filter:saturate(.72);opacity:.83}
#won{
  position:absolute;z-index:8;display:none;flex-direction:column;gap:3px;
  align-items:center;justify-content:center;
  padding:14px;direction:rtl;text-align:center;border-radius:14px;
  background:rgba(255,255,255,.86);color:#17332a;font-weight:900;font-size:.86rem
}
#won.show{display:flex;animation:wonIn .45s cubic-bezier(.2,1.3,.5,1)}
@keyframes wonIn{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
#wonBest{font-size:.7rem;font-weight:800;color:#8a6a1f}
/* اتجاه منطقة اللعب يحدده الجافاسكربت (body.stack / body.side)
   عشان يطابق حساب المقاسات بالظبط */
body.stack #board{flex-direction:column-reverse}
body.side  #board{flex-direction:row}
body.stack #tray::before{content:'🧩 اسحب قطعة من تحت لفوق'}

@media(max-width:520px){
  body{padding:3px 3px 56px;gap:3px}
  #bar{gap:3px}
  #turn{font-size:.62rem;padding:3px 5px}
  #meta{font-size:.54rem;gap:3px}
  #meta b,#meta i{padding:1px 4px}
  #bar select,#bar button{padding:3px 5px;font-size:.6rem;min-height:24px}
  #cheer{padding:2px 5px;font-size:.6rem}
  #cheerFx{font-size:.6rem;padding:3px 6px}
  #wrap{padding:4px;border-radius:10px}
  #tray{border-radius:10px}
  #tray::before{font-size:.5rem}
}
@media(max-width:380px){
  #meta #lvl{display:none}
}
@media(prefers-reduced-motion:reduce){.ghost,.pc{transition:none}}
</style>

</head>
<body>
<!-- [M15] شريط واحد مدمج: الدور + التقدّم/الوقت + التحكّم — يوفر مساحة عمودية
     مهمة على الموبايل فتظهر القطع أكبر. -->
<div id="bar">
  <p id="turn">جاري التجهيز…</p>
  <span id="meta"><b id="lvl">١/١٠</b><i id="placed">٠/٩</i><i id="time">٠:٠٠</i></span>
  <select id="size" aria-label="عدد القطع">
    <option value="3">٩</option>
    <option value="4">١٦</option>
    <option value="5">٢٥</option>
    <option value="6">٣٦</option>
  </select>
  <button id="new" title="لعبة جديدة">🔄</button>
  <button id="hint" title="شوف الصورة كاملة لثانيتين">👁️</button>
  <button id="cheer" type="button" title="شجّع">👏</button>
</div>
<div id="cheerFx" aria-live="polite"></div>

<div id="stage">
  <div id="board">
    <div id="wrap"><div id="area">
      <div id="frame"></div>
      <div id="won" aria-live="polite">
        <span>🎉 برافو! خلّصتوا البازل سوا.</span>
        <small id="wonBest"></small>
      </div>
    </div></div>
    <div id="tray" aria-label="رفّ القطع"></div>
  </div>
</div>

<div class="footer-bar">
  <button id="city" class="btn alt">🎡 المدينة</button>
</div>

<script>
const $=s=>document.querySelector(s),area=$('#area'),frame=$('#frame'),won=$('#won'),wrap=$('#wrap'),tray=$('#tray');
const LEVELS=[
  'assets/puzzles/farm.webp',
  'assets/puzzles/dinosaurs.webp',
  'assets/puzzles/unicorn.webp',
  'assets/puzzles/ocean.webp',
  'assets/puzzles/candy.webp',
  'assets/puzzles/school-bus.webp',
  'assets/puzzles/teddy-picnic.webp',
  'assets/puzzles/princess.webp',
  'assets/puzzles/jungle.webp',
  'assets/puzzles/space.webp'
];
const EASTERN='٠١٢٣٤٥٦٧٨٩';
const ar=v=>String(v).replace(/[0-9]/g,d=>EASTERN[d.charCodeAt(0)-48]);
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const dpr=Math.min(devicePixelRatio||1,2);

let cfg={imageIndex:0,n:3,seed:1,placed:[],turn:'host',role:'guest',startedAt:Date.now(),finished:false,roundId:0,childName:'رقية',cheer:null};
let src=null,ps=0,m=0,fw=0,trayScale=0.62,H=[],V=[],z=10,drag=null,waitingAck=false,lastBuildKey='',celebrated=false;
let timer=0,lastCheerSeq=0,cheerReady=false,cheerHideTimer=0;
const CHEERS=[
  ['👏','برافو! كمّل يا بطل!'],
  ['🌟','ممتاز! إنت شاطر جدًا!'],
  ['💜','أنا بتفرج عليك وبشجّعك!'],
  ['🎉','يلااا! قربنا نكمّل الصورة!']
];

function nameOf(role){return role==='host'?'بابا':(cfg.childName||'رقية')}
function canPlay(){return !cfg.finished&&!waitingAck&&cfg.turn===cfg.role}
function bestKey(){return `jig-shared-${cfg.imageIndex}-${cfg.n}`}
function best(){
  try{return +localStorage.getItem(bestKey())||0}catch{return 0}
}
function saveBest(sec){
  const b=best();
  if(!b||sec<b){try{localStorage.setItem(bestKey(),String(sec))}catch{}}
}
function showBest(){
  /* [M15] شيلنا خلية «أفضل وقت» من الشريط لتوفير المساحة.
     بنعرض أفضل وقت جوه رسالة الفوز بدل كده. */
  const b=best(),el=$('#wonBest');
  if(el)el.textContent=b?`🏅 أفضل وقت: ${ar(fmt(b))}`:'';
}
function elapsed(){
  const end=cfg.finished?(cfg.completedAt||Date.now()):Date.now();
  return Math.max(0,Math.floor((end-(cfg.startedAt||end))/1000))
}
function cheerTone(type=0){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    const ac=window._jigsawCheerAudio||(window._jigsawCheerAudio=new AC());
    if(ac.state==='suspended')ac.resume?.();
    const seq=[
      [[523,.00],[659,.10],[784,.20]],
      [[659,.00],[784,.10],[988,.20]],
      [[440,.00],[554,.12],[659,.24]],
      [[587,.00],[740,.09],[880,.18],[1175,.29]]
    ][type%4];
    const start=ac.currentTime;
    seq.forEach(([f,d])=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,start+d);
      g.gain.exponentialRampToValueAtTime(.055,start+d+.015);
      g.gain.exponentialRampToValueAtTime(.0001,start+d+.16);
      o.connect(g).connect(ac.destination);o.start(start+d);o.stop(start+d+.19);
    });
  }catch(_){}
}
/* [M13] صوت لطيف + وميض لما قطعة تلزق في مكانها */
function boom(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){
      const ac=window._jigsawAudio||(window._jigsawAudio=new AC());
      if(ac.state==='suspended')ac.resume?.();
      const t=ac.currentTime;
      [[784,.0],[1046,.07]].forEach(([f,d])=>{
        const o=ac.createOscillator(),g=ac.createGain();
        o.type='triangle';o.frequency.value=f;
        g.gain.setValueAtTime(.0001,t+d);
        g.gain.exponentialRampToValueAtTime(.05,t+d+.012);
        g.gain.exponentialRampToValueAtTime(.0001,t+d+.13);
        o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+.16);
      });
    }
  }catch(_){}
  frame.classList.add('flash');
  setTimeout(()=>frame.classList.remove('flash'),320);
}
function showCheer(cheer){
  if(!cheer||cheer.from===cfg.role)return;
  const type=Number(cheer.type)||0,[emoji,text]=CHEERS[type%CHEERS.length];
  const fx=$('#cheerFx');
  clearTimeout(cheerHideTimer);
  fx.textContent=`${emoji} ${nameOf(cheer.from)} بيشجّعك: ${text}`;
  fx.classList.add('show');
  cheerTone(type);
  try{navigator.vibrate?.([35,30,35])}catch(_){}
  cheerHideTimer=setTimeout(()=>fx.classList.remove('show'),2200);
}
function checkCheer(){
  const cheer=cfg.cheer;
  const seq=Number(cheer?.seq)||0;
  if(!cheerReady){lastCheerSeq=seq;cheerReady=true;return}
  if(seq>lastCheerSeq){
    lastCheerSeq=seq;
    if(Date.now()-(Number(cheer?.at)||0)<10000)showCheer(cheer);
  }
}
function updateText(){
  const total=cfg.n*cfg.n,placed=cfg.placed?.length||0;
  /* [M15] لافتات مختصرة: صورة • تقدّم • وقت */
  $('#lvl').textContent=`🖼 ${ar(cfg.imageIndex+1)}/${ar(LEVELS.length)}`;
  $('#placed').textContent=`🧩 ${ar(placed)}/${ar(total)}`;
  $('#time').textContent=`⏱ ${ar(fmt(elapsed()))}`;
  $('#size').value=String(cfg.n);
  $('#size').disabled=cfg.role!=='host';
  $('#new').disabled=cfg.role!=='host'||$('#new').dataset.busy==='1';
  const turn=$('#turn');
  if(cfg.finished){
    turn.className='mine';
    turn.textContent='🎉 خلّصتوا البازل!';
  }else if(canPlay()){
    turn.className='mine';
    turn.textContent=`✨ دورك يا ${nameOf(cfg.role)}`;
  }else{
    turn.className='watch';
    turn.textContent=`👀 دور ${nameOf(cfg.turn)}`;
  }
  area.classList.toggle('spectating',!canPlay());
  won.classList.toggle('show',Boolean(cfg.finished));
  const cheer=$('#cheer');
  cheer.classList.toggle('show',!cfg.finished&&cfg.turn!==cfg.role);
  cheer.disabled=cfg.finished||cfg.turn===cfg.role;
  if(cfg.finished){saveBest(elapsed());showBest()}
  /* [M14] نحتفل مرة واحدة بس عند الاكتمال (مش مع كل تحديث) */
  if(cfg.finished&&!celebrated){celebrated=true;celebrate()}
}
/* [M14] احتفال الاكتمال: لحن فرح + وميض + نبض للصورة + شوية نجوم */
function celebrate(){
  frame.classList.add('done');
  cheerTone(securePick(4));
  setTimeout(()=>cheerTone((securePick(4)+2)%4),260);
  /* وميض متكرر خفيف */
  let n=0;
  const flash=setInterval(()=>{
    frame.classList.add('flash');
    setTimeout(()=>frame.classList.remove('flash'),300);
    if(++n>=3)clearInterval(flash);
  },520);
  /* نجوم صغيرة تطلع من الصورة */
  try{
    for(let i=0;i<14;i++)sparkle(i);
  }catch(_){}
  try{navigator.vibrate?.([30,40,30,40,80])}catch(_){}
}
function securePick(m){
  try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%m}
  catch{return Math.floor(Math.random()*m)}
}
/* نجمة صغيرة تتطاير من مكان عشوائي على الصورة */
function sparkle(i){
  const s=document.createElement('span');
  s.className='spark';
  s.textContent=['⭐','✨','🌟','💛'][i%4];
  s.style.left=(12+Math.random()*76)+'%';
  s.style.top=(12+Math.random()*76)+'%';
  s.style.animationDelay=(-Math.random()*0.9).toFixed(2)+'s';
  frame.append(s);
  setTimeout(()=>s.remove(),3400);
}
function rng(seed){
  let a=(seed>>>0)||1;
  return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
}
/* ===== شكل اللسان (العاشق والمعشوق) =====
   عمق اللسان = نسبة ثابتة من طول الضلع (TAB_D) في كل الاتجاهات،
   وبنحجزه جوه هامش الكانفس m عشان ما يتقصّش أبدًا.
   t=1 اللسان بارز للخارج، t=-1 داخل للداخل، t=0 ضلع مستقيم. */
const TAB_D=0.22;
/* نقاط تحكّم منحنى اللسان (نسبة من الضلع + نسبة من العمق) */
const BEZ=[
  [.34,.00,.16,.85,.34,1.00],
  [.66,1.00,.84,.85,.66,.00]
];
function edge(p,x0,y0,x1,y1,t){
  if(!t)return p.lineTo(x1,y1);
  const len=Math.hypot(x1-x0,y1-y0)||1;
  const d=TAB_D*len*t;
  /* اتجاه عمودي على الضلع، ثابت الطول (d) عشان تكرار نفس الشكل */
  const nx=((y1-y0)/len)*d, ny=(-(x1-x0)/len)*d;
  BEZ.forEach(k=>p.bezierCurveTo(
    x0+(x1-x0)*k[0]+nx*k[1], y0+(y1-y0)*k[0]+ny*k[1],
    x0+(x1-x0)*k[2]+nx*k[3], y0+(y1-y0)*k[2]+ny*k[3],
    x0+(x1-x0)*k[4]+nx*k[5], y0+(y1-y0)*k[4]+ny*k[5]));
  p.lineTo(x1,y1);
}
function shape(r,c){
  const p=new Path2D(),a=m,b=m+ps;
  p.moveTo(a,a);
  edge(p,a,a,b,a,r?-H[r-1][c]:0);
  edge(p,b,a,b,b,c<cfg.n-1?V[r][c]:0);
  edge(p,b,b,a,b,r<cfg.n-1?H[r][c]:0);
  edge(p,a,b,a,a,c?-V[r][c-1]:0);
  p.closePath();return p;
}
function makeEdges(){
  const r=rng(cfg.seed+cfg.n*1009);
  H=Array.from({length:cfg.n},()=>Array.from({length:cfg.n},()=>r()<.5?1:-1));
  V=Array.from({length:cfg.n},()=>Array.from({length:cfg.n},()=>r()<.5?1:-1));
}
/* [M13] تحميل مضمون: أي فشل أو تعليق = نكمّل بعد مهلة قصيرة أو نرجّع صورة بديلة */
function loadImage(){
  const url=LEVELS[cfg.imageIndex%LEVELS.length];
  return new Promise(resolve=>{
    const im=new Image();
    let done=false;
    const finish=ok=>{if(done)return;done=true;resolve(ok?im:null)};
    const timer=setTimeout(()=>finish(false),6000);
    im.onload=()=>{clearTimeout(timer);finish(true)};
    im.onerror=()=>{clearTimeout(timer);finish(false)};
    try{im.decoding='async'}catch{}
    im.src=url;
    if(im.complete&&im.naturalWidth){clearTimeout(timer);finish(true)}
  }).then(im=>{
    if(im){src=im;return true}
    /* محاولة تانية بصورة من مكتبة البازل */
    return new Promise(resolve=>{
      const alt=new Image();let done=false;
      const t2=setTimeout(()=>{if(!done){done=true;resolve(false)}},5000);
      alt.onload=()=>{if(done)return;done=true;clearTimeout(t2);src=alt;resolve(true)};
      alt.onerror=()=>{if(done)return;done=true;clearTimeout(t2);resolve(false)};
      alt.src=LEVELS[(cfg.imageIndex+1)%LEVELS.length];
    });
  });
}
function build(tries){
  if(!src)return;
  tries=Number(tries)||0;
  z=10;drag=null;waitingAck=false;
  /* [M14] جولة جديدة = نحتفل من أول وجديد */
  celebrated=false;frame.classList.remove('done','peek','flash');
  const n=cfg.n,total=n*n;
  /* ===== قياس المساحة المتاحة فعليًا: صندوق الصورة + صندوق الرفّ ===== */
  const stage=document.getElementById('stage');
  const board=document.getElementById('board');
  /* [M13] لو الصفحة لسه ما استقرّتش، قيس تاني بعد ما المتصفح يرسم (بحد أقصى ٥ محاولات) */
  if(stage&&tries<5&&(stage.clientWidth<160||stage.clientHeight<140)){
    requestAnimationFrame(()=>{if(src)build(tries+1)});
    return;
  }
  /* [M13] في الوضع الأفقي العريض نحط القطع على الجنب (الصورة تبقى أكبر).
     العتبة 760 عشان تابلت 11 بوصة في اللاندسكيب (1024×768) يستفيد. */
  const stack=!(innerWidth>=760&&innerWidth>innerHeight*1.05);
  const gap=6;
  document.body.classList.toggle('stack',stack);
  document.body.classList.toggle('side',!stack);
  const stageW=Math.max(180,stage.clientWidth||innerWidth-14);
  const stageH=Math.max(140,(board&&board.clientHeight)||(innerHeight-250));
  const wrapPad=stack?10:12;

  /* القطع المحتاجة تتوصّل (مش في مكانها) */
  const placedSet=new Set((cfg.placed||[]).map(Number));
  const loose=[];
  for(let rr=0;rr<n;rr++)for(let cc=0;cc<n;cc++)if(!placedSet.has(rr*n+cc))loose.push(rr*n+cc);

  /* ===== إيجاد أفضل مقاس =====
     ندور على أكبر مقاس صورة ممكن بحيث الصورة + الرفّ الاتنين يدخلوا
     جوّه المساحة المتاحة (بدون أي سكرول).
     بنجرّب كمان تصغير قطع الرفّ — الرفّ الأصغر = صورة أكبر. */
  const trayMaxW=stack?stageW:Math.min(320,Math.round(stageW*0.36));

  let solved=null,bestScore=-1;
  /* سقف البحث: لازم يسمح للصورة تاخد معظم عرض/ارتفاع المساحة المتاحة */
  const hi=Math.min(700,Math.max(stageW,stageH));
  const SCALES=[1,.86,.74,.62,.52,.44,.36];
  for(let tryPs=20;tryPs<=hi;tryPs++){
    /* الهامش لازم يستوعب عمق اللسان (TAB_D) + سماكة الرسم */
    const tryM=Math.ceil(tryPs*TAB_D)+2, tryCw=tryPs+2*tryM, tryFw=tryPs*n;
    const capW=stack?stageW:trayMaxW;
    /* سقف ارتفاع الرفّ: أقل مساحة ممكنة، وبحد أقصى نص الشاشة في الستاك */
    const capH=stack?Math.round(stageH*0.5):stageH;
    for(const sc of SCALES){
      const trySw=Math.round(tryCw*sc);
      const colsMax=Math.max(1,Math.min(loose.length||1,Math.floor((capW-PIECE_PAD)/(trySw+PIECE_PAD))||1));
      let trayFit=null;
      /* نجرّب الأعمدة من الأكبر للأصغر وناخد أول شبكة تدخل في السقف */
      for(let cols=colsMax;cols>=1;cols--){
        const rows=Math.ceil((loose.length||1)/cols);
        const w=cols*trySw+(cols+1)*PIECE_PAD;
        const h=rows*trySw+(rows+1)*PIECE_PAD+PIECE_PAD_TOP;
        if(w<=capW&&h<=capH){trayFit={cols,rows,w,h,s:sc};break}
      }
      if(!loose.length)trayFit={cols:1,rows:0,w:trySw+PIECE_PAD*2,h:PIECE_PAD_TOP+PIECE_PAD,s:sc};
      if(!trayFit)continue;
      /* الصورة + الرفّ لازم يدخلوا مع بعض جوّه المساحة */
      const totalW=stack?Math.max(tryFw+wrapPad,trayFit.w+wrapPad):tryFw+wrapPad+trayFit.w+gap;
      const totalH=stack?tryFw+wrapPad+trayFit.h+gap:Math.max(tryFw+wrapPad,trayFit.h);
      if(totalW>stageW||totalH>stageH)continue;
      /* نفضّل أكبر صورة، لكن بشرط إن قطع الرفّ تفضل كبيرة كفاية
         للأصابع الصغيرة. لو المقياس صغير جدًا نخصم من النتيجة. */
      const piecePx=trySw;
      const smallPenalty=piecePx<64?Math.round((64-piecePx)*900):0;
      const score=tryFw*10000+Math.round(trayFit.s*100)-Math.round(trayFit.h)-smallPenalty;
      if(score>bestScore){bestScore=score;solved={ps:tryPs,m:tryM,cw:tryCw,fw:tryFw,trayFit}}
    }
  }
  /* لو مفيش حل مثالي، انزل لأصغر مقاس ممكن (مع سكرول داخل الرفّ كحل أخير) */
  if(!solved){
    const tryPs=20,tryM=Math.ceil(tryPs*TAB_D)+2,tryCw=tryPs+2*tryM;
    const trySw=Math.round(tryCw*TRAY_SCALE);
    solved={ps:tryPs,m:tryM,cw:tryCw,fw:tryPs*n,
      trayFit:{cols:1,rows:(loose.length||n*n),w:trySw+PIECE_PAD*2,h:trySw*(loose.length||n*n)+PIECE_PAD*9+PIECE_PAD_TOP,s:TRAY_SCALE}};
  }
  ps=solved.ps;m=solved.m;cw=solved.cw;fw=solved.fw;
  const trayBoxW=stack?stageW:Math.min(trayMaxW,solved.trayFit.w);
  const trayBoxH=stack?Math.min(Math.round(stageH*0.5),solved.trayFit.h):stageH;
  tray.style.cssText=stack
    ? `height:${trayBoxH}px;width:100%`
    : `width:${trayBoxW}px;height:${trayBoxH}px`;
  tray.dataset.mode=stack?'h':'v';
  trayScale=solved.trayFit.s;
  const homes=pieceHomes(loose,cw,tray.clientWidth,tray.clientHeight,trayScale);

  /* الصندوق = مقاس الصورة بالظبط، مفيش أي مساحة مهدورة */
  wrap.style.cssText='';
  area.style.cssText=`width:${fw}px;height:${fw}px`;
  frame.style.cssText=`width:${fw}px;height:${fw}px`;
  frame.className=cfg.finished?'done':'';
  won.style.cssText=`left:0;top:${Math.max(6,Math.round(fw*.38))}px;width:${fw}px`;

  const full=document.createElement('canvas');
  full.width=full.height=Math.max(1,Math.round(fw*dpr));
  full.className='ghost';
  full.style.cssText=`width:${fw}px;height:${fw}px`;
  const iw=src.naturalWidth||src.width,ih=src.naturalHeight||src.height,sq=Math.min(iw,ih);
  full.getContext('2d').drawImage(src,(iw-sq)/2,(ih-sq)/2,sq,sq,0,0,full.width,full.height);
  frame.replaceChildren(full);

  makeEdges();
  /* [M13] نشيل القطع القديمة من الصورة ومن الرفّ — قبل كده كانت بتتراكم */
  area.querySelectorAll('.pc').forEach(p=>p.remove());
  tray.querySelectorAll('.pc').forEach(p=>p.remove());

  for(let rr=0;rr<n;rr++)for(let cc=0;cc<n;cc++){
    const index=rr*n+cc,cv=document.createElement('canvas'),x=cv.getContext('2d'),p=shape(rr,cc);
    cv.width=cv.height=Math.round(cw*dpr);
    cv.style.width=cv.style.height=cw+'px';
    x.scale(dpr,dpr);x.save();x.clip(p);
    x.drawImage(full,m-cc*ps,m-rr*ps,fw,fw);x.restore();
    x.lineWidth=1.5;x.strokeStyle='rgba(0,0,0,.48)';x.stroke(p);
    cv.className='pc';cv.dataset.index=index;
    cv._tx=cc*ps-m;cv._ty=rr*ps-m;
    cv._cw=cw;
    if(placedSet.has(index)){
      clearTrayScale(cv);
      cv.style.left=cv._tx+'px';cv.style.top=cv._ty+'px';cv.style.zIndex=1;cv.classList.add('set');
      cv._home=null;
      area.append(cv);
    }else{
      const h=homes.get(index);
      cv._home=h;
      cv.classList.add('home');
      cv.style.left=h.x+'px';cv.style.top=h.y+'px';
      cv.onpointerdown=down;
      tray.append(cv);
    }
  }
  layoutTray();
  updateText();showBest();
}

/* ===== مقاسات شبكة الرفّ ===== */
const PIECE_PAD=3, PIECE_PAD_TOP=13;
/* [M13] مقاس القطعة داخل الرفّ = 62% من مقاسها الحقيقي.
   كده الرفّ بيبقى أنحف والصورة تكبر، والقطعة بتكبر لحجمها الكامل
   أول ما الطفل يمسكها. */
const TRAY_SCALE=0.62;

/* ===== مواضع القطع داخل الرفّ =====
   نرجّع Map(index → {x,y}) بإحداثيات نسبةً للرفّ (لأن القطع أبناء #tray مباشرة).
   مهم: الشبكة لازم تدخل جوّه الرفّ فعلًا (عرضًا وارتفاعًا) وإلا القطع تخرج برّه. */
function pieceHomes(list,cw,trayW,trayH,sc){
  const homes=new Map();
  const N=list.length;
  if(!N||trayW<=0||trayH<=0||cw<=0)return homes;
  const pad=PIECE_PAD,padT=PIECE_PAD_TOP;
  if(!(sc>0))sc=trayScaleFor(cw,trayW,trayH,N);
  const sw=Math.round(cw*sc);
  /* نجرّب عدد الأعمدة من الأكبر للأصغر وناخد أول واحد يدخل فعلًا */
  const maxCols=Math.max(1,Math.floor((trayW-pad)/(sw+pad)));
  let cols=0;
  for(let c=maxCols;c>=1;c--){
    const rows=Math.ceil(N/c);
    if(c*sw+(c+1)*pad<=trayW&&rows*sw+(rows+1)*pad+padT<=trayH){cols=c;break}
  }
  if(!cols)cols=maxCols;
  const rows=Math.ceil(N/cols);
  const gW=cols*sw+(cols+1)*pad, gH=rows*sw+(rows+1)*pad+padT;
  const ox=Math.max(pad,(trayW-gW)/2+pad), oy=Math.max(padT,(trayH-gH)/2+padT);
  /* [RTL] نملأ من اليمين للشمال */
  list.forEach((idx,i)=>{
    const r=Math.floor(i/cols),c=i%cols;
    /* الموضع = ركن الشبكة؛ القطعة بتتقاس من نفس الركن (transform-origin) فالمقاس المصغّر يملأ الخانة بالظبط */
    homes.set(idx,{x:ox+(cols-1-c)*(sw+pad),y:oy+r*(sw+pad),s:sc,sq:sw});
  });
  return homes;
}
/* مقياس القطعة في الرفّ: الأساس 62%، وبنصغّره لو مش داخل بـ62% */
function trayScaleFor(cw,trayW,trayH,N){
  const pad=PIECE_PAD,padT=PIECE_PAD_TOP;
  for(let sc=TRAY_SCALE;sc>=0.3;sc-=0.04){
    const sw=cw*sc;
    const maxCols=Math.max(1,Math.floor((trayW-pad)/(sw+pad)));
    for(let c=maxCols;c>=1;c--){
      const rows=Math.ceil(N/c);
      if(c*sw+(c+1)*pad<=trayW&&rows*sw+(rows+1)*pad+padT<=trayH)return sc;
    }
  }
  return 0.3;
}
/* [M13] القطعة في الرفّ بتتعرض مصغّرة؛ عند الإمساك بها تتكبّر.
   بنستخدم transform عشان ما نغيّرش مقاس الكانفس (النقش ثابت). */
function setTrayScale(el,on){
  el.style.transformOrigin='top left';
  el.style.transform=on?'':`scale(${el._trayScale||TRAY_SCALE})`;
}
/* [M13] إزالة تصغير الرفّ تمامًا (لما القطعة تتحط في مكانها النهائي) */
function clearTrayScale(el){
  el.style.transform='';
  el.style.transformOrigin='';
}

/* ترتيب القطع المتبقية في الرفّ بعد كل تركيب */
function layoutTray(){
  const list=[...tray.querySelectorAll('.pc')];
  if(!list.length){tray.classList.add('empty');return}
  tray.classList.remove('empty');
  const cw=Number(list[0]._cw)||list[0].offsetWidth;
  const homes=pieceHomes(list.map(cv=>Number(cv.dataset.index)),cw,tray.clientWidth,tray.clientHeight,trayScale);
  list.forEach(cv=>{
    const h=homes.get(Number(cv.dataset.index));
    if(!h)return;
    cv._home=h;
    cv._trayScale=h.s;
    if(!cv.classList.contains('drag')){
      cv.classList.add('home');
      cv.style.left=h.x+'px';cv.style.top=h.y+'px';
      setTrayScale(cv,false);
    }
  });
}
function applyPlaced(){
  const placedSet=new Set((cfg.placed||[]).map(Number));
  tray.querySelectorAll('.pc').forEach(cv=>{
    const idx=Number(cv.dataset.index);
    if(!placedSet.has(idx))return;
    cv.classList.remove('drag','home','near');
    /* [M13] مهم جداً: نشيل تصغير الرفّ وإلا القطعة تظهر صغيرة ومرزاحة
       لأن transform-origin مش ركن الموضع الصح. ده كان سبب اختلاف الشكل
       بين الجهازين: اللي بتحط القطعة عندها بتظهر صح، والتانية بتستقبلها
       مصغّرة في مكان غلط. */
    clearTrayScale(cv);
    cv.style.left=cv._tx+'px';cv.style.top=cv._ty+'px';cv.style.zIndex=1;
    cv.classList.add('set');
    cv.onpointerdown=null;
    area.append(cv);
  });
  frame.classList.toggle('done',Boolean(cfg.finished));
  layoutTray();
  waitingAck=false;updateText();
}

/* اللعبة الحالية نظيفة؟ (نفس الصورة ونفس المقاس ونفس لبنة القطع) */
function sameBoard(){
  return !!(src&&lastBuildKey===`${cfg.roundId}:${cfg.imageIndex}:${cfg.n}:${cfg.seed}`);
}
/* [M13] ضغطة واحدة على أي قطعة = القطعة تلزق في صباع الطفل (سواء كانت في
   الرفّ أو فوق الصورة). لو كانت في الرفّ نطلّعها فوق الصورة فورًا. */
function down(e){
  if(!canPlay()||e.button>0)return;
  const el=e.currentTarget;
  if(el.classList.contains('set'))return;
  e.preventDefault();
  /* القطعة تفضل تحت الصباع من أول لحظة؛ لو كانت في الرفّ بننقلها لمنطقة
     الصورة بنفس إحداثياتها عشان ما يحصلش «قفزة» مربكة للطفل. */
  let l=el.offsetLeft,t=el.offsetTop;
  if(el.parentElement===tray){
    const tr=tray.getBoundingClientRect(),ar=area.getBoundingClientRect();
    const sc=el._trayScale||1;
    /* [M13] القطعة في الرفّ مصغّرة (transform). إحداثيات الصباع نسبةً
       للمقاس المصغّر، فلما تكبر لازم نضربها في المقياس عشان القطعة
       تفضل تحت الصباع بالظبط. */
    const rb=el.getBoundingClientRect();
    const fx=Math.min(1,Math.max(0,(e.clientX-rb.left)/Math.max(1,rb.width)));
    const fy=Math.min(1,Math.max(0,(e.clientY-rb.top)/Math.max(1,rb.height)));
    el.classList.remove('home');
    setTrayScale(el,true);
    /* نضع القطعة الكاملة بحيث الصباع يقع على نفس النقطة النسبية */
    l=Math.round(rb.left-ar.left-fx*el.offsetWidth);
    t=Math.round(rb.top-ar.top-fy*el.offsetHeight);
    el.style.left=l+'px';el.style.top=t+'px';
    area.append(el);
    el.classList.remove('near');
    drag={el,parent:area,x:e.clientX,y:e.clientY,l,t,cw:el.offsetWidth};
    el.style.zIndex=++z;el.classList.add('drag');
    return;
  }
  el.classList.remove('near');
  drag={el,parent:el.parentElement,x:e.clientX,y:e.clientY,l,t,cw:el.offsetWidth};
  el.style.zIndex=++z;el.classList.add('drag');
}
function move(e){
  if(!drag)return;
  e.preventDefault();
  const el=drag.el,cw=drag.cw;
  const rawX=drag.l+e.clientX-drag.x, rawY=drag.t+e.clientY-drag.y;
  /* القطعة بتتحرك فوق صندوق الصورة، وبنسمح بشوية بروز برّه عشان اللسان */
  const pos=[
    Math.max(-m,Math.min(area.offsetWidth-cw+m,rawX)),
    Math.max(-m,Math.min(area.offsetHeight-cw+m,rawY))
  ];
  el.style.left=pos[0]+'px';el.style.top=pos[1]+'px';
  /* تنبيه بصري: لما الصباع يقرّب من المكان الصح، القطعة تلمع */
  el.classList.toggle('near',Math.hypot(pos[0]-el._tx,pos[1]-el._ty)<ps*.34);
}
function up(){
  if(!drag)return;
  const el=drag.el;
  drag=null;
  el.classList.remove('drag','near');
  /* قريبة كفاية من مكانها الصح → تلزق وتتثبّت */
  const close=Math.hypot(el.offsetLeft-el._tx,el.offsetTop-el._ty)<ps*.34;
  if(close){
    clearTrayScale(el);
    el.style.left=el._tx+'px';el.style.top=el._ty+'px';el.style.zIndex=1;el.classList.add('set');
    el.onpointerdown=null;
    waitingAck=true;updateText();
    boom();
    parent.postMessage({type:'roqaya-jigsaw-piece',piece:Number(el.dataset.index),roundId:cfg.roundId},location.origin);
    return;
  }
  /* بعيدة → ترجع للرفّ وترتّب نفسه من جديد (أسهل للطفل من إنها تفضل معلّقة) */
  returnToTray(el);
}
/* النقل والتركيب: نستمع على مستوى الصفحة كلها مرة واحدة —
   كده السحب يفضل شغال لو الصباع خرج برّه القطعة أو برّه منطقة اللعب. */
addEventListener('pointermove',e=>move(e),{passive:false});
addEventListener('pointerup',()=>up(),{passive:false});
addEventListener('pointercancel',()=>up(),{passive:false});

/* رجوع القطعة للرفّ + إعادة ترتيب الرفّ */
function returnToTray(el){
  el.classList.remove('drag','near');
  el.classList.add('home');
  /* نلغي الأنيميشن لحظة الرجوع عشان الموضع يبان فورًا وما يبقاش فيه وميض */
  el.style.transition='none';
  el.style.left='0px';el.style.top='0px';
  setTrayScale(el,false);
  tray.append(el);
  el.onpointerdown=down;
  layoutTray();
  /* نرجّع الأنيميشن بعد ما الموضع يستقر */
  requestAnimationFrame(()=>{el.style.transition=''});
}
async function applyConfig(next){
  const oldKey=`${cfg.roundId}:${cfg.imageIndex}:${cfg.n}:${cfg.seed}`;
  cfg={...cfg,...next,n:[3,4,5,6].includes(Number(next.n))?Number(next.n):3};
  const newKey=`${cfg.roundId}:${cfg.imageIndex}:${cfg.n}:${cfg.seed}`;
  const needsBuild=newKey!==oldKey||!sameBoard();
  if(needsBuild){
    await loadImage();
    build();
    lastBuildKey=newKey;
  }else{
    applyPlaced();
  }
  checkCheer();
}
/* [M14] «شوف الصورة» = كشف مؤقت (ثانيتين ونص) ثم تختفي تلقائيًا.
   ده يحافظ على التحدي بينما يفضل عندنا مساعدة عند الحاجة. */
let peekT=0;
function showPeek(ms){
  frame.classList.add('peek');
  clearTimeout(peekT);
  peekT=setTimeout(()=>frame.classList.remove('peek'),ms||2500);
}
$('#hint').onclick=()=>{
  if(frame.classList.contains('done'))return;
  if(frame.classList.contains('peek')){clearTimeout(peekT);frame.classList.remove('peek');return}
  showPeek(2500);
};
$('#cheer').onclick=()=>{
  if(cfg.finished||cfg.turn===cfg.role)return;
  const b=$('#cheer');
  b.disabled=true;
  b.textContent='💜';
  parent.postMessage({type:'roqaya-jigsaw-cheer',roundId:cfg.roundId},location.origin);
  setTimeout(()=>{b.textContent='👏';updateText()},850);
};
$('#new').onclick=()=>{
  if(cfg.role!=='host')return;
  parent.postMessage({type:'roqaya-jigsaw-new',n:+$('#size').value},location.origin);
};
/* [M13] تغيير عدد القطع = لعبة جديدة فورًا. قبل كده كان التغيير بيتحفظ بس،
   وupdateText كانت بترجّع القيمة القديمة → الزرار «مش بيستجيب». */
$('#size').onchange=e=>{
  const n=Number(e.target.value);
  if(![3,4,5,6].includes(n))return;
  try{localStorage.setItem('roqaya-jigsaw-n',String(n))}catch{}
  if(cfg.role!=='host'){updateText();return}
  if(cfg.n===n&&!cfg.finished)return;
  const nb=$('#new');
  nb.textContent='⏳';nb.disabled=true;nb.dataset.busy='1';
  parent.postMessage({type:'roqaya-jigsaw-new',n,keepImage:true},location.origin);
  setTimeout(()=>{nb.textContent='🔄';nb.dataset.busy='0';updateText()},1600);
};
/* [M11] زر المدينة الموحّد أسفل اللعبة */
const cityBtn=document.getElementById('city');
if(cityBtn)cityBtn.onclick=()=>parent.postMessage({type:'roqaya-jigsaw-city'},location.origin);
/* [M13] إعادة الرسم عند تغيير المقاس أو الدوران — القطعة اللي في الإيد ما تتلغبطش */
let resizeT=0,lastW=innerWidth,lastH=innerHeight;
addEventListener('resize',()=>{
  if(Math.abs(innerWidth-lastW)<24&&Math.abs(innerHeight-lastH)<60)return;
  clearTimeout(resizeT);
  resizeT=setTimeout(()=>{
    lastW=innerWidth;lastH=innerHeight;
    if(!src)return;
    if(drag){const d=drag;drag=null;d.el.classList.remove('drag');}
    /* القطع المرفوعة فوق الصورة ترجع للرفّ عند إعادة الرسم */
    build();lastBuildKey=`${cfg.roundId}:${cfg.imageIndex}:${cfg.n}:${cfg.seed}`;
  },220);
});
addEventListener('orientationchange',()=>{lastW=lastH=0;dispatchEvent(new Event('resize'))});
addEventListener('message',e=>{
  if(e.origin!==location.origin||e.data?.type!=='roqaya-jigsaw-config')return;
  applyConfig(e.data.config).catch(console.error);
});
timer=setInterval(updateText,1000);
parent.postMessage({type:'roqaya-jigsaw-ready'},location.origin);
</script>
</body>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>السلم والثعبان</title>
<style>
:root{--s:min(94vw,560px);--bg:#0f2a4a;--card:#1c4373;--accent:#ffb703;--p1:#e63946;--p2:#7b3fe4}
*{box-sizing:border-box}html,body{margin:0;height:100dvh;min-height:100dvh;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;gap:6px;padding:58px 8px 10px;background:var(--bg);color:#fff;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;position:relative}
.top-bar{position:fixed;top:0;left:0;right:0;z-index:12;background:linear-gradient(180deg,rgba(15,42,74,.98) 0%,rgba(15,42,74,.9) 100%);backdrop-filter:blur(6px);padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.12)}
.top-row{display:flex;align-items:center;gap:6px;justify-content:space-between;width:min(94vw,560px);margin:0 auto;flex-direction:row}
.top-left{display:flex;align-items:center;gap:5px;flex-direction:row-reverse}
.win-pill{background:var(--card);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:3px 8px;font-weight:800;font-size:.76rem;display:flex;align-items:center;gap:4px}
#status{margin:0;flex:1;text-align:center;font-weight:800;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.4em}
.top-btn{width:36px;height:36px;border-radius:10px;background:var(--card);color:#fff;border:1px solid rgba(255,255,255,.16);font-size:1rem;display:grid;place-items:center;padding:0}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;background:transparent!important;box-shadow:none!important;border:none!important}
.dice-wrap{width:100%;display:flex;align-items:center;justify-content:center;margin-top:6px;padding:4px 0 2px}
.players{display:none!important}
#dice{width:62px;height:62px;padding:9px;border-radius:14px;background:#ff7a2a;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);place-items:center;box-shadow:0 4px 0 #b94f0a;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;margin:0 auto}
#dice i{width:10px;height:10px;border-radius:50%;background:#1b2a41;visibility:hidden}#dice i.on{visibility:visible}
#dice.roll{animation:shake .25s infinite}@keyframes shake{50%{transform:rotate(14deg) scale(1.08)}}
button{font:inherit;padding:9px 14px;border:0;border-radius:11px;cursor:pointer;background:var(--card);color:#fff}
button:disabled{opacity:.48;cursor:default}
#board{position:relative;width:var(--s);aspect-ratio:1;direction:ltr;margin-bottom:0;border-radius:12px;box-shadow:0 0 0 5px var(--accent),0 10px 30px rgba(0,0,0,.45);touch-action:manipulation;visibility:hidden}
#board.photo-board{border-radius:0;box-shadow:none;background-repeat:no-repeat;background-position:center;background-size:100% 100%}
#board-grid{position:absolute;direction:ltr;touch-action:manipulation}
#svg{display:block;width:100%;height:100%;border-radius:12px}
.tok{position:absolute;width:6%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.5);transform:translate(-50%,-50%);transition:left .2s,top .2s;display:grid;place-items:center;font-size:calc(var(--s)*.032);line-height:1;font-weight:800;color:#fff}
.tok.jump{transition:left .7s ease-in-out,top .7s ease-in-out}.fl{pointer-events:none;animation:fade .5s forwards}@keyframes fade{from{opacity:.7}to{opacity:0}}
.actions{display:none!important}#new{background:#2a6f9e;font-weight:850}#city{background:#6443a8;font-weight:850}
.tip{margin:0;color:#a9c0dc;font-size:.78rem;text-align:center;max-width:var(--s);line-height:1.55}
@media(max-width:420px){body{gap:7px;padding:56px 5px 70px}#dice{width:56px;height:56px}.player{font-size:.64rem;padding:5px 6px}#status{font-size:.78rem}.tip{font-size:.68rem}button{padding:8px 10px;font-size:.72rem}.top-btn{width:34px;height:34px}}
@media(prefers-reduced-motion:reduce){#dice.roll{animation:none}.tok,.tok.jump{transition:none}}
</style>
<link rel="stylesheet" href="game-shell.css?v=1">
</head>
<body>
<div class="top-bar">
  <div class="top-row">
    <div class="top-left">
      <button id="city" class="top-btn" title="المدينة">🎡</button>
      <button id="new" class="top-btn" title="لعبة جديدة">🔄</button>
      <span class="win-pill">👨<b id="w-host">٠</b> • 👧<b id="w-guest">٠</b></span>
    </div>
    <p id="status" aria-live="polite">جاري تجهيز اللعبة…</p>
  </div>
</div>
<div class="dice-wrap"><div id="dice" role="img" aria-label="النرد"></div></div>
<div id="board"><div id="board-grid"><svg id="svg" viewBox="0 0 100 100"></svg></div></div>
<div class="actions" style="display:none!important" hidden></div>
<audio id="ladder-voice" src="assets/ladder-climb.ogg" preload="auto"></audio>
<audio id="snake-voice" src="assets/snake-descent.ogg" preload="auto"></audio>
<script>
const $=s=>document.querySelector(s),board=$('#board'),playfield=$('#board-grid');
const BOARD_LAYOUTS=[
 {ladders:{1:38,4:14,9:31,21:42,28:84,36:44,51:67,71:91,80:100},snakes:{16:6,47:26,49:11,56:53,62:19,64:60,87:24,93:73,95:75,98:78},tiles:['#f6d9e8','#fff1a8','#a9d5ee','#b8dfbe','#f29a52','#6fc9c0'],frame:'#ffcf40',ladder:'#8b572f',snakeColors:['#49a849','#e58638','#9460c5','#22aab0','#e55b8b','#c69a22','#4e88dc','#d95539','#0f9d8a','#7c4dff']},
 {ladders:{2:22,4:14,7:17,9:30,21:41,23:38,36:44,51:68,54:83,71:91,78:98},snakes:{99:80,95:75,93:73,89:71,66:53,64:58,62:38,49:32,46:24},image:'assets/snakes-boards/board-1.jpg',aspect:.764,grid:{x:.004,y:.003,w:.992,h:.993}},
 {ladders:{4:24,8:49,28:46,30:50,39:60,52:68,64:84,71:92,72:93,83:98},snakes:{99:78,96:64,94:74,90:52,81:61,66:47,57:24,43:19,36:14,11:9},image:'assets/snakes-boards/board-2.jpg',aspect:.704,grid:{x:.018,y:.01,w:.967,h:.964}},
 {ladders:{10:32,12:29,21:40,27:65,51:68,71:91,79:81},snakes:{98:77,95:74,93:72,64:58,62:39,56:37,53:31,15:6},image:'assets/snakes-boards/board-3.jpg',aspect:1,grid:{x:.086,y:.08,w:.83,h:.84}},
 {ladders:{2:22,9:31,14:28,18:37,38:58,40:60,54:75,71:90,78:83,82:97},snakes:{99:79,93:73,85:55,68:54,64:58,62:22,49:32,16:5},image:'assets/snakes-boards/board-4.jpg',aspect:1,grid:{x:.004,y:.004,w:.992,h:.992}},
 {ladders:{4:16,9:29,37:57,62:82,69:89},snakes:{97:35,93:47,88:54,63:40,48:13,25:4},image:'assets/snakes-boards/board-5.jpg',aspect:1.032,grid:{x:.016,y:.014,w:.968,h:.972}}
];
const boardIndex=seed=>Math.abs(Number(seed)||0)%BOARD_LAYOUTS.length,boardFor=seed=>BOARD_LAYOUTS[boardIndex(seed)];
const PIPS=[[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const EASTERN='٠١٢٣٤٥٦٧٨٩',ar=v=>String(v).replace(/[0-9]/g,d=>EASTERN[d.charCodeAt(0)-48]);
const ladderVoice=$('#ladder-voice'),snakeVoice=$('#snake-voice');
let cfg={role:'guest',childName:'رقية',positions:{host:0,guest:0},turn:'host',phase:'ready',dice:null,spinId:0,roundId:0,boardSeed:0,winner:null,lastEvent:null,move:null,soundEnabled:true,snakeWins:{host:0,guest:0}};
let spinTimer=0,cur=1,animating=false,initialized=false,seenMoveId=0,seenMoveRoundId=null,seenEventId=0,eventText='',eventTimer=0,ac=null,boardImageToken=0,hasBoardConfig=false;
const rc=n=>{const i=n-1,r=i/10|0;return[r%2?9-i%10:i%10,r]},ctr=n=>{const[c,r]=rc(n);return[c*10+5,(9-r)*10+5]},nameOf=r=>r==='host'?'بابا':(cfg.childName||'رقية'),myTurn=()=>cfg.turn===cfg.role&&!cfg.winner,wait=ms=>new Promise(r=>setTimeout(r,ms));
function ladder(a,b,color){const[x1,y1]=ctr(a),[x2,y2]=ctr(b),dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy*1.7,py=ux*1.7,ln=(ax,ay,bx,by,c,w)=>`<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;let s=ln(x1+px,y1+py,x2+px,y2+py,color,1.2)+ln(x1-px,y1-py,x2-px,y2-py,color,1.2);for(let d=3;d<L-2;d+=4.2){const cx=x1+ux*d,cy=y1+uy*d;s+=ln(cx+px,cy+py,cx-px,cy-py,'#f3c984',1)}return s}
function snake(a,b,col){const[x1,y1]=ctr(a),[x2,y2]=ctr(b),dx=x2-x1,dy=y2-y1,nx=-dy*.18,ny=dx*.18,d=`M${x1} ${y1}C${x1+dx*.33+nx} ${y1+dy*.33+ny} ${x1+dx*.66-nx} ${y1+dy*.66-ny} ${x2} ${y2}`,p=(w,c,x='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`,e=(ex,r,c)=>`<circle cx="${x1+ex}" cy="${y1-.7}" r="${r}" fill="${c}"/>`;return p(3.6,'rgba(0,0,0,.35)')+p(2.8,col)+p(1,'#fff','stroke-dasharray="0.1 2.4" opacity=".7"')+`<circle cx="${x1}" cy="${y1}" r="2.4" fill="${col}"/>`+e(-.9,.8,'#fff')+e(.9,.8,'#fff')+e(-.9,.4,'#111')+e(.9,.4,'#111')}
function draw(theme=boardFor(cfg.boardSeed),photoAllowed=true){const{ladders,snakes}=theme,aspect=theme.aspect||1,grid=theme.grid||{x:0,y:0,w:1,h:1};board.style.setProperty('--board-aspect',aspect);board.style.aspectRatio=String(aspect);board.style.width=Math.min(window.innerWidth*.94,560,Math.max(160,window.innerHeight-220)*aspect)+'px';playfield.style.left=(grid.x*100)+'%';playfield.style.top=(grid.y*100)+'%';playfield.style.width=(grid.w*100)+'%';playfield.style.height=(grid.h*100)+'%';board.style.backgroundImage=theme.image&&photoAllowed?`url("${theme.image}")`:'none';board.classList.toggle('photo-board',!!theme.image&&photoAllowed);if(theme.image&&photoAllowed){const token=++boardImageToken;board.style.visibility='hidden';$('#svg').innerHTML='';const image=new Image();image.onload=()=>{if(token===boardImageToken)board.style.visibility=hasBoardConfig?'visible':'hidden'};image.onerror=()=>{if(token===boardImageToken)draw(BOARD_LAYOUTS[0],false)};image.src=theme.image;return}board.style.visibility=hasBoardConfig?'visible':'hidden';document.documentElement.style.setProperty('--accent',theme.frame);let s='';for(let n=1;n<=100;n++){const[c,r]=rc(n),[x,y]=ctr(n),tile=n===100?'#ffd166':theme.tiles[(c+r)%theme.tiles.length];s+=`<rect x="${x-5}" y="${y-5}" width="10" height="10" fill="${tile}" stroke="${theme.frame}" stroke-opacity=".2" stroke-width=".18"/>`+`<text x="${x-4.35}" y="${y-2.3}" font-size="3" font-weight="800" fill="#173447" paint-order="stroke" stroke="#fff" stroke-opacity=".7" stroke-width=".35" style="pointer-events:none">${n}</text>`}for(let r=0;r<10;r++){const y=5+(9-r)*10;if(r%2===0)s+=`<text x="0.6" y="${y+2.2}" font-size="3.6" fill="#e63946" font-weight="900" style="pointer-events:none">→</text>`;else s+=`<text x="0.6" y="${y+2.2}" font-size="3.6" fill="#1d4ed8" font-weight="900" style="pointer-events:none">←</text>`}for(const a in ladders)s+=ladder(+a,ladders[a],theme.ladder);Object.keys(snakes).forEach((a,i)=>s+=snake(+a,snakes[a],theme.snakeColors[i%theme.snakeColors.length]));s+=`<g style="pointer-events:none">${Array.from({length:100},(_,i)=>{const n=i+1,[x,y]=ctr(n);return `<text x="${x-4.35}" y="${y-2.3}" font-size="3" font-weight="800" fill="#173447" paint-order="stroke" stroke="#fff" stroke-opacity=".7" stroke-width=".35">${n}</text>`}).join('')}</g>`;$('#svg').innerHTML=s}
const dice=$('#dice');dice.innerHTML='<i></i>'.repeat(9);const face=v=>[...dice.children].forEach((e,k)=>e.classList.toggle('on',PIPS[v-1].includes(k)));
const toks=['host','guest'].map((r,i)=>{const d=document.createElement('div');d.className='tok';d.dataset.role=r;d.style.background=`var(--p${i+1})`;d.textContent=i+1;playfield.append(d);return d});
function placeRole(role,pos=cfg.positions?.[role]||0){const i=role==='host'?0:1,[x,y]=pos?ctr(pos):[5+i*8,108],same=pos&&cfg.positions?.host===cfg.positions?.guest,sh=same?(i?2:-2):0,t=toks[i];t.style.left=x+sh+'%';t.style.top=y+'%'}
function placeAll(){placeRole('host');placeRole('guest')}
function unlock(){if(!cfg.soundEnabled)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch{}}
function tone(f,at,dur,type,vol,f2){if(!cfg.soundEnabled)return;try{unlock();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+at;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur)}catch{}}
function playVoiceAfter(audio,delay){setTimeout(()=>{if(!cfg.soundEnabled)return;try{audio.currentTime=0;const playback=audio.play();playback?.catch(()=>{})}catch{}},delay)}
const sfx={ladder:()=>{[523,659,784,1047].forEach((f,k)=>tone(f,k*.09,.2,'triangle',.22));playVoiceAfter(ladderVoice,520)},snake:()=>{tone(700,0,.75,'triangle',.22,100);tone(350,0,.75,'sawtooth',.05,50);playVoiceAfter(snakeVoice,780)},win:()=>[[523,0,.12],[659,.12,.12],[784,.24,.12],[1047,.36,.25],[784,.66,.1],[1047,.78,.1],[1319,.9,.6]].forEach(([f,a,d])=>tone(f,a,d,'square',.11)),bad:()=>{tone(220,0,.3,'sawtooth',.18,110);try{navigator.vibrate?.(120)}catch{}}};
function startSpin(){if(spinTimer)return;dice.classList.add('roll');spinTimer=setInterval(()=>{cur=cur%6+1;face(cur)},100)}
function stopSpin(show=cfg.dice){clearInterval(spinTimer);spinTimer=0;dice.classList.remove('roll');if(Number.isInteger(show))face(show)}
function flash(n){const[x,y]=ctr(n),r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',x-5);r.setAttribute('y',y-5);r.setAttribute('width',10);r.setAttribute('height',10);r.setAttribute('fill','#e63946');r.setAttribute('class','fl');$('#svg').append(r);setTimeout(()=>r.remove(),500)}
function setEvent(text,ms=1700){eventText=text;clearTimeout(eventTimer);eventTimer=setTimeout(()=>{eventText='';renderStatus()},ms);renderStatus()}
function checkEvent(){const ev=cfg.lastEvent,id=Number(ev?.id)||0;if(!initialized){seenEventId=id;return}if(id<=seenEventId)return;seenEventId=id;if(ev.type==='overshoot')setEvent(`😅 ${nameOf(ev.player)} محتاج رقم بالظبط عشان يوصل ١٠٠`);if(ev.type==='six')setEvent(`🎉 ${nameOf(ev.player)} جاب ٦ — دور إضافي!`);if(ev.type==='win'){setEvent(`🏆 ${nameOf(ev.player)} كسب!`,3500);sfx.win()}}
function renderStatus(){const s=$('#status');if(eventText){s.textContent=eventText;return}if(cfg.winner){s.textContent=`🎉 ${nameOf(cfg.winner)} كسب!`;return}if(animating||cfg.phase==='moving'){s.textContent=`👣 ${nameOf(cfg.turn)} بيتحرك…`;return}if(cfg.phase==='spinning'){s.textContent=myTurn()?'النرد بيلف! اضغط عليه عشان يقف ✋':`${nameOf(cfg.turn)} بيرمي النرد 🎲`;return}if(cfg.phase==='choose'){s.textContent=myTurn()?`طلع ${ar(cfg.dice)}! عدّ ${ar(cfg.dice)} مربعات واضغط المربع الصح 👆`:`${nameOf(cfg.turn)} طلع له ${ar(cfg.dice)} وبيعد الخطوات…`;return}s.textContent=myTurn()?'دورك! ارمي النرد 🎲':`دور ${nameOf(cfg.turn)} — استنى دورك 👀`}
function renderControls(){const ready=cfg.phase==='ready',spinning=cfg.phase==='spinning',active=myTurn()&&!animating;dice.style.pointerEvents=active&&(ready||spinning)?'auto':'none';$('#new').disabled=cfg.role!=='host';$('#city').disabled=cfg.role!=='host';$('#w-host').textContent=ar(Number(cfg.snakeWins?.host)||0);$('#w-guest').textContent=ar(Number(cfg.snakeWins?.guest)||0)}
function render(){renderControls();renderStatus();if(cfg.phase==='spinning'){startSpin();}else{stopSpin(cfg.dice||1);}}
/* صوت النقر لكل خطوة */
function stepSfx(){
  if(!cfg.soundEnabled)return;
  try{unlock();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='square';o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(560,t+.08);g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.1);}catch{}
}
function finishMove(move){parent.postMessage({type:'roqaya-snakes-move-done',moveId:Number(move?.id)||0,roundId:Number(move?.roundId??cfg.roundId)||0},location.origin)}
async function animateMove(move){if(!move||Number(move.id)<=seenMoveId)return;seenMoveId=Number(move.id);animating=true;render();const role=move.player,start=Number(move.from)||0,target=Number(move.target)||start;placeRole(role,start);for(let p=start+1;p<=target;p++){placeRole(role,p);stepSfx();await wait(240)}if(move.jumpType){setEvent(move.jumpType==='ladder'?'🪜 سلم! طلعت فوق':'🐍 ثعبان! نزلت تحت',1100);await wait(320);toks[role==='host'?0:1].classList.add('jump');move.jumpType==='ladder'?sfx.ladder():sfx.snake();placeRole(role,move.destination);await wait(700);toks[role==='host'?0:1].classList.remove('jump')}animating=false;placeAll();render();finishMove(move)}
function recoverMove(move){if(!move)return;animating=false;seenMoveId=Math.max(seenMoveId,Number(move.id)||0);toks[move.player==='host'?0:1].classList.remove('jump');placeRole(move.player,Number(move.destination)||Number(move.target)||0);render();finishMove(move)}
function applyConfig(next){const first=!initialized,oldSeed=cfg.boardSeed;cfg={...cfg,...next};const roundId=Number(cfg.roundId)||0,roundChanged=first||seenMoveRoundId!==roundId;if(first)initialized=true;if(roundChanged){seenMoveRoundId=roundId;const moveId=Number(cfg.move?.id)||0;seenMoveId=cfg.phase==='moving'&&cfg.move?Math.max(0,moveId-1):moveId;seenEventId=Number(cfg.lastEvent?.id)||0;placeAll()}else checkEvent();if(first||Number(cfg.boardSeed)!==Number(oldSeed)){hasBoardConfig=true;draw()}if(cfg.phase==='moving'&&cfg.move&&Number(cfg.move.id)>seenMoveId)animateMove(cfg.move).catch(()=>recoverMove(cfg.move));else if(!animating)placeAll();render()}
function pressRoll(){if(animating||!myTurn())return;unlock();if(cfg.phase==='ready'){parent.postMessage({type:'roqaya-snakes-roll-start',roundId:cfg.roundId},location.origin);return} if(cfg.phase==='spinning'){parent.postMessage({type:'roqaya-snakes-roll-stop',roundId:cfg.roundId},location.origin);return}}
playfield.onclick=e=>{if(animating||!myTurn()||cfg.phase!=='choose')return;const b=playfield.getBoundingClientRect(),c=Math.floor((e.clientX-b.left)/b.width*10),w=9-Math.floor((e.clientY-b.top)/b.height*10);if(c<0||c>9||w<0||w>9)return;const n=w*10+(w%2?9-c:c)+1,target=(Number(cfg.positions?.[cfg.role])||0)+Number(cfg.dice||0);if(n!==target){sfx.bad();flash(n);setEvent(`❌ غلط! عدّ ${ar(cfg.dice)} مربعات وجرّب تاني`,1400);return}setEvent('تمام! 👍',700);parent.postMessage({type:'roqaya-snakes-square',square:n,roundId:cfg.roundId},location.origin)};
dice.onclick=pressRoll;$('#new').onclick=()=>parent.postMessage({type:'roqaya-snakes-new'},location.origin);$('#city').onclick=()=>parent.postMessage({type:'roqaya-snakes-city'},location.origin);
addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='roqaya-snakes-config')applyConfig(e.data.config)});
draw();face(1);placeAll();render();parent.postMessage({type:'roqaya-snakes-ready'},location.origin);
addEventListener('resize',draw);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لاقوا الاختلافات سوا</title>
<style>
:root{--bg:#e6f0ff;--ink:#1e1b4b;--acc:#6d4ce0;--gold:#f0b429}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{display:flex;flex-direction:column;min-height:100svh;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;user-select:none;overflow-x:hidden}
main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;width:100%;align-items:center;gap:6px;padding:6px 8px 2px}
h1{margin:0;font-size:1.15rem;text-align:center}
.hide{display:none!important}

/* شريط اللاعبين */
#hud{width:min(100%,660px);display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pl{display:flex;align-items:center;gap:6px;min-width:0;padding:3px 8px;border:3px solid var(--c);border-radius:12px;background:#fff;font-weight:800;font-size:.8rem;transition:box-shadow .2s}
.pl b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.68rem}
.pl span{margin-inline-start:auto;white-space:nowrap;font-size:.9rem}
.pl.lead{box-shadow:0 0 0 3px #ffd76a inset}
.info{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:.76rem;min-height:1.2em}
.you{color:var(--acc)}

/* الصور */
#pics{--w:320px;display:flex;direction:ltr;gap:8px;align-items:center;justify-content:center;flex:1 1 auto;min-height:0}
#pics.stack{flex-direction:column}
#pics.side{flex-direction:row}
.pic{position:relative;width:var(--w);height:calc(var(--w)*.7467);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 0 0 3px #fff,0 4px 0 3px #c9d6ef;touch-action:manipulation;cursor:crosshair}
.pic img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.pic.locked{cursor:default}
.ov{position:absolute;inset:0;pointer-events:none}
.ring{position:absolute;width:calc(var(--w)*var(--k));height:calc(var(--w)*var(--k)*.7467);transform:translate(-50%,-50%);border:4px solid var(--c);border-radius:50%;box-shadow:0 0 0 2px #fff,inset 0 0 0 2px #fff;animation:pop .35s ease-out;display:flex;align-items:center;justify-content:center}
.ring::after{content:attr(data-n);font-weight:900;font-size:.6rem;color:#fff;background:var(--c);width:1.05rem;height:1.05rem;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(2);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.miss{position:absolute;transform:translate(-50%,-50%);font-size:28px;font-weight:800;line-height:1;color:#ef4444;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff;animation:fade .7s forwards;pointer-events:none}
@keyframes fade{to{opacity:0;transform:translate(-50%,-90%)}}
/* «إنت كسبت النقطة» */
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:.72rem;color:#fff;background:var(--c);padding:2px 8px;border-radius:99px;box-shadow:0 2px 6px rgba(0,0,0,.3);animation:up .9s forwards;pointer-events:none;white-space:nowrap}
@keyframes up{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}

#won{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;direction:rtl;text-align:center;background:rgba(255,255,255,.94)}
#won.show{display:flex}
#msg{margin:0;font-weight:800;line-height:1.6;font-size:.9rem}

/* أزرار */
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn{padding:8px 14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-size:.78rem;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #4a30b0}
.btn.alt{background:#fff;color:var(--ink);border:2px solid #c7d2fe;box-shadow:0 3px 0 #c9d6ef}
.btn:disabled{opacity:.45;cursor:default}
#toast{position:fixed;left:50%;bottom:80px;z-index:99;max-width:90%;padding:8px 14px;border-radius:99px;background:var(--ink);color:#fff;font-weight:800;font-size:.76rem;opacity:0;transform:translate(-50%,10px);transition:opacity .25s,transform .25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.ring,.miss,.pop{animation:none}}
</style>
<link rel="stylesheet" href="game-shell.css?v=2">
</head>
<body>
<main>
  <h1>🔍 لاقوا الاختلافات سوا</h1>

  <div id="hud"></div>
  <div class="info"><span id="inf"></span><span id="who"></span></div>

  <div id="pics" class="stack">
    <div class="pic" id="pa"><div class="ov" id="ova"></div></div>
    <div class="pic" id="pb"><div class="ov" id="ovb"></div>
      <div id="won" aria-live="polite"><p id="msg"></p></div>
    </div>
  </div>

  <div class="row footer-bar">
    <button id="next" class="btn alt" type="button">الصورة اللي بعدها ◀</button>
    <button id="mute" class="btn alt" type="button" aria-label="الصوت">🔊</button>
    <button id="city" class="btn alt" type="button">🎡 المدينة</button>
  </div>
</main>
<div id="toast" role="status"></div>

<script>
/* ===== M12 «لاقوا الاختلافات سوا» — نسخة مبسّطة ومضمونة
 * - الصور جاهزة (أصلية + معدّلة) → مفيش توليد، مفيش صفحة بيضاء.
 * - الأزواج 10، وكل زوج له إحداثيات اختلافاته من _spots.json مدمجة هنا.
 * - الاتنان يشوفوا نفس الصورتين، ويدوّروا في نفس الوقت، واللي يلاقي ياخد نقطة.
 * - المزامنة عبر m4-26-spot-sync.js (نفس غرفة Firebase). لا PeerJS.
 * - «بابا بس» هو اللي يغيّر الصورة/المستوى (§4).
 */
const $ = s => document.querySelector(s);
const pa = $('#pa'), pb = $('#pb'), ova = $('#ova'), ovb = $('#ovb'), won = $('#won'), pics = $('#pics');
const COL = ['#2563eb', '#db2777'];
const E = '٠١٢٣٤٥٦٧٨٩', D = n => String(n).replace(/\d/g, d => E[d]);
const AR = 0.7467;

/* إحداثيات الاختلافات تأتي من spots-data.js */
</script>
<script src="spots-data.js?v=2"></script>
<script>
/* ==== حالة اللعبة ==== */
let cfg = { role:'', childName:'رقية', otherName:'', roundId:0, round:null, scores:{host:0,guest:0}, champion:null, winScore:5 };
let S = null, ready = false, readySent = false, over = false;
let found = [], scores = [0,0], secs = 0, timer = 0, soundOn = true, ac = null, toastT = 0;
let armed = 0, winKey = '', lastTurn = '';

const isHost = () => cfg.role === 'host';
const me = () => (cfg.role === 'host' ? 1 : 2);
const otherName = () => cfg.otherName || 'اللاعب التاني';
const myName = () => cfg.childName || 'رقية';
function nameOf(p){ return p===1 ? (isHost()? myName() : otherName()) : (isHost()? otherName() : myName()); }
const foundCount = () => found.filter(Boolean).length;
const fmt = s => Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
const post = (type, extra) => { try { parent.postMessage({ type, roundId: cfg.roundId, ...extra }, location.origin); } catch {} };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
function esc(s){ return String(s).replace(/[&<>"']/g, ch => '&#'+ch.charCodeAt(0)+';'); }

/* ==== الصوت: Web Audio فقط (ممنوع speechSynthesis في اللعبة دي) ==== */
function acOn(){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch{} }
document.addEventListener('pointerdown', acOn);
function tone(f, at, d, type, v, f2){
  if(!soundOn || !ac) return;
  try{
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+at;
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001, t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d);
  }catch{}
}
const sfx = {
  mine:  () => { tone(784,0,.09,'triangle',.20); tone(1047,.08,.14,'triangle',.20); },
  other: () => { tone(587,0,.08,'sine',.13); tone(494,.08,.12,'sine',.13); },   // الخصم لقى — نغمة هادية مش محبطة
  bad:   () => tone(220,0,.16,'sine',.09,150),                                   // غلط: لطيفة غير مخيفة (§6)
  win:   () => [523,659,784,1047,784,1047,1319].forEach((f,k)=>tone(f,k*.12,.22,'triangle',.11))
};
$('#mute').onclick = () => { soundOn=!soundOn; $('#mute').textContent = soundOn?'🔊':'🔇'; };

/* ==== التخطيط ==== */
function layout(){
  if(!pics.offsetHeight) return;
  const land = innerWidth > innerHeight * 1.15;
  pics.className = land ? 'side' : 'stack';
  const chrome = 150;
  const avail = innerHeight - chrome;
  const maxW = land ? Math.min((innerWidth-40)/2, 640) : Math.min(innerWidth-26, 560);
  const w = Math.floor(Math.max(land?200:230, Math.min(maxW, avail/(land?AR:2*AR+.04))));
  pics.style.setProperty('--w', w+'px');
}
addEventListener('resize', layout);

/* ==== الشاشة ==== */
function hud(){
  $('#hud').innerHTML = [1,2].map(p => {
    const lead = scores[p-1] > scores[2-p] ? ' lead' : '';
    const tag = p===me() ? ' <span class="you">(إنت)</span>' : '';
    return `<div class="pl${lead}" style="--c:${COL[p-1]}"><b>${esc(nameOf(p))}${tag}</b><span>⭐ ${D(scores[p-1])}</span></div>`;
  }).join('');
  const sp = S ? S.spots : [];
  $('#inf').textContent = S ? `الصورة ${D(S.lvl+1)}/${D(10)} • الاختلافات ${D(foundCount())}/${D(sp.length)}` : '';
  $('#who').textContent = S ? `اللي يلاقي ياخد نقطة • أول ${D(cfg.winScore||5)} نقط يكسب` : '';
}
function ring(i, p, who){
  const s = S.spots[i];
  [ova, ovb].forEach(ov => {
    const e = document.createElement('div');
    e.className = 'ring'; e.dataset.i = i;
    e.style.cssText = `left:${s[0]*100}%;top:${s[1]*100}%;--k:${Math.max(s[2],.055)*1.5};--c:${COL[p-1]}`;
    e.dataset.n = D(i+1);
    ov.append(e);
  });
}
function popText(i, p, txt){
  const s = S.spots[i];
  [ova, ovb].forEach(ov => {
    const e = document.createElement('div');
    e.className = 'pop'; e.textContent = txt;
    e.style.cssText = `left:${s[0]*100}%;top:${s[1]*100}%;--c:${COL[p-1]}`;
    ov.append(e);
    setTimeout(()=>e.remove(), 950);
  });
}
function resetOverlays(){ ova.replaceChildren(); ovb.replaceChildren(); }

/* ==== النقر ==== */
const hitR = s => Math.max(s[2]*1.1, .05);
function tap(e, pic){
  if(!S || !ready || over) return;
  const r = pic.getBoundingClientRect();
  const x = (e.clientX - r.left)/r.width;
  const y = (e.clientY - r.top)/r.height;
  let best=-1, bd=9, already=false;
  S.spots.forEach((s,i) => {
    const dist = Math.hypot(s[0]-x, s[1]-y);
    if(dist > hitR(s)) return;
    if(found[i]) already = true;
    else if(dist < bd){ bd = dist; best = i; }
  });
  if(best >= 0){
    // رد فعل فوري محلي (نت ضعيف) + إرسال لـFirebase
    const p = me();
    found[best] = p; scores[p-1]++;
    ring(best, p); popText(best, p, 'نقطة لك! 🎉');
    sfx.mine(); hud();
    post('roqaya-spot-find', { index: best });
    checkDone();
  } else if(!already){
    sfx.bad();
    const ov = pic === pa ? ova : ovb;
    const m = document.createElement('div');
    m.className='miss'; m.textContent='✖';
    m.style.cssText = `left:${e.clientX-r.left}px;top:${e.clientY-r.top}px`;
    ov.append(m); setTimeout(()=>m.remove(), 720);
  }
}
pa.addEventListener('click', e => tap(e, pa));
pb.addEventListener('click', e => tap(e, pb));

function checkDone(){
  if(!S || over) return;
  // الفوز بالنقاط (أول من يوصل للهدف) أو بخلاص كل الاختلافات
  const target = Number(cfg.winScore) || 5;
  const leader = scores[0] >= target ? 1 : scores[1] >= target ? 2 : 0;
  const allDone = found.every(Boolean);
  if(!leader && !allDone) return;
  over = true; clearInterval(timer);
  const winner = leader || (scores[0]>scores[1] ? 1 : scores[1]>scores[0] ? 2 : 0);
  $('#msg').innerHTML = winner
    ? `🎉 ${esc(nameOf(winner))} كسب!<br>النتيجة ${D(scores[0])} - ${D(scores[1])}`
    : `🤝 تعادل! ${D(scores[0])} - ${D(scores[1])}`;
  won.classList.add('show');
  if(winner === me()) sfx.win();
  hud();
}

/* ==== مزامنة اختلاف الخصم ==== */
function onFound(i, p){
  if(!S || i<0 || i>=S.spots.length) return;
  if(found[i] === p) return;
  if(found[i]){
    // الاتنين ضغطوا في نفس اللحظة → النقطة للمضيف (ثابت على الجهازين)
    if(p===1 && me()===2){
      scores[found[i]-1]--; scores[0]++; found[i]=1;
      [ova,ovb].forEach(ov => Array.from(ov.querySelectorAll('.ring')).filter(e=>e.dataset.i==i).forEach(e=>e.style.setProperty('--c', COL[0])));
    }
  } else {
    found[i] = p; scores[p-1]++;
    ring(i, p);
    if(p === me()){ popText(i,p,'نقطة لك! 🎉'); sfx.mine(); }
    else { popText(i,p, nameOf(p)+' لقى!'); sfx.other(); }
  }
  hud(); checkDone();
}

/* ==== الجولة ==== */
function startRound(rd){
  const spots = (typeof SPOTS !== 'undefined' && SPOTS[rd.lvl+1]) || [];
  S = { n: rd.n, lvl: rd.lvl, spots };
  found = Array(spots.length).fill(0);
  scores = [0,0]; over = false; ready = false; readySent = false;
  winKey = ''; clearInterval(timer); clearTimeout(armed); armed = 0;
  resetOverlays(); won.classList.remove('show');
  $('#next').textContent = 'الصورة اللي بعدها ◀';
  secs = 0; $('#inf').textContent = '';
  if(!spots.length){ toast('مش لاقيين بيانات الصورة 😕'); return; }
  timer = setInterval(()=>{ secs++; }, 1000);
  const loadOk = () => {
    if(!S || S.n !== rd.n) return;
    ready = true; hud(); layout();
    if(!readySent){ readySent = true; post('roqaya-spot-ready'); }
  };
  // تحميل الصورتين (محلية، سريعة)
  const urlA = `assets/spot2/p${String(rd.lvl+1).padStart(2,'0')}_a.jpg`;
  const urlB = `assets/spot2/p${String(rd.lvl+1).padStart(2,'0')}_b.jpg`;
  pa.querySelector('img')?.remove();
  pb.querySelector('img')?.remove();
  const ia = new Image(), ib = new Image();
  let loaded = 0;
  const done = () => { if(++loaded === 2) loadOk(); };
  ia.onload = () => { pa.insertAdjacentElement('afterbegin', ia); done(); };
  ib.onload = () => { pb.insertAdjacentElement('afterbegin', ib); done(); };
  ia.onerror = ib.onerror = () => { toast('مش عارفين نحمّل الصورة 😕'); done(); };
  ia.src = urlA; ib.src = urlB;
}

/* ==== بابا فقط: الصورة اللي بعدها ==== */
$('#next').onclick = () => {
  if(!isHost()){ toast('بابا هو اللي يجيب الصورة الجديدة 🙂'); return; }
  if(!S || over) return;
  if(foundCount() > 0 && !armed && foundCount() < S.spots.length){
    $('#next').textContent = 'متأكد؟ اضغط تاني';
    armed = setTimeout(()=>{ armed=0; $('#next').textContent='الصورة اللي بعدها ◀'; }, 3000);
    return;
  }
  clearTimeout(armed); armed = 0; $('#next').textContent = 'الصورة اللي بعدها ◀';
  const nextLvl = (S.lvl + 1) % 10;
  post('roqaya-spot-request', { lvl: nextLvl });
};
$('#city').onclick = () => {
  if(!isHost()){ toast('بابا بس اللي يرجع للمدينة 🙂'); return; }
  post('roqaya-spot-city');
};

/* ==== رسائل الوحدة الأم ==== */
addEventListener('message', e => {
  if(e.origin !== location.origin) return;
  const d = e.data || {};
  if(d.type === 'roqaya-spot-config'){
    const c = d.config || {};
    cfg = { ...cfg, ...c };
    if(cfg.round && (!S || cfg.round.n !== S.n)) startRound(cfg.round);
    else {
      // نفس الجولة: اعتبر حالة Firebase هي المرجع (النقاط + اللي اتلقى)
      if(cfg.round){
        const n = S.spots.length;
        const f = Array.isArray(cfg.round.found) ? cfg.round.found : [];
        found = Array.from({length:n}, (_,i) => Number(f[i]) || 0);
        ova.replaceChildren(); ovb.replaceChildren();
        found.forEach((p,i) => { if(p) ring(i,p); });
      }
      if(cfg.scores) scores = [Number(cfg.scores.host)||0, Number(cfg.scores.guest)||0];
      hud(); layout();
    }
    if(cfg.champion){
      over = true;
      document.querySelectorAll('.pic').forEach(p=>p.classList.add('locked'));
      // أظهر النتيجة الرسمية لو لسه ما ظهرتش عندي
      if(!won.classList.contains('show')){
        const w = cfg.champion === 'host' ? 1 : 2;
        $('#msg').innerHTML = `🎉 ${esc(nameOf(w))} كسب!<br>النتيجة ${D(scores[0])} - ${D(scores[1])}`;
        won.classList.add('show'); hud();
      }
    }
    else document.querySelectorAll('.pic').forEach(p=>p.classList.remove('locked'));
    return;
  }
  if(d.type === 'roqaya-spot-new' && d.round){ startRound(d.round); return; }
  if(d.type === 'roqaya-spot-found'){ onFound(Number(d.index), Number(d.player)); return; }
  if(d.type === 'roqaya-spot-reset'){ S=null; ready=false; clearInterval(timer); resetOverlays(); pa.querySelector('img')?.remove(); pb.querySelector('img')?.remove(); return; }
});
addEventListener('pointerdown', acOn, { once:true });

/* ==== الإقلاع ==== */
function init(){
  hud(); layout();
  post('roqaya-spot-ready');
  setTimeout(()=>post('roqaya-spot-ready'), 700);
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>

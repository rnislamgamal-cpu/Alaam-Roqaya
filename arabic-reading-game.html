<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اقرأ</title>
<style>
:root{--bg:#eaf4ff;--ink:#1b2a49;--blue:#2f6bff;--ok:#22a06b;--bad:#e5484d;--line:#d6e2f3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{min-height:100dvh;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;user-select:none}
main{max-width:640px;margin:auto;padding:6px 8px 90px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:6px}
.player{display:flex;align-items:center;gap:5px;padding:6px 8px;border:2px solid transparent;border-radius:12px;background:#fff;font-weight:850}
.player.me{border-color:#111}.player b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.7rem}.player span{margin-inline-start:auto;font-size:.72rem}
.host{color:#2f6fed}.guest{color:#f08c00}
#turnbar{width:100%;text-align:center;font-weight:900;font-size:.82rem;margin:4px 0 6px;min-height:1.2em}
.top{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.dots{flex:1;display:flex;gap:3px}.dots i{flex:1;height:7px;border-radius:4px;background:var(--line)}.dots i.done{background:var(--blue)}.dots i.cur{background:#ffb703}
.ibtn{border:0;background:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 0 var(--line)}.ibtn img{width:20px;height:20px}
.sent{background:#fff;border-radius:21px;padding:16px 12px 12px;text-align:center;margin-bottom:11px;box-shadow:0 2px 0 var(--line)}
.sent p{margin:0 0 9px;font-family:"Noto Naskh Arabic","Amiri",serif;font-weight:800;font-size:clamp(1.5rem,6.6vw,2.3rem);line-height:1.9}
.say{font:inherit;font-weight:800;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;cursor:pointer;color:var(--blue);display:inline-flex;align-items:center;gap:6px;font-size:.72rem}.say img{width:18px;height:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px}
.opt{position:relative;background:#fff;border:3px solid var(--line);border-radius:17px;padding:9px 5px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font:inherit;color:inherit;min-height:126px;transition:transform .12s}
.opt:active:not(:disabled){transform:scale(.97)}.opt.ok{border-color:var(--ok);background:#e5f7ee}.opt.bad{border-color:var(--bad);background:#fdeaea}.opt:disabled{cursor:default}
.opt.ok:after,.opt.bad:after{position:absolute;top:4px;inset-inline-end:5px;width:25px;height:25px;display:grid;place-items:center;border-radius:50%;background:#fff;font-weight:1000}.opt.ok:after{content:'✓';color:var(--ok)}.opt.bad:after{content:'✕';color:var(--bad)}
.msg{text-align:center;font-weight:900;font-size:.9rem;min-height:1.8em;margin-top:10px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.wait{background:#fff;border-radius:16px;padding:18px;text-align:center;font-weight:800;line-height:1.7}
.level-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.level-btn{min-height:82px;border:2px solid #cad9f2;border-radius:16px;background:#fff;color:#263c70;font:inherit;font-size:.95rem;font-weight:900;box-shadow:0 3px 0 #d5e1f3}.level-btn:active{transform:scale(.97)}
.end{text-align:center;padding-top:14px}
.end img.big{width:86px;height:86px}.end h2{font-size:1.3rem;margin:8px 0 4px}
.footer-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:60;width:100%;max-width:640px;display:flex;flex-wrap:nowrap;justify-content:center;align-items:center;gap:6px;padding:6px 8px max(8px,env(safe-area-inset-bottom));background:rgba(234,244,255,.98);border-top:1px solid rgba(47,107,255,.18)}
.footer-bar button{min-height:38px;padding:6px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:.76rem;font-weight:800;cursor:pointer}
.footer-bar button.primary{background:var(--blue);color:#fff;border-color:#1f57d6}
.footer-bar button:disabled{opacity:.45;cursor:default}
.credit{position:fixed;bottom:54px;left:50%;transform:translateX(-50%);font-size:.5rem;opacity:.35;text-align:center}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(max-width:420px){main{padding:6px 6px 94px}.opts{gap:6px;grid-template-columns:repeat(2,1fr)}.opt{min-height:114px}.opt img{width:min(26vw,76px);height:min(26vw,76px)}.footer-bar button{font-size:.72rem;padding:6px 9px}}
</style>
</head>
<body>
<main>
  <div class="duo">
    <div id="hostBox" class="player host"><b>بابا</b><span>⭐ ٠</span></div>
    <div id="guestBox" class="player guest"><b>رقية</b><span>⭐ ٠</span></div>
  </div>
  <div id="turnbar">في انتظار الاختيار...</div>
  <div id="game"></div>
</main>
<div class="footer-bar">
  <button id="city" type="button">🎡 المدينة</button>
  <button id="next" class="primary" type="button">السؤال التالي ◀</button>
  <button id="new" class="primary" type="button" style="display:none">جولة جديدة 🔄</button>
</div>
<div class="credit">Graphics: Twemoji © Twitter, CC-BY 4.0</div>

<script>
const $ = s => document.querySelector(s);
const IMG = c => 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/' + c + '.svg';
const E = '٠١٢٣٤٥٦٧٨٩';
const ar = v => String(v).replace(/[0-9]/g, d => E[d.charCodeAt(0)-48]);

const IM = {
  cat:["1f431","قِطَّة"],dog:["1f436","كَلْب"],lion:["1f981","أَسَد"],elephant:["1f418","فِيل"],horse:["1f434","حِصَان"],cow:["1f42e","بَقَرَة"],chicken:["1f414","دَجَاجَة"],duck:["1f986","بَطَّة"],rabbit:["1f430","أَرْنَب"],monkey:["1f435","قِرْد"],fish:["1f41f","سَمَكَة"],bird:["1f426","عُصْفُور"],
  apple:["1f34e","تُفَّاحَة"],banana:["1f34c","مَوْزَة"],grapes:["1f347","عِنَب"],orange:["1f34a","بُرْتُقَالَة"],carrot:["1f955","جَزَرَة"],bread:["1f35e","خُبْز"],milk:["1f95b","لَبَن"],egg:["1f95a","بَيْضَة"],
  car:["1f697","سَيَّارَة"],bus:["1f68c","حَافِلَة"],plane:["2708","طَائِرَة"],house:["1f3e0","بَيْت"],book:["1f4d5","كِتَاب"],ball:["26bd","كُرَة"],clock:["23f0","سَاعَة"],phone:["1f4f1","هَاتِف"],key:["1f511","مِفْتَاح"],bag:["1f392","حَقِيبَة"],
  sun:["2600","شَمْس"],moon:["1f319","قَمَر"],star:["2b50","نَجْمَة"],tree:["1f333","شَجَرَة"],rose:["1f339","وَرْدَة"],cloud:["2601","سَحَابَة"]
};

const L2 = [
  ["lion","الْأَسَدُ مَلِكُ الْغَابَةِ"],["elephant","الْفِيلُ حَيَوَانٌ كَبِيرٌ"],["fish","تَسْبَحُ السَّمَكَةُ فِي الْمَاءِ"],
  ["cow","الْبَقَرَةُ تَأْكُلُ الْعُشْبَ",["milk"]],["chicken","تَصِيحُ الدَّجَاجَةُ فِي الصَّبَاحِ",["egg"]],["horse","الْحِصَانُ يَجْرِي بِسُرْعَةٍ"],
  ["duck","تَسْبَحُ الْبَطَّةُ فِي الْبُحَيْرَةِ",["fish"]],["rabbit","الْأَرْنَبُ يَقْفِزُ فِي الْحَدِيقَةِ"],["cat","تَنَامُ الْقِطَّةُ بِهُدُوءٍ"],
  ["dog","يَنْبَحُ الْكَلْبُ بِصَوْتٍ عَالٍ"],["apple","أَكَلَ سَامِي تُفَّاحَةً حَمْرَاءَ"],["banana","الْمَوْزَةُ فَاكِهَةٌ صَفْرَاءُ"],
  ["grapes","أُحِبُّ الْعِنَبَ الْحُلْوَ"],["car","رَكِبَ أَبِي السَّيَّارَةَ",["bus"]],["plane","تَطِيرُ الطَّائِرَةُ فِي السَّمَاءِ",["bird","cloud"]],
  ["house","نَسْكُنُ فِي بَيْتٍ جَمِيلٍ"],["book","قَرَأَتْ لَيْلَى الْكِتَابَ"],["ball","يَلْعَبُ أَحْمَدُ بِالْكُرَةِ"],
  ["sun","تُشْرِقُ الشَّمْسُ فِي الصَّبَاحِ",["moon","star"]],["moon","يَظْهَرُ الْقَمَرُ فِي اللَّيْلِ",["star"]],["tree","الشَّجَرَةُ طَوِيلَةٌ وَخَضْرَاءُ"],
  ["rose","رَسَمَتْ سَلْمَى وَرْدَةً جَمِيلَةً"],["clock","السَّاعَةُ تُشِيرُ إِلَى الْوَاحِدَةِ"]
];

const L3 = [
  ["elephant","حَيَوَانٌ ضَخْمٌ لَهُ خُرْطُومٌ طَوِيلٌ وَأُذُنَانِ كَبِيرَتَانِ"],["banana","فَاكِهَةٌ صَفْرَاءُ طَوِيلَةٌ نُقَشِّرُهَا قَبْلَ أَكْلِهَا",["orange"]],
  ["fish","يَعِيشُ فِي الْمَاءِ وَلَهُ زَعَانِفُ",["duck"]],["clock","نَنْظُرُ إِلَيْهَا لِنَعْرِفَ الْوَقْتَ",["phone"]],
  ["bus","نَرْكَبُهَا مَعَ أَصْدِقَائِنَا لِنَذْهَبَ إِلَى الْمَدْرَسَةِ",["car","plane"]],["moon","يُضِيءُ السَّمَاءَ فِي اللَّيْلِ وَيَتَغَيَّرُ شَكْلُهُ",["star"]],
  ["star","تَلْمَعُ فِي السَّمَاءِ لَيْلًا وَهِيَ صَغِيرَةٌ جِدًّا",["moon"]],["cow","حَيَوَانٌ فِي الْمَزْرَعَةِ نَشْرَبُ لَبَنَهُ",["milk","chicken"]],
  ["chicken","تَعِيشُ فِي الْمَزْرَعَةِ وَتَضَعُ الْبَيْضَ",["egg","duck","cow"]],["sun","تُعْطِينَا الضَّوْءَ وَالدِّفْءَ فِي النَّهَارِ",["moon","star"]],
  ["book","نَقْرَؤُهُ لِنَتَعَلَّمَ وَنَسْتَمْتِعَ بِالْقِصَصِ",["phone"]],["key","نَفْتَحُ بِهِ بَابَ الْبَيْتِ",["house"]],
  ["bag","يَحْمِلُهَا التِّلْمِيذُ عَلَى ظَهْرِهِ وَفِيهَا كُتُبُهُ",["book"]],["rose","زَهْرَةٌ جَمِيلَةٌ رَائِحَتُهَا طَيِّبَةٌ وَلَهَا أَشْوَاكٌ",["tree"]],
  ["lion","حَيَوَانٌ قَوِيٌّ لَهُ شَعْرٌ كَثِيفٌ حَوْلَ رَأْسِهِ"],["carrot","خُضْرَةٌ بُرْتُقَالِيَّةٌ تُحِبُّهَا الْأَرَانِبُ",["rabbit","orange"]],
  ["bird","يُغَرِّدُ عَلَى الْأَغْصَانِ وَيَطِيرُ",["plane","duck","chicken"]],["egg","نَأْكُلُهَا فِي الْفُطُورِ وَتَخْرُجُ مِنْهَا الْكَتَاكِيتُ",["chicken"]]
];

const L1 = Object.keys(IM).map(k => [k, IM[k][1]]);
const BANK = {1:L1,2:L2,3:L3};

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s,n){let h=Math.imul(2166136261^s,16777619);h=Math.imul(h^n,16777619);h^=h>>>13;h=Math.imul(h,0x5bd1e995);return(h^(h>>>15))>>>0}
function shuffle(a,R){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(R()*(i+1));const tmp=x[i];x[i]=x[j];x[j]=tmp}return x}

function buildQuestions(seed,level,rounds){
  const R=rng(hash(seed,911));
  const take=(L,n)=>shuffle(L,R).slice(0,n).map(q=>({key:q[0],text:q[1],bad:q[2]||[]}));
  if(level==='mix'){const a=Math.round(rounds*.3),b=Math.round(rounds*.4);return take(L1,a).concat(take(L2,b)).concat(take(L3,rounds-a-b));}
  return take(BANK[level]||L1,rounds);
}
function options(q,seed,index){const R=rng(hash(seed,index+1203));const pool=Object.keys(IM).filter(k=>k!==q.key && !(q.bad||[]).includes(k));return shuffle([q.key].concat(shuffle(pool,R).slice(0,3)),R);}

let muted=false,ac=null;
function getAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function tone(f,t0,d,type,gain){if(muted)return;const a=getAudio();if(!a)return;const o=a.createOscillator(),v=a.createGain(),t=a.currentTime+t0;o.type=type||'sine';o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(0.001,t);v.gain.linearRampToValueAtTime(gain||0.16,t+0.02);v.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(v).connect(a.destination);o.start(t);o.stop(t+d+0.05)}
const SFX={ok:function(){[523,659,784,1047].forEach(function(f,i){tone(f,i*0.09,0.28,'triangle',0.16)})},no:function(){tone(196,0,0.26,'sawtooth',0.14)}};
function speak(t){if(muted||!('speechSynthesis' in window))return;try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=0.8;window.speechSynthesis.speak(u)}catch(e){}}

let cfg={role:'guest',childName:'رقية',roundId:0,seed:1,level:null,rounds:10,players:{host:{},guest:{}},winner:null};
let Q=[],turnIndex=1,totalTurns=10,answered=false,currentQKey=null,pending=false,pendingTimer=0;

function nameOf(r){return r==='host'?'بابا':(cfg.childName||'رقية')}
function paintPlayers(){const h=cfg.players&&cfg.players.host?cfg.players.host:{},g=cfg.players&&cfg.players.guest?cfg.players.guest:{};$('#hostBox').classList.toggle('me',cfg.role==='host');$('#guestBox').classList.toggle('me',cfg.role==='guest');$('#hostBox b').textContent='بابا';$('#guestBox b').textContent=cfg.childName||'رقية';$('#hostBox span').textContent='⭐ '+ar(h.stars||0);$('#guestBox span').textContent='⭐ '+ar(g.stars||0);}
function turnOwner(){return ((turnIndex||1)%2===1?'host':'guest');}

function show(){
  const i=Math.min(totalTurns,turnIndex)-1;
  $('#city').disabled=cfg.role!=='host';
  if(cfg.winner){
    $('#turnbar').textContent='انتهت الجولة';
    const winner=cfg.winner==='draw'?'تعادل جميل!':`الفائز ${nameOf(cfg.winner)}!`;
    $('#game').innerHTML='<div class="end"><img class="big" src="'+IMG('1f3c6')+'" alt=""><h2>'+winner+'</h2><p>بابا ⭐ '+ar(cfg.players?.host?.stars||0)+' — '+nameOf('guest')+' ⭐ '+ar(cfg.players?.guest?.stars||0)+'</p></div>';
    $('#next').disabled=true;
    $('#new').style.display=cfg.role==='host'?'inline-block':'none';
    return;
  }
  if(!cfg.level){
    $('#turnbar').textContent=cfg.role==='host'?'اختاروا مستوى القراءة':'في انتظار بابا يختار المستوى';
    $('#game').innerHTML=cfg.role==='host'?'<div class="wait">اختار مستوى الجولة</div><div class="level-grid"><button class="level-btn" data-level="1">١ • كلمات وصور</button><button class="level-btn" data-level="2">٢ • جمل قصيرة</button><button class="level-btn" data-level="3">٣ • أوصاف</button><button class="level-btn" data-level="mix">🎲 متنوع</button></div>':'<div class="wait">بابا هيختار مستوى القراءة، وبعدها هنشوف السؤال نفسه سوا 💜</div>';
    $('#next').disabled=true;
    $('#new').style.display='none';
    return;
  }
  if(Q.length===0 || i<0 || i>=Q.length){
    $('#turnbar').textContent='بانتظار السؤال التالي';
    $('#game').innerHTML='<div class="wait">'+(cfg.role==='host'?'اضغط "السؤال التالي" لعرض أول سؤال':'بانتظار بابا ليضغط "السؤال التالي"')+'</div>';
    $('#next').disabled=cfg.role!=='host';
    $('#new').style.display='none';
    return;
  }
  const q=Q[i];
  if(currentQKey!==q.key){currentQKey=q.key;pending=false;}
  const opts=options(q,cfg.seed,i);
  const myTurn=turnOwner()===cfg.role;
  const lock=cfg.answered||pending||!myTurn;
  $('#turnbar').textContent='السؤال '+ar(turnIndex)+' / '+ar(totalTurns)+' — دور '+nameOf(turnOwner())+(myTurn?' (أنت)':'');
  let optsHtml='';
  for(let j=0;j<opts.length;j++){
    const k=opts[j];
    const chosen=cfg.answered&&k===cfg.answerKey,good=cfg.answered&&k===q.key,bad=chosen&&cfg.correct===false;
    optsHtml+='<button class="opt '+(good?'ok':'')+' '+(bad?'bad':'')+'" data-k="'+k+'" '+(lock?'disabled':'')+'><img src="'+IMG(IM[k][0])+'" alt=""><span class="cap">'+(cfg.answered?IM[k][1]:'')+'</span></button>';
  }
  const status=cfg.answered?(cfg.correct?'إجابة صحيحة! ⭐':'إجابة غير صحيحة، نتعلم معًا 💜'):pending?'جارٍ تسجيل الإجابة…':myTurn?'اختار الإجابة الصحيحة':'انتظر دور '+nameOf(turnOwner());
  const statusClass=cfg.answered?(cfg.correct?'ok':'bad'):'';
  $('#game').innerHTML='<div class="top"><div class="dots">'+Q.map(function(_,j){return '<i class="'+(j<i?'done':j===i?'cur':'')+'"></i>'}).join('')+'</div><button class="ibtn" data-act="mute"><img src="'+IMG(muted?'1f507':'1f50a')+'" alt=""></button></div><div class="sent"><p>'+q.text+'</p>'+(('speechSynthesis' in window)?'<button class="say" data-act="say"><img src="'+IMG('1f50a')+'" alt="">اِسْتَمِعْ</button>':'')+'</div><div class="opts">'+optsHtml+'</div><div class="msg '+statusClass+'" id="msg">'+status+'</div>';
  $('#next').disabled=cfg.role!=='host'||!cfg.answered;
  $('#city').disabled=cfg.role!=='host';
  $('#new').style.display='none';
}

function choose(b){
  if(cfg.answered||pending||turnOwner()!==cfg.role)return;
  const i=Math.min(totalTurns,turnIndex)-1,q=Q[i];if(!q)return;
  const k=b.getAttribute('data-k');
  pending=true;show();clearTimeout(pendingTimer);pendingTimer=setTimeout(function(){pending=false;show();},5000);
  try{parent.postMessage({type:'roqaya-reading-answer',key:k,question:i,roundId:cfg.roundId},location.origin)}catch(e){pending=false;show()}
}

$('#game').onclick=function(e){
  var lv=e.target.closest('.level-btn');if(lv&&cfg.role==='host'){parent.postMessage({type:'roqaya-reading-level',level:lv.dataset.level,roundId:cfg.roundId},location.origin);return;}
  var o=e.target.closest('.opt'); if(o){choose(o);return;}
  var actEl=e.target.closest('[data-act]'); if(!actEl)return;
  var act=actEl.getAttribute('data-act');
  if(act==='say'){var ii=Math.min(totalTurns,turnIndex)-1,qq=Q[ii]; if(qq)speak(qq.text);}
  if(act==='mute'){muted=!muted; if(muted&&'speechSynthesis' in window){try{window.speechSynthesis.cancel();}catch(ex){}} show();}
};

$('#next').onclick=function(){if(cfg.role!=='host'||!cfg.answered)return;pending=false;clearTimeout(pendingTimer);currentQKey=null;try{parent.postMessage({type:'roqaya-reading-next',roundId:cfg.roundId,turnIndex:Number(turnIndex)||1},location.origin)}catch(e){}};
$('#new').onclick=function(){if(cfg.role!=='host'||cfg.phase!=='finished')return;pending=false;clearTimeout(pendingTimer);currentQKey=null;try{parent.postMessage({type:'roqaya-reading-new',roundId:cfg.roundId},location.origin)}catch(e){}};
$('#city').onclick=function(){if(cfg.role==='host'){try{parent.postMessage({type:'roqaya-reading-city'},location.origin);}catch(e){}}};

function applyConfig(n){
  const newlyAnswered=Boolean(n.answered)&&!Boolean(cfg.answered);
  cfg=Object.assign({},cfg,n);
  if(n.turnIndex!==undefined) turnIndex=Number(n.turnIndex)||1;
  if(n.totalTurns!==undefined) totalTurns=Number(n.totalTurns)||10;
  if(n.level){ cfg.level=n.level; Q=buildQuestions(cfg.seed,cfg.level,cfg.rounds||10); }
  if(typeof n.answered==='boolean'){answered=n.answered;pending=false;clearTimeout(pendingTimer);}
  if(newlyAnswered){if(n.correct){SFX.ok();const q=Q[Math.min(totalTurns,turnIndex)-1];if(q)setTimeout(()=>speak(q.text),200)}else SFX.no();}
  paintPlayers(); show();
}

window.addEventListener('message',function(e){
  if(e.origin!==location.origin) return;
  if(!e.data || e.data.type!=='roqaya-reading-config') return;
  applyConfig(e.data.config||{});
});

paintPlayers(); show();
try{parent.postMessage({type:'roqaya-reading-ready'},location.origin);}catch(e){}
</script>
</body>
</html>
